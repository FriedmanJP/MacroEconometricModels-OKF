 a raw vector |\n| [apply_tcode](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/transform.jl) | `apply_tcode(d::TimeSeriesData, tcodes::Vector{Int})` | Per-variable FRED transforms, rows aligned |\n| [inverse_tcode](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/transform.jl) | `inverse_tcode(y, tcode::Int; x_prev=nothing)` | Reconstruct levels from a transformed series |\n| [DataDiagnostic](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/validation.jl) | `struct DataDiagnostic` | NaN/Inf/constant/short-sample diagnostic |\n| [diagnose](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/validation.jl) | `diagnose(d::AbstractMacroData)` | Scan a container for data problems |\n| [fix](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/validation.jl) | `fix(d::TimeSeriesData; method=:listwise)` | Clean copy via listwise, interpolate, or mean |\n| [dropna](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/validation.jl) | `dropna(d::TimeSeriesData; vars=nothing)` | Drop rows holding NaN or Inf |\n| [keeprows](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/validation.jl) | `keeprows(d::TimeSeriesData, idx::Vector{Int})` | Subset rows keeping metadata aligned |\n| [validate_for_model](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/validation.jl) | `validate_for_model(d::AbstractMacroData, model_type::Symbol)` | Check dimensionality a model family needs |\n| [xtset](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `xtset(df::DataFrame, group_col::Symbol, time_col::Symbol; cohort=nothing, ...)` | Build a PanelData Stata-style |\n| [isbalanced](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `isbalanced(d::PanelData)` | Whether every group has equal rows |\n| [groups](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `groups(d::PanelData)` | Group labels |\n| [ngroups](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `ngroups(d::PanelData)` | Number of groups |\n| [group_data](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `group_data(d::PanelData, g::String)` | Extract one group as TimeSeriesData |\n| [panel_summary](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `panel_summary(d::PanelData)` | Print panel structure summary |\n| [balance_panel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `balance_panel(pd::PanelData; method=:dfm, r=3, p=2)` | Fill NaN via DFM Kalman smoothing |\n| [panel_lag](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `panel_lag(pd::PanelData, var, k::Int=1)` | Within-group lag respecting gaps |\n| [panel_lead](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `panel_lead(pd::PanelData, var, k::Int=1)` | Within-group lead respecting gaps |\n| [panel_diff](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `panel_diff(pd::PanelData, var)` | Within-group first difference |\n| [add_panel_lag](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `add_panel_lag(pd::PanelData, var, k::Int=1)` | Append a `lag{k}_{var}` column |\n| [add_panel_lead](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `add_panel_lead(pd::PanelData, var, k::Int=1)` | Append a `lead{k}_{var}` column |\n| [add_panel_diff](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/panel.jl) | `add_panel_diff(pd::PanelData, var)` | Append a `d_{var}` column |\n| [describe_data](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/summary_stats.jl) | `describe_data(d::AbstractMacroData)` | Per-variable summary statistics table |\n| [DataSummary](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/summary_stats.jl) | `struct DataSummary` | Moments, quartiles, skew, kurtosis per variable |\n| [to_matrix](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/convert.jl) | `to_matrix(d::TimeSeriesData)` | Raw data matrix |\n| [to_vector](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/convert.jl) | `to_vector(d::TimeSeriesData, var::String)` | One column by name |\n| [estimate_var](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/convert.jl) | `estimate_var(d::TimeSeriesData, p::Int; kwargs...)` | Container dispatch; 40+ estimators share the pattern |\n| [apply_filter](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/filter.jl) | `apply_filter(d::TimeSeriesData, specs::AbstractVector; component=:cycle, ...)` | Per-variable trend-cycle filter |\n| [apply_filter](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/filter.jl) | `apply_filter(d::TimeSeriesData, spec::Union{Symbol, AbstractFilterResult}; vars=nothing, ...)` | One filter over all or selected variables |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfred = load_example(:fred_md)\nsub = fred[:, [\"INDPRO\", \"CPIAUCSL\", \"FEDFUNDS\"]]\nd = apply_tcode(sub)\nd = fix(d)\ndescribe_data(d)\nmodel = estimate_var(d, 2)\nreport(model)\n```\n\n# See also\n\n* [Shared Kernel](/infrastructure/core.md) - reproducibility, persistence, and tabular exports for containers\n* [Simulation (DGPs)](/infrastructure/dgp.md) - synthetic samples for Monte Carlo checks\n* [Visualization](/infrastructure/plotting.md) - container views (`:line`, `:corr`, panel views)\n* [Vector Autoregression](/multivariate/var.md) - estimation straight from a container\n* [Difference-in-Differences](/panel/did.md) - consumer of panel cohorts\n* [Input-Output Analysis](/io/io.md) - home of the `:wiot` example dataset", "infrastructure/dgp": "# Summary\n\nThe `dgp` module ships public data-generating processes for Monte Carlo experiments and estimator recovery checks. Every simulator takes an explicit `rng` first (never touching the global RNG), discards a burn-in for dynamic designs, and returns a NamedTuple pairing the simulated sample with population truth: coefficients, covariances, shocks, and latent paths. Coverage spans VARs (with population IRF/FEVD/HD helpers), non-Gaussian and heteroskedastic SVARs, univariate designs, cointegration/ARDL/panel VAR, the GARCH family plus SV/MGARCH/MIDAS, factor and mixed-frequency panels, LP/treatment designs, cross-section/panel/staggered-DiD, regime switching, GMM/policy-band/DSGE-measurement designs, and deterministic analytic-truth helpers.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [dgp_var](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_var.jl) | `dgp_var(rng::AbstractRNG; A, B0=nothing, Sigma=nothing, c=nothing, T=500, burn=200)` | Stationary VAR(p); returns `(Y, eps, A, Sigma, B0, c)` |\n| [lyapunov_gamma0](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_var.jl) | `lyapunov_gamma0(A, Sigma)` | Stationary covariance `\u0393_0` of a VAR(1) |\n| [var_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_var.jl) | `var_irf(A, B0, H::Int)` | Population `(H+1)\u00d7n\u00d7n` structural moving average |\n| [var_fevd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_var.jl) | `var_fevd(A, B0, H::Int)` | Population variance-decomposition shares |\n| [var_hd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_var.jl) | `var_hd(A, B0, eps; c=nothing)` | Population `T\u00d7n\u00d7n` historical shock contributions |\n| [dgp_nongaussian_var](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_svar_nongauss.jl) | `dgp_nongaussian_var(rng::AbstractRNG; A, B0, dist=:t, nu=5.0, T=1000, burn=200)` | VAR with independent non-Gaussian shocks |\n| [dgp_heteroskedastic_var](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_svar_nongauss.jl) | `dgp_heteroskedastic_var(rng::AbstractRNG; kind=:markov, Lambda, T=1000, burn=200, ...)` | VAR with Markov/GARCH/smooth/break variance path |\n| [dgp_arima](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_univariate.jl) | `dgp_arima(rng::AbstractRNG; phi, theta, d=0, Phi, Theta, s=0, c=0.0, sigma=1.0, T=500, burn=200)` | Seasonal ARIMA with Gaussian innovations |\n| [dgp_trend_cycle](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_univariate.jl) | `dgp_trend_cycle(rng::AbstractRNG; trend=:rw, drift=0.1, period=16.0, rho=0.9, ...)` | Random-walk/linear trend plus AR(2) cycle |\n| [dgp_ar2_peak](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_univariate.jl) | `dgp_ar2_peak(rng::AbstractRNG; period=8.0, modulus=0.9, sigma=1.0, T=1000, burn=200)` | AR(2) with analytic spectrum on a 256 grid |\n| [dgp_lagged_pair](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_univariate.jl) | `dgp_lagged_pair(rng::AbstractRNG; d=3, gain=2.0, T=1000, burn=200)` | Lagged pair with known phase and gain |\n| [dgp_state_space](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_univariate.jl) | `dgp_state_space(rng::AbstractRNG; F, H, Q, R, b=nothing, d=nothing, ...)` | Linear Gaussian state space with true state path |\n| [dgp_unit_root_pair](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_univariate.jl) | `dgp_unit_root_pair(rng::AbstractRNG; kind=:adf, T=200, ...)` | Null/alternative pairs for thirteen test families |\n| [dgp_vecm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_cointegration.jl) | `dgp_vecm(rng::AbstractRNG; alpha, beta, Gamma, mu=nothing, Sigma=nothing, T=400, burn=200)` | VECM with rank, adjustment, and short-run truth |\n| [dgp_cointreg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_cointegration.jl) | `dgp_cointreg(rng::AbstractRNG; beta, T=500, endog_rho=0.7, sigma_u=1.0, spurious=false)` | Cointegrating regression with endogenous errors |\n| [dgp_panel_var](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_cointegration.jl) | `dgp_panel_var(rng::AbstractRNG; A1, N=30, T=25, mu_sd=1.0, Sigma=nothing, burn=50)` | Panel VAR(1) with random effects, stacked output |\n| [dgp_ardl](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_cointegration.jl) | `dgp_ardl(rng::AbstractRNG; phi=0.6, beta0=0.8, beta1=0.4, rho_x=0.7, c=0.5, T=300, burn=100)` | ARDL(1,1) with long-run multiplier truth |\n| [dgp_nardl](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_cointegration.jl) | `dgp_nardl(rng::AbstractRNG; phi=0.6, beta_pos=0.9, beta_neg=0.3, ...)` | NARDL with partial sums and asymmetric multipliers |\n| [dgp_pmg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_cointegration.jl) | `dgp_pmg(rng::AbstractRNG; theta=1.5, N=20, T=50, homogeneous=true, burn=50)` | Panel ARDL with common or heterogeneous long run |\n| [dgp_garch_family](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_volatility.jl) | `dgp_garch_family(rng::AbstractRNG; kind=:garch, omega=0.02, alpha=0.08, beta=0.88, innov=:gauss, T=3000, burn=500, ...)` | Nine-kind GARCH family; returns `(y, h, eps)` |\n| [dgp_sv](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_volatility.jl) | `dgp_sv(rng::AbstractRNG; mu=-0.5, phi=0.95, sigma_eta=0.2, rho_lev=0.0, nu=Inf, T=1500, burn=200)` | Stochastic volatility with leverage and t shocks |\n| [dgp_mgarch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_volatility.jl) | `dgp_mgarch(rng::AbstractRNG; kind=:ccc, n=2, T=1000, R, a=0.05, b=0.9, ...)` | CCC/DCC/BEKK with true covariance path |\n| [dgp_midas](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_volatility.jl) | `dgp_midas(rng::AbstractRNG; m=3, K=12, T_lf=200, theta, kind=:expalmon, beta=1.0, ...)` | MIDAS with normalized true weights |\n| [dgp_dynamic_factors](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_factors.jl) | `dgp_dynamic_factors(rng::AbstractRNG; A, Lambda=nothing, r=2, p=1, N=40, T=400, ...)` | Dynamic factor model with VAR(p) factors |\n| [dgp_mixed_frequency_panel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_factors.jl) | `dgp_mixed_frequency_panel(rng::AbstractRNG; A, Lambda_M=nothing, Lambda_Q=nothing, r=2, nM=10, nQ=2, T=240, ...)` | Monthly plus quarterly Mariano-Murasawa ragged panel |\n| [dgp_lp_iv](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_lp.jl) | `dgp_lp_iv(rng::AbstractRNG; T=400, pi1=1.5, theta=1.0)` | LP-IV with instrument, endogenous shock, outcome |\n| [dgp_state_dependent_var](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_lp.jl) | `dgp_state_dependent_var(rng::AbstractRNG; A_exp, A_rec, B0, gamma=3.0, T=2000, burn=200, H=12)` | Two-regime VAR with logistic transition and regime IRFs |\n| [dgp_propensity](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_lp.jl) | `dgp_propensity(rng::AbstractRNG; beta_ps, tau=1.0, gamma_y, confounding=true, n=2000)` | Confounded selection with known ATT |\n| [dgp_hac](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_lp.jl) | `dgp_hac(rng::AbstractRNG; rho=0.5, T=2000, k=1, x_first=false)` | AR(1)-error regression with population long-run variance |\n| [dgp_cross_section](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_micro.jl) | `dgp_cross_section(rng::AbstractRNG; kind=:ols, beta, n=1000, ...)` | Fifteen-kind cross-section with kind-specific truth |\n| [dgp_panel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_micro.jl) | `dgp_panel(rng::AbstractRNG; N=200, T=20, beta, sigma_u=1.0, sigma_e=1.0, ...)` | Linear/logit/probit panel with Mundlak effects |\n| [dgp_staggered_did](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_micro.jl) | `dgp_staggered_did(rng::AbstractRNG; cohorts, tau, never_treated_share=0.3, N=300, T=25, ...)` | Staggered adoption with heterogeneous effects |\n| [dgp_regime_switching](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_regime.jl) | `dgp_regime_switching(rng::AbstractRNG; kind=:ms, T=600, burn=100, ...)` | Markov-switching, SETAR, LSTAR, and ESTR designs |\n| [dgp_gmm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_gmm.jl) | `dgp_gmm(rng::AbstractRNG; kind=:iv, beta, n=1000, hetero=true, overid_k=2, invalid_k=0, pi1=1.0)` | Heteroskedastic GMM with optional invalid instruments |\n| [dgp_pce_draws](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_gmm.jl) | `dgp_pce_draws(rng::AbstractRNG, ce_point; sd=0.1, corr=0.0, n_draws=500)` | Policy-menu draws with known noise scale |\n| [dgp_dsge_observed](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_gmm.jl) | `dgp_dsge_observed(rng::AbstractRNG, y_clean; H=nothing, trends=nothing)` | DSGE observation equation with measurement error |\n| [arma_spectrum](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_truth.jl) | `arma_spectrum(phi, theta, sigma, freqs)` | Closed-form ARMA spectral density |\n| [mm_aggregate](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_truth.jl) | `mm_aggregate(F, Lambda_Q; weights=[1, 2, 3, 2, 1])` | Mariano-Murasawa quarterly aggregation |\n| [logit_ame](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_truth.jl) | `logit_ame(X, beta)` | Closed-form logit average marginal effects |\n| [probit_ame](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dgp/dgp_truth.jl) | `probit_ame(X, beta)` | Closed-form probit average marginal effects |\n\n# Examples\n\n```julia\nusing MacroEconometricModels, Random, LinearAlgebra\nsim = dgp_var(MersenneTwister(11); T=200)\nfit = estimate_var(sim.Y, 1)\nmaximum(abs.(fit.Sigma - sim.Sigma))\nest_irf = compute_irf(fit, Matrix{Float64}(I, 3, 3), 11)\nmaximum(abs.(est_irf - var_irf(sim.A, sim.B0, 10)))\n```\n\n# See also\n\n* [Data Management](/infrastructure/data.md) - observed datasets complementing simulated ones\n* [Shared Kernel](/infrastructure/core.md) - innovation-accounting estimators the population moments validate\n* [Vector Autoregression](/multivariate/var.md) - OLS recovery on `dgp_var` draws\n* [ARIMA Models](/univariate/arima.md) - recovery on `dgp_arima` draws\n* [Hypothesis Tests](/testing/teststat.md) - size/power checks on `dgp_unit_root_pair`", "infrastructure/gmm": "# Summary\n\nThe `gmm` module estimates any model with population moment conditions `E[g(\u03b8)] = 0` by minimizing the quadratic form `Q(\u03b8) = g(\u03b8)' W g(\u03b8)`. `estimate_gmm` offers `:identity`, `:optimal`, `:two_step`, and `:iterated` weighting with HAC long-run covariance for serially correlated moments, an LBFGS optimizer with Nelder-Mead fallback, optional box constraints via `ParameterTransform` (with delta-method standard errors), and a Stock-Yogo first-stage F when `X`/`Z` are supplied. Overidentification is tested with Hansen's J (chi-squared only under efficient weighting) and compared across moment sets with Andrews-Lu MMSC. `estimate_smm` replaces analytic moments with simulated ones (Nelder-Mead first, LBFGS fallback), inflating the covariance by `(1 + 1/\u03c4)`; both result types share the `AbstractGMMModel` StatsAPI interface.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_gmm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `estimate_gmm(moment_fn, theta0, data; weighting=:two_step, max_iter=100, tol=1e-8, hac=true, bandwidth=0, bounds=nothing, X=nothing, Z=nothing, endogenous=nothing)` | GMM estimation under four weighting schemes |\n| [GMMModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `struct GMMModel{T} <: AbstractGMMModel` | Fitted GMM: estimates, vcov, J-test, first-stage F |\n| [GMMWeighting](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `GMMWeighting(; method=:two_step, max_iter=100, tol=1e-8)` | Weighting specification stored on fits |\n| [AbstractGMMModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `abstract type AbstractGMMModel <: StatsAPI.StatisticalModel` | Shared supertype for GMM and SMM results |\n| [gmm_objective](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `gmm_objective(theta, moment_fn, data, W)` | Scalar criterion `g(\u03b8)' W g(\u03b8)` |\n| [numerical_gradient](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `numerical_gradient(f::Function, x; step=1e-7)` | Central-difference Jacobian of moment means |\n| [identity_weighting](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `identity_weighting(n_moments::Int)` | Identity weighting matrix for one-step GMM |\n| [optimal_weighting_matrix](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `optimal_weighting_matrix(moment_fn, theta, data; hac=true, bandwidth=0)` | Efficient `\u03a9\u207b\u00b9` weighting matrix |\n| [minimize_gmm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `minimize_gmm(moment_fn, theta0, data, W; max_iter=100, tol=1e-8)` | LBFGS minimization with Nelder-Mead fallback |\n| [j_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `j_test(model::GMMModel)` | Hansen J-test for overidentifying restrictions |\n| [gmm_summary](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `gmm_summary(model::GMMModel)` | Coefficients, standard errors, and J-test in one NamedTuple |\n| [andrews_lu_mmsc](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `andrews_lu_mmsc(j_stat, n_instruments::Int, n_params::Int, n_obs::Int; hq_criterion=2.1)` | Andrews-Lu BIC/AIC/HQIC moment selection criteria |\n| [linear_gmm_solve](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `linear_gmm_solve(S_ZX, S_Zy, W)` | Closed-form linear IV-GMM from cross-products |\n| [gmm_sandwich_vcov](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `gmm_sandwich_vcov(S_ZX, W, D_e)` | Robust one-step sandwich covariance |\n| [estimate_lp_gmm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `estimate_lp_gmm(Y, shock_var::Int, horizon::Int; lags=4, weighting=:two_step)` | Local projection via GMM per horizon |\n| [lp_gmm_moments](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/gmm.jl) | `lp_gmm_moments(Y, shock_var::Int, h::Int, theta, lags::Int)` | LP moment conditions `E[Z_t \u03b5_{t+h}] = 0` |\n| [estimate_smm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/smm.jl) | `estimate_smm(simulator_fn, moments_fn, theta0, data; sim_ratio=5, burn=100, weighting=:two_step, contributions_fn=nothing, bounds=nothing, hac=true, bandwidth=0, max_iter=1000, tol=1e-8, rng=...)` | Simulated method of moments estimation |\n| [SMMModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/smm.jl) | `struct SMMModel{T} <: AbstractGMMModel` | Fitted SMM, sharing every GMMModel field plus `sim_ratio` |\n| [j_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/smm.jl) | `j_test(m::SMMModel)` | Hansen J-test on an SMM fit |\n| [autocovariance_moments](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/smm.jl) | `autocovariance_moments(data; lags=1, standardize=false)` | Variance-covariance plus diagonal autocovariance vector |\n| [autocovariance_moment_contributions](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/smm.jl) | `autocovariance_moment_contributions(data; lags=1, standardize=false)` | Per-observation contributions matching the moment vector |\n| [smm_weighting_matrix](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/smm.jl) | `smm_weighting_matrix(data, contributions_fn; hac=true, bandwidth=0)` | Optimal SMM weighting from contribution HAC |\n| [smm_data_covariance](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/smm.jl) | `smm_data_covariance(data, contributions_fn; hac=true, bandwidth=0)` | Long-run moment covariance for sandwich standard errors |\n| [ParameterTransform](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/transforms.jl) | `ParameterTransform(lower::Vector, upper::Vector)` | Bijective box-constraint transform specification |\n| [to_unconstrained](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/transforms.jl) | `to_unconstrained(pt::ParameterTransform, theta)` | Map model space to optimizer space |\n| [to_constrained](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/transforms.jl) | `to_constrained(pt::ParameterTransform, phi)` | Map optimizer space to model space |\n| [log_jacobian](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/transforms.jl) | `log_jacobian(pt::ParameterTransform, phi)` | Log absolute Jacobian for density correction |\n| [transform_jacobian](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/gmm/transforms.jl) | `transform_jacobian(pt::ParameterTransform, phi)` | Diagonal Jacobian for delta-method standard errors |\n\n# Examples\n\n```julia\nusing MacroEconometricModels, Random\nRandom.seed!(400)\nn = 500\nZ = randn(n, 3)\nu = randn(n)\nX = Z * [0.5, 0.3, 0.2] .+ 0.5 .* u\ny = 2.0 .* X .+ u\ndata = hcat(y, X, Z)\niv_moments(theta, d) = d[:, 3:5] .* (d[:, 1] .- d[:, 2] .* theta[1])\nm = estimate_gmm(iv_moments, [0.0], data; weighting=:two_step,\n                 X=reshape(X, :, 1), Z=Z)\nreport(m)\n```\n\n# See also\n\n* [Simulation (DGPs)](/infrastructure/dgp.md) - `dgp_gmm` designs with heteroskedastic and invalid-instrument arms\n* [Shared Kernel](/infrastructure/core.md) - HAC covariance behind the optimal weighting matrix\n* [Local Projections](/multivariate/lp.md) - LP estimators including the GMM route\n* [Panel VAR](/panel/pvar.md) - panel consumer of the linear GMM utilities\n* [DSGE Models](/dsge/dsge.md) - DSGE estimation with `method=:smm`", "infrastructure/plotting": "# Summary\n\nThe `plotting` module renders every plottable result through one entry point, `plot_result`, returning a `PlotOutput` that wraps a self-contained HTML document: D3.js v7 is vendored offline and inlined, so plots render identically air-gapped, and documents are theme-aware (light/dark). The exported surface is exactly `plot_result`, `PlotOutput`, `save_plot`, and `display_plot`; all other plotting names are internal. A standardized keyword vocabulary (`var`, `shock`, `vars`, `view`, `ncols`, `title`, `save_path`, `history`/`n_history`, `stat`) carries identical meaning across dispatches, multi-view results switch exhibits with `view=`, and name-or-index selection raises `ArgumentError` on unknown names. The table shows the exported surface plus representative dispatches; the full dispatch catalog (100+ methods across 40 source files) is generated at docs build time from `methods(plot_result)`.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [plot_result](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/plotting/irf.jl) | `plot_result(r::ImpulseResponse; var=nothing, shock=nothing, ncols=0, title=\"\", save_path=nothing)` | IRF panels with confidence bands and zero reference |\n| [plot_result](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/plotting/irf.jl) | `plot_result(r::BayesianImpulseResponse; var=nothing, shock=nothing, stat=:median, draws=0, ...)` | Bayesian IRF as nested posterior credible fans |\n| [plot_result](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/plotting/irf.jl) | `plot_result(r::LPImpulseResponse; var=nothing, ncols=0, title=\"\", save_path=nothing)` | LP IRFs with robust confidence bands |\n| [plot_result](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/plotting/timeseries.jl) | `plot_result(d::TimeSeriesData; view=:line, vars=nothing, ...)` | Container views: line, scatter, hist, density, corr, growth, binscatter |\n| [PlotOutput](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/plotting/types.jl) | `struct PlotOutput` | Self-contained HTML document plus embeddable fragment |\n| [save_plot](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/plotting/render.jl) | `save_plot(p::PlotOutput, path::String)` | Write the HTML visualization to a file |\n| [display_plot](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/plotting/render.jl) | `display_plot(p::PlotOutput)` | Open the visualization in the default browser |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfred = load_example(:fred_md)\nY = to_matrix(apply_tcode(fred[:, [\"INDPRO\", \"CPIAUCSL\", \"FEDFUNDS\"]]))\nY = Y[all.(isfinite, eachrow(Y)), :]\nm = estimate_var(Y, 4)\nr = irf(m, 20; ci_type=:bootstrap, reps=500)\np = plot_result(r)\nsave_plot(p, \"irf_plot.html\")\n```\n\n# See also\n\n* [Data Management](/infrastructure/data.md) - containers and the `:corr`/`:growth` views over them\n* [Shared Kernel](/infrastructure/core.md) - IRF/FEVD/HD results that feed the plots\n* [Simulation (DGPs)](/infrastructure/dgp.md) - synthetic samples for gallery-style exhibits\n* [Forecast Evaluation](/forecasting/fceval.md) - metric and Theil views of forecast comparisons\n* [Vector Autoregression](/multivariate/var.md) - the canonical plotted model", "io/io": "# Summary\n\nThe `io` module implements demand-driven (Leontief 1936) and supply-driven (Ghosh 1958) input-output analysis over a single `IOData` container holding intermediate flows `Z`, final demand `Y`, value added `va`, gross output `x`, labels, and satellite accounts, with row and column accounting balances validated at construction.\nClassical tools (multipliers, Rasmussen linkages, SDA, RAS/GRAS, hypothetical extraction, price dual, impact scenarios, network statistics) are linear in the Leontief inverse; environmental extensions push satellite accounts through that same inverse for consumption-based footprints; the MRIO layer adds KWW (2014) export decompositions; and the Baqaee-Farhi layer reinterprets the table as a nested-CES production network for exact nonlinear counterfactuals.\nDownloaders fetch the five public MRIO databases (OECD ICIO, WIOD, EXIOBASE 3, EORA26, GLORIA) with SHA-256 verification, and `parse_icio` / `parse_wiod` turn them into `IOData`.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [IOData](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/types.jl) | `IOData(Z, Y, va; sectors, regions, fd_cats, va_cats, unit, year, source, meta, check)` | Container constructor; derives `x` from the row balance and validates both balances |\n| [technical_coefficients](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/coefficients.jl) | `technical_coefficients(io::IOData)` | Technical-coefficients matrix `A = Z x\u0302\u207b\u00b9` |\n| [leontief_inverse](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/coefficients.jl) | `leontief_inverse(io::IOData)` | Total-requirements matrix `L = (I - A)\u207b\u00b9` |\n| [allocation_coefficients](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/coefficients.jl) | `allocation_coefficients(io::IOData)` | Allocation-coefficients matrix `B = x\u0302\u207b\u00b9 Z` |\n| [ghosh_inverse](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/coefficients.jl) | `ghosh_inverse(io::IOData)` | Supply-driven inverse `G = (I - B)\u207b\u00b9` |\n| [leontief](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/coefficients.jl) | `leontief(io::IOData)` | Bundled coefficients, inverse, output, and table back-reference |\n| [ghosh](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/coefficients.jl) | `ghosh(io::IOData)` | Bundled allocation coefficients, Ghosh inverse, and output |\n| [multipliers](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/multipliers.jl) | `multipliers(io::IOData; kind=:output, type=:I)` | Output, income, or employment multipliers, Type I (open) or Type II (closed) |\n| [linkages](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/linkages.jl) | `linkages(io::IOData; forward=:ghosh)` | Backward/forward linkages, Rasmussen indices, and key-sector classification |\n| [key_sectors](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/linkages.jl) | `key_sectors(io::IOData)` | Per-sector `:key` / `:forward` / `:backward` / `:weak` classification (`rasmussen` is an alias of `linkages`) |\n| [sda](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/sda.jl) | `sda(io0::IOData, io1::IOData; method=:additive, factors=nothing, on=:output)` | Additive n-factor or multiplicative two-factor structural decomposition |\n| [ras](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/ras.jl) | `ras(A0, u, v; tol=1e-10, maxiter=1000)` | Biproportional RAS rebalance of a matrix to new margins |\n| [gras](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/ras.jl) | `gras(A0, u, v; tol=1e-10, maxiter=1000)` | Generalized RAS allowing negative entries |\n| [balance](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/ras.jl) | `balance(io::IOData; method=:ras, tol=1e-10, maxiter=1000)` | Repair a table's intermediate flows via RAS/GRAS |\n| [hypothetical_extraction](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/extraction.jl) | `hypothetical_extraction(io::IOData, sectors; mode=:complete, share=1.0, region=nothing)` | Complete, backward, forward, or partial extraction loss of a sector |\n| [price_model](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/price.jl) | `price_model(io::IOData; dva=nothing, dtax=nothing, mode=:leontief)` | Leontief cost-push price dual `\u0394p = (I - A')\u207b\u00b9 \u0394v` |\n| [impact](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/impact.jl) | `impact(io::IOData, dy; kind=:output, type=:I, fix=Dict())` | Final-demand shock scenario through `L`, with Type II and mixed-model options |\n| [network_stats](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/network.jl) | `network_stats(io::IOData)` | Domar concentration, average propagation lengths, degree structure |\n| [add_extension!](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/environmental.jl) | `add_extension!(io::IOData, name, F::AbstractMatrix; stressors, unit, F_Y=nothing)` | Attach a satellite account (physical flows) to the table in place |\n| [intensities](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/environmental.jl) | `intensities(io::IOData, name::AbstractString)` | Direct stressor intensities `S = F x\u0302\u207b\u00b9` of an extension |\n| [emission_multipliers](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/environmental.jl) | `emission_multipliers(io::IOData, name::AbstractString)` | Consumption-based multipliers `M = S L` of an extension |\n| [footprint](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/environmental.jl) | `footprint(io::IOData, name::AbstractString; by=:sector)` | Consumption-based footprint by sector (`:sector`) or production-vs-consumption by region (`:region`) |\n| [aggregate](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/mrio.jl) | `aggregate(io::IOData; region_map=nothing, sector_map=nothing)` | Collapse regions and sector types, carrying satellite accounts along |\n| [region_block](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/mrio.jl) | `region_block(io::IOData, r, s)` | `N \u00d7 N` intermediate block from supplying region `r` to using region `s` |\n| [region_indices](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/mrio.jl) | `region_indices(io::IOData, region)` | Row/column indices of a region (name or 1-based index) |\n| [bilateral_trade](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/mrio.jl) | `bilateral_trade(io::IOData, exporter, importer; kind=:total)` | Bilateral intermediate, final, and total exports |\n| [gross_exports](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/mrio.jl) | `gross_exports(io::IOData, region)` | Sectoral exports of a region to all other regions |\n| [vertical_specialization](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/mrio.jl) | `vertical_specialization(io::IOData, region=nothing)` | Hummels-Ishii-Yi import content of exports |\n| [export_decomposition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/mrio.jl) | `export_decomposition(io::IOData, region=nothing)` | Koopman-Wang-Wei (2014) DVA/RDV/FVA/PDC export decomposition |\n| [domar_weights](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/baqaee_farhi.jl) | `domar_weights(io::IOData)` | Domar weights (sales over GDP); first-order GDP elasticities via Hulten's theorem |\n| [baqaee_farhi](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/baqaee_farhi.jl) | `baqaee_farhi(io::IOData; theta=nothing, sigma=nothing)` | Second-order \"beyond Hulten\" Hessian on a table under scalar elasticities |\n| [production_network](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_network.jl) | `production_network(io::IOData; theta=1.0, sigma=1.0, epsilon=1.0, eta=1.0, ...)` | Standard-form nested-CES `ProductionNetwork` with heterogeneous elasticities and markups |\n| [baqaee_farhi](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_hessian.jl) | `baqaee_farhi(net::ProductionNetwork; hessian=:auto, elasticities=true)` | Generalized multi-factor local approximation on a standard-form network |\n| [bf_equilibrium](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_equilibrium.jl) | `bf_equilibrium(net::ProductionNetwork; dlogA=nothing, dlogL=nothing, dlogmu=nothing, method=:newton, ...)` | Exact nonlinear equilibrium for large productivity, factor-supply, and markup shocks |\n| [bf_elasticities](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_hessian.jl) | `bf_elasticities(net::ProductionNetwork)` | Factor-price, goods-price, and Domar-share incidence of productivity shocks |\n| [bf_quadratic](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_hessian.jl) | `bf_quadratic(net::ProductionNetwork, v::AbstractVector)` | Second-order GDP change along a productivity direction |\n| [bf_shock_curve](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_hessian.jl) | `bf_shock_curve(net::ProductionNetwork, sector; range=(-0.5, 0.5), points=41, ...)` | Exact vs Hulten vs second-order GDP response over a shock range |\n| [bf_wedge_decomp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_wedges.jl) | `bf_wedge_decomp(net::ProductionNetwork; dlogA=nothing, dlogmu=nothing, dlogL=nothing, ...)` | B&F (2020) Theorem 1 technology vs allocative-efficiency decomposition |\n| [cost_based_domar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_wedges.jl) | `cost_based_domar(net::ProductionNetwork)` | Cost-based Domar weights under markups |\n| [revenue_based_domar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_wedges.jl) | `revenue_based_domar(net::ProductionNetwork)` | Revenue-based Domar weights under markups |\n| [bf_misallocation](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_misalloc.jl) | `bf_misallocation(net::ProductionNetwork; point=:efficient, hessian=:auto)` | Proposition 5 Harberger misallocation from markups |\n| [bf_wedge_quadratic](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/bf_misalloc.jl) | `bf_wedge_quadratic(net::ProductionNetwork, v::AbstractVector; point=:efficient)` | Second-order GDP change along a markup direction |\n| [list_io_sources](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/download/registry.jl) | `list_io_sources()` | Catalog of the five fetchable MRIO sources with versions and credential needs |\n| [download_io](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/download/sources.jl) | `download_io(source::Symbol; storage_folder, years=nothing, ...)` | Dispatching downloader returning an `IOMetaData` provenance log |\n| [download_oecd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/download/sources.jl) | `download_oecd(folder; version=\"v2023\", years=nothing, ...)` | Per-source downloaders (`download_oecd`, `download_wiod`, `download_exiobase3`, `download_eora26`, `download_gloria`); EORA26 throws with the manual route |\n| [parse_io](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/parse.jl) | `parse_io(path::AbstractString; source::Symbol, year=nothing, ...)` | Parse a delimited table (CSV/TSV) or dispatch ZIP/XLSX to extensions |\n| [parse_icio](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/parse.jl) | `parse_icio(path::AbstractString; year=nothing, member=\"\", ...)` | Labeled MRIO recipe for OECD ICIO archives |\n| [parse_wiod](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/parse.jl) | `parse_wiod(path::AbstractString; year=nothing, sheet=1, ...)` | Labeled MRIO recipe for WIOD 2013 workbooks |\n| [io_file_digest](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/io/download/registry.jl) | `io_file_digest(path::AbstractString)` | SHA-256 hex digest of a downloaded archive for the integrity registry |\n\nResult types (`IOMultipliers`, `LinkageResult`, `SDAResult`, `RASResult`, `ExtractionResult`, `PriceModelResult`, `ImpactResult`, `NetworkStatsResult`, `FootprintResult`, `RegionalFootprintResult`, `VerticalSpecialization`, `ExportDecomposition`, `BaqaeeFarhiResult`, `BFLocal`, `BFElasticities`, `BFShockCurve`, `BFWedgeDecomp`, `BFMisallocation`, `BFEquilibrium`, `IOExtension`, `IOMetaData`) are omitted from the table; see `src/io` for their fields.\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nio = load_example(:wiot)\nmultipliers(io; kind=:output, type=:I)\nlinkages(io)\nfootprint(io, \"CO2\")\n```\n\n# See also\n\n* [Policy Counterfactuals](/policy-counterfactuals/counterfactual.md) - alternative-policy projections built from estimated causal effects\n* [Vector Autoregression (VAR)](/multivariate/var.md) - reduced-form dynamics underlying empirical policy menus\n* [Forecasting](/forecasting/index.md) - forecast evaluation and conditioning workflows\n* [Nonparametric Regression and Density](/nonparametric/nonparametric.md) - flexible estimation without parametric form", "log": "# Update log\n\n## 2026-09-25\n\n- Bundle initialized at the repository root as an OKF v0.2 bundle\n  (`okf_version: \"0.2\"` in the root `index.md`).\n- Added the skeleton: root `index.md`, `overview.md` (`type: Package`),\n  and this `log.md`.\n- Added conformance tooling: `scripts/validate_okf.py` and\n  `.github/workflows/okf-validate.yml` (checks frontmatter, reserved-file\n  structure, bundle-relative links, and log date headings on push and\n  pull request).\n- Upstream provenance pinned to `MacroEconometricModels.jl` commit\n  `3d12bb6c`; domain `index.md` stubs and feature concepts follow in the\n  pilot and full-coverage passes.\n- Full-coverage pass complete: 39 `type: Feature` concepts across 12\n  domain directories (`univariate`, `nonlinear-statespace`,\n  `multivariate`, `panel`, `dsge`, `io`, `nonparametric`,\n  `policy-counterfactuals`, `cross-section`, `forecasting`, `testing`,\n  `infrastructure`), each grounded in upstream `docs/src` and `src`\n  docstrings at `3d12bb6c`, all `status: draft` pending human review.\n- Fixed four bundle-relative cross-links (`panel/preg.md`,\n  `panel/pvar.md`, `testing/teststat.md`); `scripts/validate_okf.py`\n  passes clean (54 files).\n- Human review sign-off (Q1): `chung9207` approved all 39 Feature\n  concepts and the package overview; `status` flipped from `draft` to\n  `approved` with `reviewed_by`/`reviewed_at` recorded.\n- License decision (Q2): bundle licensed under Apache License 2.0\n  (`LICENSE`, copyright 2026 Wookyung Chung), matching the upstream\n  open-knowledge-format project.\n- Normalized all concept cross-links to bundle-root-relative\n  (`/domain/concept.md`, the OKF viewer convention) and migrated\n  `reviewed_by`/`reviewed_at` to the spec `verified` key, so concepts\n  derive the `human-reviewed` trust tier (\u00a75.3).\n- Added the static viewer site: `site/build.py` plus the vendored OKF\n  visualizer (`site/vendor/`, upstream `ad30107`, patched link\n  extraction and palette) render 41 concepts / 142 edges to a\n  self-contained `index.html`; `.github/workflows/site.yml` deploys it\n  to `gh-pages`, served at\n  `https://api.friedman.jp/MacroEconometricModels-OKF/`.", "multivariate/bvar": "# Summary\n\nThe `bvar` module estimates VARs with the Minnesota prior (Litterman 1986) implemented via dummy observations, conjugate Normal-Inverse-Wishart posteriors, and data-driven hyperparameter selection through the closed-form marginal likelihood (Giannone, Lenza & Primiceri 2015).\n`estimate_bvar` samples the posterior either i.i.d. from the analytical posterior (`:direct`) or with a two-block Gibbs sampler (`:gibbs`); `irf`, `fevd`, `historical_decomposition`, and `forecast` then propagate full parameter uncertainty into credible bands.\nExtensions cover time-varying parameters with stochastic volatility (`estimate_tvpvar`) and mixed-frequency panels (`estimate_mfvar`).\nScale data to percent-like units before estimating: the prior scale is not unit-invariant.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_bvar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/estimation.jl) | `estimate_bvar(Y, p; n_draws=1000, sampler=:direct, burnin=0, thin=1, prior=:normal, hyper=nothing, hyperopt=:glp, varnames=nothing, seed=nothing, rng)` | Posterior sampling under diffuse or Minnesota prior; returns `BVARPosterior` |\n| [gen_dummy_obs](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/priors.jl) | `gen_dummy_obs(Y, p, hyper::MinnesotaHyperparameters)` | Minnesota prior dummy observations |\n| [log_marginal_likelihood](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/priors.jl) | `log_marginal_likelihood(Y, p, hyper::MinnesotaHyperparameters)` | Closed-form marginal likelihood for hyperparameter choice |\n| [optimize_hyperparameters](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/priors.jl) | `optimize_hyperparameters(Y, p; grid_size=20, tau_range=(0.01, 10.0))` | Tau-only grid search on the marginal likelihood |\n| [optimize_hyperparameters_full](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/priors.jl) | `optimize_hyperparameters_full(Y, p; tau_grid, lambda_grid, mu_grid)` | Joint grid over tau, lambda, and mu for large systems |\n| [optimize_hyperparameters_glp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/glp.jl) | `optimize_hyperparameters_glp(Y, p; decay=0.5, omega=1.0, starts=4, max_iter=500, f_reltol=1e-8, verbose=true)` | GLP (2015) joint optimization with Gamma hyperpriors |\n| [posterior_mean_model](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/estimation.jl) | `posterior_mean_model(post::BVARPosterior; data)` | Posterior-mean summary as a `VARModel` |\n| [posterior_median_model](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/estimation.jl) | `posterior_median_model(post::BVARPosterior; data)` | Posterior-median summary as a `VARModel` |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/estimation.jl) | `forecast(post::BVARPosterior, h::Int; reps=nothing, conf_level=0.95, point_estimate=:mean, store_draws=false, rng)` | Predictive simulation with credible intervals |\n| [conditional_forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/conditional_forecast.jl) | `conditional_forecast(post::BVARPosterior, conditions, h::Int; ...)` | Conditional forecast over posterior draws |\n| [estimate_tvpvar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/tvpvar.jl) | `estimate_tvpvar(Y, p; tvp=true, sv=true, n_draws=2000, n_burn=1000, thin=1, n_train=0, k_Q=0.01, k_S=0.1, k_W=0.01, varnames, seed=nothing, rng)` | TVP-VAR with stochastic volatility via Gibbs sampling |\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/tvpvar.jl) | `irf(post::TVPVARPosterior, horizon::Int; t=post.T_eff, n_draws=500, quantile_levels, stationary_only=true)` | Time-`t` impulse responses from TVP draws |\n| [volatility_path](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/tvpvar.jl) | `volatility_path(post::TVPVARPosterior; quantile_levels=[0.16, 0.5, 0.84])` | Posterior volatility path with quantiles |\n| [estimate_mfvar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/mfvar.jl) | `estimate_mfvar(data, p; low_freq=Int[], freq_ratio=3, aggregation=:growth, n_draws=1000, n_burn=500, prior=:minnesota, hyper=nothing, varnames, seed=nothing, rng)` | Mixed-frequency VAR with latent high-frequency states |\n| [latent_path](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/mfvar.jl) | `latent_path(post::MFVARPosterior; quantile_levels=[0.16, 0.5, 0.84])` | Posterior latent high-frequency path with quantiles |\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/mfvar.jl) | `irf(post::MFVARPosterior, horizon::Int; kwargs...)` | Impulse responses via the latent-state BVAR |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/mfvar.jl) | `forecast(post::MFVARPosterior, h::Int; kwargs...)` | Forecasts via the latent-state BVAR |\n| [BVARPosterior](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/types.jl) | `struct BVARPosterior{T}` | Posterior draws of `(B, Sigma)` with prior metadata |\n| [BVARForecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/types.jl) | `struct BVARForecast{T}` | Predictive draws with credible bands |\n| [TVPVARPosterior](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/tvpvar.jl) | `struct TVPVARPosterior{T}` | TVP coefficient and volatility draws |\n| [MFVARPosterior](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/mfvar.jl) | `struct MFVARPosterior{T}` | Mixed-frequency posterior with latent states |\n| [GLPHyperparameters](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/bvar/glp.jl) | `struct GLPHyperparameters{T}` | Jointly optimized GLP hyperparameters |\n| [MinnesotaHyperparameters](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/types.jl) | `MinnesotaHyperparameters(; tau=3.0, decay=0.5, ...)` | Minnesota tightness, lag decay, cross-variable shrinkage |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\npost = estimate_bvar(Y, 2; n_draws=100, prior=:minnesota,\n                     varnames=[\"INDPRO\", \"CPI\", \"FFR\"])\nreport(post)\nbirf = irf(post, 20; method=:cholesky)\nreport(birf)\nfc = forecast(post, 12; conf_level=0.95)\nreport(fc)\n```\n\n# See also\n\n* [Vector Autoregression](/multivariate/var.md) - frequentist counterpart and summary-model type\n* [Vector Error Correction Models](/multivariate/vecm.md) - cointegrated systems\n* [Local Projections](/multivariate/lp.md) - non-Bayesian direct impulse-response estimation\n* [Factor Models](/multivariate/factor.md) - dimension reduction for large Bayesian systems", "multivariate/cointreg": "# Summary\n\nThe `cointreg` module estimates a single cointegrating vector for `y_t` on `I(1)` regressors `x_t` with three asymptotically efficient, endogeneity-corrected estimators: FMOLS (Phillips-Hansen 1990) via an endogeneity-purged regressand plus a one-sided long-run-covariance bias correction, CCR (Park 1992) via a canonical data transformation followed by plain OLS, and DOLS (Saikkonen 1991; Stock-Watson 1993) via leads and lags of `\u0394x_t` with automatic AIC/BIC selection.\nAll three build on the shared `lrcov`/`lrcov_oneside` HAC toolkit and return a `CointRegModel` exposing the stacked `(u, \u0394x)` long-run covariance pieces (`Omega`, `Lambda`, `Sigma`, `omega_uv`) for downstream tests.\n`estimate_xtcointreg` aggregates per-unit fits into group-mean (Pedroni 2001) or pooled (Pedroni 2000 FMOLS / Kao-Chiang 2000 DOLS) panel cointegrating regressions.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_cointreg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/cointreg/fmols.jl) | `estimate_cointreg(y, X; method=:fmols, trend=:const, kernel=:bartlett, bandwidth=:andrews, leads=:auto, lags=:auto, ic=:aic, dols_se=:lrv)` | Single-equation FMOLS/CCR/DOLS estimation; returns `CointRegModel` |\n| [estimate_xtcointreg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/cointreg/panel.jl) | `estimate_xtcointreg(pd::PanelData, y, xs...; method=:fmols, pooling=:group, trend=:const, kernel=:bartlett, bandwidth=:andrews, leads=:auto, lags=:auto, ic=:aic, dols_se=:lrv)` | Panel FMOLS/DOLS over a `PanelData`; returns `PanelCointRegModel` |\n| [estimate_xtcointreg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/cointreg/panel.jl) | `estimate_xtcointreg(y::AbstractVector, X, id, time; kwargs..., xnames=nothing)` | Long-format panel method with unit/time id vectors |\n| [CointRegModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/cointreg/types.jl) | `struct CointRegModel{T} <: StatsAPI.RegressionModel` | Single-equation fit: long-run coef, vcov, residuals, HAC bandwidth, `Omega`/`Lambda`/`Sigma`/`omega_uv` |\n| [PanelCointRegModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/cointreg/types.jl) | `struct PanelCointRegModel{T} <: StatsAPI.RegressionModel` | Panel fit: pooled or group-mean coef, per-unit fits, Pedroni between-dimension `t` |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nm = estimate_cointreg(y, x; method=:fmols, trend=:const)\nreport(m)\nmd = estimate_cointreg(y, x; method=:dols, leads=:auto, lags=:auto, ic=:aic)\nround.(confint(m; level=0.95), digits=4)\n```\n\n# See also\n\n* [Vector Error Correction Models](/multivariate/vecm.md) - full-system cointegration with multiple cointegrating vectors\n* [Vector Autoregression](/multivariate/var.md) - stationary systems and the `to_var` conversion target\n* [Local Projections](/multivariate/lp.md) - impulse responses without cointegration structure", "multivariate/factor": "# Summary\n\nThe `factor` module compresses panels of hundreds of indicators into a few latent common factors through four estimators: static principal components (Stock & Watson 2002a) with block-restricted EM, dynamic factor models with explicit factor-VAR dynamics estimated two-step or by EM Kalman smoother (Doz, Giannone & Reichlin 2011, 2012), the frequency-domain generalized dynamic factor model (Forni, Hallin, Lippi & Reichlin 2000, 2005), and structural DFMs with Cholesky or observable sign restrictions (Forni et al. 2009).\nModel selection spans Bai & Ng (2002) static IC1-IC3, Hallin-Liska, Bai-Ng (2007), and Amengual-Watson dynamic-factor counts, plus AIC/BIC over the DFM `(r, p)` grid.\nForecasts extrapolate the factor VAR and project through loadings, with theoretical, bootstrap, or simulation intervals.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_factors](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/static.jl) | `estimate_factors(X, r::Int; standardize=true, blocks=nothing, varnames=nothing)` | Static PCA factors with optional block-restricted EM |\n| [ic_criteria](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/static.jl) | `ic_criteria(X, max_factors::Int; standardize=true)` | Bai & Ng (2002) IC1-IC3 static factor count |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/static.jl) | `forecast(m::FactorModel, h::Int; p=1, ci_method=:theoretical, conf_level=0.95, n_boot=1000, rng)` | Factor-VAR forecast from a static fit |\n| [residuals](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/static.jl) | `StatsAPI.residuals(m::FactorModel)` | Idiosyncratic residuals `X - F*Lambda'` |\n| [r2](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/static.jl) | `StatsAPI.r2(m::FactorModel)` | Per-variable R-squared from common factors |\n| [estimate_dynamic_factors](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/dynamic.jl) | `estimate_dynamic_factors(X, r::Int, p::Int; method=:twostep, standardize=true, max_iter=100, tol=1e-6, diagonal_idio=true)` | DFM via two-step PCA+VAR or EM Kalman smoother |\n| [ic_criteria_dynamic](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/dynamic.jl) | `ic_criteria_dynamic(X, max_r::Int, max_p::Int; standardize=true, method=:twostep)` | AIC/BIC grid over factor count and VAR lags |\n| [companion_matrix_factors](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/dynamic.jl) | `companion_matrix_factors(m::DynamicFactorModel)` | Companion form of the factor VAR |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/dynamic.jl) | `forecast(m::DynamicFactorModel, h::Int; ci_method=:theoretical, conf_level=0.95, n_boot=1000, ci=false, rng)` | DFM forecast with theoretical/bootstrap/simulation intervals |\n| [residuals](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/dynamic.jl) | `StatsAPI.residuals(m::DynamicFactorModel)` | Idiosyncratic residuals of the DFM |\n| [r2](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/dynamic.jl) | `StatsAPI.r2(m::DynamicFactorModel)` | Per-variable R-squared of the DFM |\n| [dof](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/dynamic.jl) | `StatsAPI.dof(m::DynamicFactorModel)` | DFM degrees of freedom |\n| [estimate_gdfm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/generalized.jl) | `estimate_gdfm(X, q::Int; standardize=true, bandwidth=0, kernel=:bartlett, r=0, varnames=nothing, spectral=:lag_window)` | Frequency-domain GDFM with lag-window or smoothed-periodogram spectrum |\n| [hallin_liska](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/generalized.jl) | `hallin_liska(X, q_max::Int; c_grid, subpanels=4, bandwidth=0, kernel=:bartlett, penalty=:p1, spectral=:lag_window, standardize=true)` | Hallin-Liska (2007) dynamic factor count |\n| [bai_ng_q](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/generalized.jl) | `bai_ng_q(X, r::Int; p=1, \u03b4=0.1, m=1, standardize=true)` | Bai-Ng (2007) dynamic factor count from `r` static factors |\n| [amengual_watson_q](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/generalized.jl) | `amengual_watson_q(X, r::Int, p::Int=1; standardize=true)` | Amengual-Watson (2007) dynamic factor count |\n| [ic_criteria_gdfm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/generalized.jl) | `ic_criteria_gdfm(X, max_q::Int; standardize=true, bandwidth=0, kernel=:bartlett, spectral=:lag_window)` | Heuristic eigenvalue-ratio and variance-share `q` choice |\n| [common_variance_share](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/generalized.jl) | `common_variance_share(m::GeneralizedDynamicFactorModel)` | Per-series share of variance in the common component |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/generalized.jl) | `forecast(model::GeneralizedDynamicFactorModel, h::Int; method=:ar, ...)` | GDFM forecast via per-factor AR(1) extrapolation |\n| [historical_decomposition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/generalized.jl) | `historical_decomposition(gdfm::GeneralizedDynamicFactorModel; ...)` | Common/idiosyncratic historical decomposition |\n| [r2](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/generalized.jl) | `StatsAPI.r2(m::GeneralizedDynamicFactorModel)` | Per-variable R-squared of the GDFM |\n| [estimate_structural_dfm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/structural.jl) | `estimate_structural_dfm(X, q::Int; identification=:cholesky, p=1, p_max=8, check_stability=true, H=40, r=0, method=:fglr, ...)` | Structural DFM (FGLR 2009) with Cholesky or sign identification |\n| [varindex](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/structural.jl) | `varindex(m::StructuralDFM, name::AbstractString)` | Panel column index by variable name |\n| [structural_shocks](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/structural.jl) | `structural_shocks(sdfm::StructuralDFM)` | Identified common structural shocks |\n| [is_stable](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/structural.jl) | `is_stable(m::StructuralDFM)` | Stability check on the factor VAR |\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `irf(sdfm::StructuralDFM, horizon::Int; point=:auto, ci_type=:none, reps=200, conf_level=0.95, ...)` | Structural impulse responses of factors/panel |\n| [fevd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `fevd(sdfm::StructuralDFM, horizon::Int; space=:factor, include_idiosyncratic=false, idio_model=:white, kwargs...)` | Variance decomposition in factor or panel space |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `forecast(sdfm::StructuralDFM, h::Int; ci_method=:none, reps=200, conf_level=0.95, rng)` | Panel forecast through SDFM loadings |\n| [sdfm_panel_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `sdfm_panel_irf(sdfm::StructuralDFM, H::Int)` | Panel-wide structural impulse responses |\n| [FactorModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/static.jl) | `struct FactorModel{T} <: AbstractFactorModel` | Static fit: factors, loadings, eigenvalues, variance shares |\n| [DynamicFactorModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/dynamic.jl) | `struct DynamicFactorModel{T}` | DFM fit: factor VAR, covariances, likelihood, convergence |\n| [GeneralizedDynamicFactorModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/generalized.jl) | `struct GeneralizedDynamicFactorModel{T}` | GDFM fit: spectral loadings, common/idiosyncratic split |\n| [StructuralDFM](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/structural.jl) | `struct StructuralDFM{T}` | Identified DFM: impact matrix, factor VAR, panel loadings |\n| [FactorForecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/factor/kalman.jl) | `struct FactorForecast{T}` | Factor and observable forecasts with bands |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfm = estimate_factors(X, 3; standardize=true)\nreport(fm)\nic = ic_criteria(X, 10)\n(ic.r_IC1, ic.r_IC2, ic.r_IC3)\ndfm = estimate_dynamic_factors(X, 3, 1; method=:twostep, standardize=true)\nfc = forecast(dfm, 12; ci_method=:bootstrap, n_boot=50)\nreport(fc)\n```\n\n# See also\n\n* [Vector Autoregression](/multivariate/var.md) - small-system dynamics behind factor-augmented VARs\n* [Bayesian VAR](/multivariate/bvar.md) - shrinkage alternative for medium-scale systems\n* [Vector Error Correction Models](/multivariate/vecm.md) - cointegration structure factors do not impose\n* [Local Projections](/multivariate/lp.md) - direct responses usable alongside factor compression\n* [Factor-Augmented VAR](/multivariate/favar.md) - VARs on observed plus latent factors", "multivariate/favar": "# Summary\n\nThe `favar` module implements the Factor-Augmented VAR of Bernanke, Boivin & Eliasz (2005): extract `r` latent factors from a large panel by principal components, remove double-counting against the key observed variables (e.g. the policy rate), and estimate a VAR on the augmented `[F, Y_key]` system.\nThe two-step estimator (`method=:two_step`) treats the PCA factors as data; the Bayesian estimator (`method=:bayesian`) jointly Gibbs-samples factors, loadings, and VAR parameters with Carter-Kohn forward-filtering backward-sampling, so credible bands include factor-extraction uncertainty.\nStructural analysis (`irf`, `fevd`, `historical_decomposition`) delegates to the VAR or BVAR infrastructure through `to_var`, and `favar_panel_irf` / `favar_panel_forecast` map results back to every panel series through the loadings `Lambda` plus the direct channel `Lambda_y`.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_favar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/estimation.jl) | `estimate_favar(X, Y_key::AbstractMatrix, r::Int, p::Int; method=:two_step, panel_varnames, n_draws=5000, burnin=1000, seed, rng)` | Two-step or Bayesian FAVAR with key variables as a matrix; returns `FAVARModel` or `BayesianFAVAR` |\n| [estimate_favar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/estimation.jl) | `estimate_favar(X, key_indices::Vector{Int}, r::Int, p::Int; ...)` | Same, with key variables as panel column indices |\n| [to_var](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/types.jl) | `to_var(favar::FAVARModel)` | Convert to `VARModel` for structural-analysis dispatch |\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `irf(favar::FAVARModel, horizon::Int; kwargs...)` | Augmented-system IRFs via `to_var` (all VAR identification methods) |\n| [fevd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `fevd(favar::FAVARModel, horizon::Int; kwargs...)` | Augmented-system FEVD via `to_var` |\n| [historical_decomposition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `historical_decomposition(favar::FAVARModel, horizon=effective_nobs(favar); kwargs...)` | Augmented-system historical decomposition via `to_var` |\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `irf(bfavar::BayesianFAVAR, horizon::Int; kwargs...)` | Draw-by-draw Bayesian IRFs via `BVARPosterior` delegation |\n| [fevd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `fevd(bfavar::BayesianFAVAR, horizon::Int; kwargs...)` | Bayesian FEVD via `BVARPosterior` delegation |\n| [historical_decomposition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `historical_decomposition(bfavar::BayesianFAVAR, horizon=0; kwargs...)` | Bayesian historical decomposition via `BVARPosterior` delegation |\n| [favar_panel_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `favar_panel_irf(favar::FAVARModel, irf_result::ImpulseResponse)` | Map augmented IRFs to all `N` panel series through `Lambda` and `Lambda_y` |\n| [favar_panel_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `favar_panel_irf(bfavar::BayesianFAVAR, irf_result::BayesianImpulseResponse)` | Bayesian panel IRFs with quantiles recomputed in panel space |\n| [favar_panel_forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/analysis.jl) | `favar_panel_forecast(favar::FAVARModel, fc::VARForecast)` | Map augmented forecasts to the full panel |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/forecast.jl) | `forecast(favar::FAVARModel, h::Int; kwargs...)` | Augmented-system forecast delegating to `forecast(::VARModel, h)` |\n| [FAVARModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/types.jl) | `struct FAVARModel{T} <: AbstractVARModel` | Two-step fit: augmented VAR plus factors, loadings, `Lambda_y`, panel metadata |\n| [BayesianFAVAR](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/favar/types.jl) | `struct BayesianFAVAR{T}` | Bayesian fit: posterior draws of VAR params, factors, loadings, `lambda_y` |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfavar = estimate_favar(X, [5], 2, 2; panel_varnames=panel_names)\nreport(favar)\nr = irf(favar, 20; method=:cholesky)\nr_panel = favar_panel_irf(favar, r)\nreport(r_panel)\nfc = forecast(favar, 6)\nfc_panel = favar_panel_forecast(favar, fc)\n```\n\n# See also\n\n* [Factor Models](/multivariate/factor.md) - factor extraction, factor-count selection, and structural DFMs\n* [Vector Autoregression](/multivariate/var.md) - the augmented-system estimator and identification machinery behind `to_var`\n* [Bayesian VAR](/multivariate/bvar.md) - posterior infrastructure the Bayesian FAVAR delegates to\n* [Local Projections](/multivariate/lp.md) - direct impulse-response estimation without a factor structure\n* [Vector Error Correction Models](/multivariate/vecm.md) - cointegrated systems as an alternative to factor dynamics", "multivariate/lp": "# Summary\n\nThe `lp` module estimates impulse responses by Jord\u00e0 (2005) Local Projections: a separate predictive regression at each horizon with Newey-West HAC standard errors (automatic bandwidth covering the MA(h-1) overlap).\nFive variants extend the core estimator: LP-IV with external instruments (Stock & Watson 2018) including weak-instrument-robust inference, Smooth LP with penalized B-splines (Barnichon & Brownlees 2019), regime-varying State LP (Auerbach & Gorodnichenko 2012), and propensity-score LP for discrete treatments (Angrist, Jord\u00e0 & Kuersteiner 2018).\n`structural_lp` pairs VAR-based identification with LP response estimation, `lp_fevd` gives the R\u00b2-based variance decomposition (Gorodnichenko & Lee 2019), and `forecast` produces direct multi-step forecasts.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_lp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/core.jl) | `estimate_lp(Y, shock_var::Int, horizon::Int; lags=4, response_vars, cov_type=:newey_west, bandwidth=0, conf_level=0.95, varnames)` | Horizon-by-horizon OLS LP; returns `LPModel` |\n| [estimate_lp_multi](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/core.jl) | `estimate_lp_multi(Y, shock_vars::Vector{Int}, horizon::Int; kwargs...)` | One `LPModel` per shock variable |\n| [estimate_lp_cholesky](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/core.jl) | `estimate_lp_cholesky(Y, horizon::Int; lags=4, cov_type=:newey_west, kwargs...)` | Recursively identified LP per structural shock |\n| [structural_lp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/core.jl) | `structural_lp(Y, horizon::Int; method=:cholesky, lags=4, var_lags=nothing, cov_type=:newey_west, conf_level=0.95, ci_type=:none, reps=200, ...)` | VAR identification with LP response estimation |\n| [compare_var_lp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/core.jl) | `compare_var_lp(Y, horizon::Int; lags=4)` | Side-by-side VAR vs LP impulse responses |\n| [lp_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/irf.jl) | `lp_irf(model::LPModel; conf_level=0.95, ...)` | IRF with analytical or fixed-design bootstrap bands |\n| [cumulative_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/irf.jl) | `cumulative_irf(irf::LPImpulseResponse)` | Cumulated LP impulse responses |\n| [estimate_lp_iv](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/iv.jl) | `estimate_lp_iv(Y, shock_var::Int, instruments, horizon::Int; lags=4, response_vars, cov_type=:newey_west, bandwidth=0, varnames)` | 2SLS LP-IV with external instruments |\n| [lp_iv_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/iv.jl) | `lp_iv_irf(model::LPIVModel; conf_level=0.95)` | Instrumented IRF with confidence intervals |\n| [weak_instrument_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/iv.jl) | `weak_instrument_test(model::LPIVModel; threshold=10.0)` | HAC first-stage F across horizons |\n| [sargan_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/iv.jl) | `sargan_test(model::LPIVModel, h::Int)` | Overidentification J test at horizon `h` |\n| [montiel_olea_pflueger_f](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/weak_iv.jl) | `montiel_olea_pflueger_f(model::LPIVModel; tau=0.10, ...)` | Heteroskedasticity-robust effective F with bias critical values |\n| [lp_iv_ar_band](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/weak_iv.jl) | `lp_iv_ar_band(model::LPIVModel; level=0.95, n_grid=401, ...)` | Anderson-Rubin bands valid at any instrument strength |\n| [estimate_smooth_lp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/smooth.jl) | `estimate_smooth_lp(Y, shock_var::Int, horizon::Int; degree=3, n_knots=4, lambda=0.0, lags=4, response_vars, cov_type=:newey_west, bandwidth=0, varnames)` | Penalized B-spline smooth LP |\n| [smooth_lp_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/smooth.jl) | `smooth_lp_irf(model::SmoothLPModel; conf_level=0.95)` | Smoothed IRF propagating cross-horizon covariance |\n| [bspline_basis](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/smooth.jl) | `bspline_basis(horizons, degree::Int, n_interior_knots::Int; ...)` | Cubic B-spline basis over horizons |\n| [cross_validate_lambda](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/smooth.jl) | `cross_validate_lambda(Y, shock_var::Int, horizon::Int; lambda_grid, k_folds=5, kwargs...)` | K-fold choice of the smoothing penalty |\n| [compare_smooth_lp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/smooth.jl) | `compare_smooth_lp(Y, shock_var::Int, horizon::Int; lambda=1.0, kwargs...)` | Standard vs smooth IRF with variance-reduction ratio |\n| [estimate_state_lp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/state.jl) | `estimate_state_lp(Y, shock_var::Int, state_var, horizon::Int; gamma=:estimate, threshold=:estimate, lags=4, response_vars, cov_type=:newey_west, bandwidth=0, varnames)` | Logistic smooth-transition state-dependent LP |\n| [state_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/state.jl) | `state_irf(model::StateLPModel; regime=:both, conf_level=0.95)` | Regime-specific impulse responses |\n| [estimate_transition_params](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/state.jl) | `estimate_transition_params(state_var, Y, shock_var::Int; method=:nlls, gamma_init=1.5, lags=4, c_init=:median)` | Estimate smooth-transition `(gamma, c)` |\n| [test_regime_difference](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/state.jl) | `test_regime_difference(model::StateLPModel; h=nothing)` | Test for regime-varying responses |\n| [estimate_propensity_lp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/propensity.jl) | `estimate_propensity_lp(Y, treatment::AbstractVector{Bool}, covariates, horizon::Int; ps_method=:logit, trimming=(0.01, 0.99), lags=4, response_vars, cov_type=:newey_west, bandwidth=0, varnames)` | Inverse-propensity-weighted LP for discrete treatments |\n| [doubly_robust_lp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/propensity.jl) | `doubly_robust_lp(Y, treatment::AbstractVector{Bool}, covariates, horizon::Int; ps_method=:logit, trimming=(0.01, 0.99), lags=4, response_vars, cov_type=:newey_west, bandwidth=0, varnames)` | Doubly robust LP combining weighting and outcome regression |\n| [propensity_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/propensity.jl) | `propensity_irf(model::PropensityLPModel; conf_level=0.95)` | Treatment-effect IRF from propensity LP |\n| [estimate_propensity_score](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/propensity.jl) | `estimate_propensity_score(treatment::AbstractVector{Bool}, X; ...)` | Propensity score via logit/probit |\n| [inverse_propensity_weights](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/propensity.jl) | `inverse_propensity_weights(treatment::AbstractVector{Bool}, propensity; ...)` | Trimmed IPW weights |\n| [propensity_diagnostics](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/propensity.jl) | `propensity_diagnostics(model::PropensityLPModel)` | Overlap and balance diagnostics |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/forecast.jl) | `forecast(lp::LPModel, shock_path::AbstractVector; ci_method=:analytical, conf_level=0.95, n_boot=500, rng)` | Direct multi-step forecast along a shock path |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/forecast.jl) | `forecast(slp::StructuralLP, shock_idx::Int, shock_path::AbstractVector; ci_method=:analytical, conf_level=0.95, n_boot=500, rng)` | Structural-shock conditional forecast |\n| [lp_fevd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/fevd.jl) | `lp_fevd(slp::StructuralLP, horizon::Int; method=:r2, bias_correct=true, n_boot=500, conf_level=0.95, var_lags=nothing, seed=nothing, rng)` | R\u00b2-based LP forecast error variance decomposition |\n| [LPModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/types.jl) | `struct LPModel{T} <: AbstractLPModel` | Per-horizon coefficients, residuals, vcov, effective samples |\n| [LPImpulseResponse](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/types.jl) | `struct LPImpulseResponse{T} <: AbstractLPImpulseResponse` | LP IRF values, standard errors, confidence bands |\n| [StructuralLP](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/types.jl) | `struct StructuralLP{T} <: AbstractFrequentistResult` | Identified LP system over all structural shocks |\n| [LPIVModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/types_variants.jl) | `struct LPIVModel{T} <: AbstractLPModel` | LP-IV fit with first-stage F statistics |\n| [SmoothLPModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/types_variants.jl) | `struct SmoothLPModel{T} <: AbstractLPModel` | Penalized-spline LP fit |\n| [StateLPModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/types_variants.jl) | `struct StateLPModel{T} <: AbstractLPModel` | Regime-varying LP fit with transition weights |\n| [PropensityLPModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/lp/types_variants.jl) | `struct PropensityLPMod
