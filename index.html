* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

estimate_probit`), ordered logit/probit and multinomial logit by Newton-Raphson (`estimate_ologit`, `estimate_oprobit`, `estimate_mlogit`), quantile regression (`estimate_qreg`), regression discontinuity with CCT robust bias-corrected inference (`estimate_rdd`), ridge/LASSO/elastic-net penalized regression (`estimate_ridge`, `estimate_lasso`, `estimate_elastic_net`), stepwise and general-to-specific selection (`select_variables`), Tobit and truncated regression (`estimate_tobit`, `estimate_truncreg`), Heckman selection (`estimate_heckman`), Poisson and Negative Binomial counts (`estimate_poisson`, `estimate_nbreg`), Huber/bisquare M- and MM-estimation (`estimate_robust`), and the wild cluster bootstrap for few clusters (`wild_cluster_bootstrap`).\nEvery estimator returns a typed result (`RegModel`, `LogitModel`, `ProbitModel`, `OrderedLogitModel`, `OrderedProbitModel`, `MultinomialLogitModel`, `QuantileRegModel`, `RDDResult`, `PenalizedRegModel`, `TobitModel`, `TruncRegModel`, `HeckmanModel`, `PoissonModel`, `NegBinModel`, `RobustRegModel`) printable via `report()` and served through the StatsAPI interface (`coef`, `vcov`, `predict`, `confint`, `stderror`, `nobs`, `r2`, `loglikelihood`, `residuals`).\nPost-estimation covers marginal effects for all model families, odds and incidence-rate ratios, classification tables, VIF, overdispersion, Brant proportional-odds, and Hausman-McFadden IIA tests, plus OLS residual diagnostics (White, Breusch-Pagan, Glejser, Harvey, Breusch-Godfrey, RESET), stability diagnostics (recursive residuals, CUSUM/CUSUMSQ, Chow), and Belsley-Kuh-Welsch influence statistics.\nSymbol-based `CrossSectionData` dispatches for `estimate_reg`, `estimate_iv`, `estimate_logit`, and `estimate_probit` live in `src/data/convert.jl`; kernel-HAC long-run variance (`lrvar`, `lrcov`, `lrcov_oneside`, `varhac`) lives in `src/core` and is covered by the infrastructure domain.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_reg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/estimation.jl) | `estimate_reg(y, X; cov_type=:hc1, weights=nothing, varnames=nothing, clusters=nothing, coords=nothing, cutoff=0.0, conley_kernel=:bartlett, conley_metric=:euclidean, time=nothing, time_cutoff=0, conley_psd=true)` | OLS (or WLS with `weights`) with classical, HC0-HC3, cluster, or Conley covariance; returns `RegModel` |\n| [estimate_iv](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/iv.jl) | `estimate_iv(y, X, Z; endogenous, method=:tsls, k=nothing, fuller_a=1.0, cov_type=:hc1, varnames=nothing)` | 2SLS, LIML, Fuller, or k-class IV with first-stage F, Sargan-Hansen, Cragg-Donald, Kleibergen-Paap, and Stock-Yogo diagnostics |\n| [estimate_logit](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/logit.jl) | `estimate_logit(y, X; cov_type=:ols, varnames=nothing, clusters=nothing, maxiter=100, tol=1e-8)` | Binary logit by IRLS/Fisher scoring with separation warning; returns `LogitModel` |\n| [estimate_probit](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/probit.jl) | `estimate_probit(y, X; cov_type=:ols, varnames=nothing, clusters=nothing, maxiter=100, tol=1e-8)` | Binary probit by Fisher scoring; returns `ProbitModel` |\n| [estimate_ologit](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/ordered.jl) | `estimate_ologit(y, X; cov_type=:ols, varnames=nothing, clusters=nothing, maxiter=200, tol=1e-8)` | Ordered (proportional-odds) logit by Newton-Raphson; `X` must exclude the intercept |\n| [estimate_oprobit](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/ordered.jl) | `estimate_oprobit(y, X; cov_type=:ols, varnames=nothing, clusters=nothing, maxiter=200, tol=1e-8)` | Ordered probit by Newton-Raphson; `X` must exclude the intercept |\n| [estimate_mlogit](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/multinomial.jl) | `estimate_mlogit(y, X; cov_type=:ols, varnames=nothing, clusters=nothing, maxiter=200, tol=1e-8)` | Multinomial (softmax) logit by Newton-Raphson; `X` must include an intercept column |\n| [estimate_qreg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/quantile.jl) | `estimate_qreg(y, X, tau=0.5; se=:iid, varnames=nothing, n_boot=500, alpha=0.05, rng, seed=nothing)` | Quantile regression at one or more quantiles with `:iid`, `:robust`, or `:boot` standard errors |\n| [estimate_rdd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/rdd.jl) | `estimate_rdd(y, running; cutoff=0.0, fuzzy=nothing, kernel=:triangular, p=1, h=nothing, b=nothing, level=0.95)` | Sharp or fuzzy regression discontinuity with CCT robust bias-corrected inference |\n| [estimate_elastic_net](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/penalized.jl) | `estimate_elastic_net(y, X; alpha=1.0, lambda=:cv, nlambda=100, select=:cv, cv=:kfold, nfolds=10, adaptive=false, post=false, standardize=true, seed=1234, tol=1e-9, maxit=100000)` | Elastic-net penalized regression over a warm-started lambda path with CV or IC selection |\n| [estimate_lasso](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/penalized.jl) | `estimate_lasso(y, X; kwargs...)` | LASSO as `estimate_elastic_net` with `alpha=1`; sparse solutions |\n| [estimate_ridge](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/penalized.jl) | `estimate_ridge(y, X; kwargs...)` | Ridge as `estimate_elastic_net` with `alpha=0`; closed-form dense shrinkage |\n| [select_variables](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/selection.jl) | `select_variables(y, X; method=:bidirectional, criterion=:pvalue, p_enter=0.05, p_remove=0.10, p_gets=0.05, diag_level=0.05, bg_lags=1, keep=nothing, varnames=nothing)` | Forward/backward/bidirectional stepwise, best-subset, or GETS specification search; returns `SelectionResult` |\n| [estimate_tobit](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/tobit.jl) | `estimate_tobit(y, X; lower=0.0, upper=Inf, dist=:normal, varnames=nothing, maxiter=1000, tol=1e-10)` | Censored (Tobit) regression by MLE in the Olsen reparameterization |\n| [estimate_truncreg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/tobit.jl) | `estimate_truncreg(y, X; lower=0.0, upper=Inf, varnames=nothing, maxiter=1000, tol=1e-10)` | Truncated-normal regression by MLE; every `y` must lie strictly inside the bounds |\n| [estimate_heckman](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/heckman.jl) | `estimate_heckman(y, X, d, Z; method=:twostep, outcome_names=nothing, select_names=nothing, maxiter=1000, tol=1e-10)` | Heckman selection by two-step Heckit or full-information MLE |\n| [estimate_poisson](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/count.jl) | `estimate_poisson(y, X; offset=nothing, exposure=nothing, cov_type=:robust, varnames=nothing, clusters=nothing, maxiter=100, tol=1e-10)` | Poisson quasi-MLE with GMT sandwich errors by default |\n| [estimate_nbreg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/count.jl) | `estimate_nbreg(y, X; offset=nothing, exposure=nothing, varnames=nothing, maxiter=1000, tol=1e-10)` | Negative Binomial 2 with jointly estimated dispersion `alpha` |\n| [estimate_robust](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/robust.jl) | `estimate_robust(y, X; psi=:huber, method=:m, k=nothing, maxiter=50, tol=1e-6, scale_update=:mad, rng, seed=nothing, n_resample=500, varnames=nothing)` | Huber/bisquare M-estimation or Yohai MM-estimation with Huber-Ronchetti sandwich covariance |\n| [estimate_robust](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/robust.jl) | `estimate_robust(d::CrossSectionData, y, xs; add_intercept=true, kwargs...)` | Robust regression from a `CrossSectionData` container by column name |\n| [conley_se](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/covariance.jl) | `conley_se(m::RegModel; coords, cutoff, kernel=:bartlett, metric=:euclidean, time=nothing, time_cutoff=0, time_kernel=:bartlett, psd=true)` | Conley spatial-HAC standard errors for a fitted `RegModel` |\n| [wild_cluster_bootstrap](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/wildboot.jl) | `wild_cluster_bootstrap(model::RegModel, coefficient, null_value=0.0; clusters, kwargs...)` | Cameron-Gelbach-Miller wild cluster bootstrap with exact enumeration for few clusters |\n| [wild_cluster_bootstrap](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/wildboot.jl) | `wild_cluster_bootstrap(model::PanelRegModel, coefficient, null_value=0.0; clusters=nothing, kwargs...)` | Wild cluster bootstrap on a fixed-effects panel fit, defaulting clusters to entity ids |\n| [anderson_rubin_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/anderson_rubin.jl) | `anderson_rubin_test(model, beta0; cov_type=nothing, clusters=nothing)` | Anderson-Rubin weak-instrument-robust test of one or more endogenous coefficients |\n| [anderson_rubin_ci](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/anderson_rubin.jl) | `anderson_rubin_ci(model; level=0.95, n_grid=1001, span=20, grid=nothing, cov_type=nothing, clusters=nothing)` | AR confidence set by test inversion; may be unbounded, disjoint, empty, or the whole line |\n| [marginal_effects](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/margins.jl) | `marginal_effects(m::Union{LogitModel,ProbitModel}; type=:ame, at=nothing, conf_level=0.95)` | AME/MEM/MER with delta-method SEs; discrete change for `{0,1}` regressors |\n| [marginal_effects](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/ordered.jl) | `marginal_effects(m::Union{OrderedLogitModel,OrderedProbitModel})` | Average marginal effects as a `K x J` variables-by-categories matrix |\n| [marginal_effects](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/multinomial.jl) | `marginal_effects(m::MultinomialLogitModel)` | Average marginal effects with full-covariance delta-method SEs; no intercept row |\n| [marginal_effects](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/tobit.jl) | `marginal_effects(m::TobitModel; which=:unconditional, conf_level=0.95)` | McDonald-Moffitt decomposition: `:unconditional`, `:conditional`, or `:probability` |\n| [marginal_effects](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/count.jl) | `marginal_effects(m::Union{PoissonModel,NegBinModel}; conf_level=0.95)` | Average marginal effects on the count mean; discrete change for binary regressors |\n| [odds_ratio](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/margins.jl) | `odds_ratio(m::LogitModel; conf_level=0.95)` | Exponentiated logit coefficients with log-scale confidence intervals |\n| [incidence_rate_ratio](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/count.jl) | `incidence_rate_ratio(m::Union{PoissonModel,NegBinModel}; conf_level=0.95)` | Exponentiated count-model coefficients in the shared `OddsRatio` container |\n| [classification_table](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/diagnostics.jl) | `classification_table(m::Union{LogitModel,ProbitModel}; threshold=0.5)` | Confusion matrix with accuracy, sensitivity, specificity, precision, and F1 |\n| [vif](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/diagnostics.jl) | `vif(m::RegModel)` | Variance inflation factors, one per non-intercept regressor |\n| [dispersion_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/count.jl) | `dispersion_test(m::PoissonModel)` | Cameron-Trivedi NB2/NB1 overdispersion test on a Poisson fit |\n| [brant_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/ordered.jl) | `brant_test(m::OrderedLogitModel)` | Brant proportional-odds test, overall plus per-variable, via `J-1` binary logits |\n| [hausman_iia](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/multinomial.jl) | `hausman_iia(m::MultinomialLogitModel; omit_category::Int)` | Hausman-McFadden IIA test re-estimating without one category; needs `J >= 4` |\n| [generalized_residuals](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/ordered.jl) | `generalized_residuals(m::Union{OrderedLogitModel,OrderedProbitModel})` | Length-`n` score residual vector for ordered models (Chesher-Irish) |\n| [white_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/diagnostics.jl) | `white_test(m::RegModel; cross_terms=true)` | White heteroskedasticity test; also accepts `(resid, X)` |\n| [breusch_pagan_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/diagnostics.jl) | `breusch_pagan_test(m::RegModel; studentized=true, het_regressors=nothing)` | Koenker studentized (default) or original Breusch-Pagan test; also accepts `(resid, X)` |\n| [glejser_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/diagnostics.jl) | `glejser_test(m::RegModel)` | Glejser F-test of `|resid|` on the regressors; also accepts `(resid, X)` |\n| [harvey_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/diagnostics.jl) | `harvey_test(m::RegModel)` | Harvey multiplicative-heteroskedasticity test on `log(resid^2)`; also accepts `(resid, X)` |\n| [breusch_godfrey_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/diagnostics.jl) | `breusch_godfrey_test(m::RegModel; lags=1)` | Breusch-Godfrey serial-correlation LM test with chi-squared and F forms |\n| [reset_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/diagnostics.jl) | `reset_test(m::RegModel; powers=2:4)` | Ramsey RESET functional-form F-test on powers of the fitted values |\n| [recursive_residuals](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/stability.jl) | `recursive_residuals(m::RegModel)` | Standardized Brown-Durbin-Evans recursive residuals, length `n-k` |\n| [cusum_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/stability.jl) | `cusum_test(m::RegModel; level=0.05)` | CUSUM parameter-stability test against BDE significance lines |\n| [cusumsq_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/stability.jl) | `cusumsq_test(m::RegModel; level=0.05)` | CUSUM-of-squares variance-stability test with Edgerton-Wells band |\n| [chow_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/stability.jl) | `chow_test(m::RegModel, break_index; type=:breakpoint, level=0.05)` | Chow breakpoint or forecast test at known break date(s) |\n| [influence_stats](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/reg/stability.jl) | `influence_stats(m::RegModel)` | Hat diagonals, studentized residuals, DFFITS, Cook's distance, and DFBETAS |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nn = 200\nX = hcat(ones(n), randn(n, 2))\ny = X * [1.0, 2.0, -0.5] + 0.5 * randn(n)\nm = estimate_reg(y, X; varnames=[\"(Intercept)\", \"x1\", \"x2\"])\nreport(m)\n```\n\n# See also\n\n* [Systems of Equations (SUR and 3SLS)](/cross-section/system.md) - joint estimation of multi-equation systems with correlated errors\n* [Panel Regression](/panel/preg.md) - fixed/random-effects, panel IV, and panel logit/probit counterparts\n* [Difference-in-Differences](/panel/did.md) - treatment-effect designs that use few-cluster bootstrap inference", "cross-section/system": "# Summary\n\nThe `system` module jointly estimates multi-equation systems whose errors are correlated across equations. `estimate_sur` fits Zellner's (1962) seemingly-unrelated regressions by feasible GLS, stacking the `M` equations as `y = X*beta + u` with `Cov(u) = Sigma (x) I` and estimating the residual cross-covariance from equation-by-equation OLS residuals with the classical Zellner divisor `T`; `estimate_3sls` fits the Zellner-Theil (1962) three-stage least squares estimator for simultaneous systems, projecting each equation's regressors onto an instrument space before the system GLS step. SUR supports iterated FGLS to the Gaussian MLE (`iterate=true`) and linear cross-equation restrictions `R*vec(B) = r` via restricted GLS; 3SLS accepts one shared instrument matrix or per-equation matrices. Both return typed results (`SURModel`, `ThreeSLSModel`) carrying per-equation coefficients, the full system covariance, `Sigma`, McElroy (1977) system R-squared, and the Gaussian system log-likelihood, all printable via `report()`.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_sur](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/system/sur.jl) | `estimate_sur(eqs; iterate=false, tol=1e-8, maxiter=100, restrict=nothing, eqnames=nothing)` | Zellner SUR by FGLS; `eqs` is a vector of `(y, X)` or `(y, X, names)` tuples |\n| [estimate_3sls](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/system/threesls.jl) | `estimate_3sls(eqs, Z; instruments=:common, eqnames=nothing)` | Zellner-Theil 3SLS with `:common` or `:perequation` instruments |\n| [SURModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/system/types.jl) | `struct SURModel{T<:AbstractFloat}` | Fitted SUR: per-equation `betas`/`ses`, system `vcov_mat`, `Sigma`, `det_sigma`, `mcelroy_r2`, `loglik`, iteration flags |\n| [ThreeSLSModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/system/types.jl) | `struct ThreeSLSModel{T<:AbstractFloat}` | Fitted 3SLS: same system fields as `SURModel` for the simultaneous fit |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\npd = load_example(:grunfeld)\nge = group_data(pd, \"General Electric\")\nwh = group_data(pd, \"Westinghouse\")\nXge = hcat(ones(20), ge.data[:, 2], ge.data[:, 3])\nXwh = hcat(ones(20), wh.data[:, 2], wh.data[:, 3])\ncols = [\"const\", \"value\", \"capital\"]\nm = estimate_sur([(ge.data[:, 1], Xge, cols), (wh.data[:, 1], Xwh, cols)]; eqnames=[\"GE\", \"Westinghouse\"])\nreport(m)\n```\n\n# See also\n\n* [Regression (OLS, IV, and Limited Dependent Variables)](/cross-section/reg.md) - single-equation OLS/IV foundation the system estimators build on\n* [Panel Regression](/panel/preg.md) - fixed/random-effects and panel IV estimators for longitudinal data\n* [Vector Autoregression (VAR)](/multivariate/var.md) - multi-equation systems in the time-series domain", "dsge/ct": "# Summary\n\nThe `ct` module solves continuous-time incomplete-markets economies with the sparse finite-difference methods of Achdou et al. (2022): the household problem is a Hamilton-Jacobi-Bellman PDE solved by an implicit upwind scheme (`ct_hjb`), and the stationary wealth distribution solves the Kolmogorov-Forward equation reusing the same infinitesimal generator (`ct_kfe`).\n`ct_steady_state` bisects on the interest rate to clear the capital market; `ct_mit_shock` computes deterministic transitions by shooting on the capital path.\nThe two-asset extension (`CTTwoAsset`) adds liquid/illiquid portfolio choice with convex deposit costs in the Kaplan-Moll-Violante (2018) tradition, closed in general equilibrium by `ct_two_asset_ge` and transitioned by `ct_two_asset_mit`.\n`solve(to_spec(m))` dispatches to the matching steady-state solver, and `irf(m, horizon; ss, shock_size)` wraps the MIT shock as an `ImpulseResponse`.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [CTAiyagari](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/continuous_aiyagari.jl) | `CTAiyagari(; alpha=0.36, rho=0.05, sigma=2.0, delta=0.05, z, lambda, a_max, I)` | One-asset Aiyagari calibration with two-state Poisson income |\n| [ct_hjb](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/continuous_aiyagari.jl) | `ct_hjb(m::CTAiyagari, r, w; max_iter=100, tol=1e-6, Delta=1000.0)` | Implicit upwind HJB solve; returns `(v, c, s, A, a, converged)` |\n| [ct_kfe](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/continuous_aiyagari.jl) | `ct_kfe(A::SparseMatrixCSC, I::Int, da)` | Stationary density from `A'g = 0`, normalized to one |\n| [ct_steady_state](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/continuous_aiyagari.jl) | `ct_steady_state(m::CTAiyagari; r_bounds=(0.0001, rho-1e-4), max_iter=100, tol=1e-6, hjb_max_iter=100, Delta=1000.0)` | Interest-rate bisection to a `CTSteadyState` |\n| [ct_mit_shock](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/continuous_aiyagari.jl) | `ct_mit_shock(m, ss0::CTSteadyState, Z_path; dt=0.25, max_iter=300, tol=1e-6, relax=0.3)` | MIT-shock transition via capital-path shooting; returns `CTTransition` |\n| [CTTwoAsset](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/two_asset.jl) | `CTTwoAsset(; sigma=2.0, rho=0.06, r_a=0.05, r_b=0.02, chi=2.0, cost=:quadratic, a_max, b_max, Ib, Ia, ...)` | Two-asset KMV calibration: liquid/illiquid returns, deposit cost, grids |\n| [ct_two_asset_solve](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/two_asset.jl) | `ct_two_asset_solve(m::CTTwoAsset; max_iter=200, tol=1e-6, Delta=1000.0, check_stationarity=true, V_init=nothing)` | Two-dimensional HJB + KFE; returns `CTTwoAssetSolution` |\n| [ct_two_asset_ge](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/two_asset.jl) | `ct_two_asset_ge(m::CTTwoAsset; K_init, rb_init, max_iter=60, tol=1e-4, relax_K=0.3, relax_rb=0.02, hjb_max_iter=200)` | General equilibrium: clears illiquid capital and liquid bond markets |\n| [ct_two_asset_mit](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/two_asset.jl) | `ct_two_asset_mit(m, ge0::CTTwoAssetGE, Z_path; dt=0.25, max_iter=200, tol=1e-5, relax_K=0.3, relax_rb=0.02)` | Two-asset MIT transition shooting on capital and liquid-return paths |\n| [hand_to_mouth](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/two_asset.jl) | `hand_to_mouth(s::CTTwoAssetSolution; b_threshold, a_threshold)` | Poor vs wealthy hand-to-mouth population shares |\n| [ceiling_mass](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/two_asset.jl) | `ceiling_mass(s::CTTwoAssetSolution)` | Stationary mass on the top grid nodes (truncation diagnostic) |\n| [ct_two_asset_stationarity](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ct/two_asset.jl) | `ct_two_asset_stationarity(m::CTTwoAsset; margin=0.9, solution=nothing, max_ceiling_mass=0.05)` | `a_max <= a*` bound check; returns `(ok, bound, a_star, message, ceiling_mass)` |\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/family_facades.jl) | `irf(m::Union{CTAiyagari,CTTwoAsset}, horizon; ss, shock_size=0.01)` | MIT shock wrapped as an `ImpulseResponse` for `plot_result` |\n| [simulate](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/family_facades.jl) | `simulate(m::Union{CTAiyagari,CTTwoAsset}, T_periods; kwargs...)` | Forward simulation from the stationary equilibrium |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nm = CTAiyagari(; alpha=0.36, rho=0.05, sigma=2.0, delta=0.05,\n                 z=[0.1, 0.2], lambda=[0.5, 0.5], a_max=30.0, I=200)\nss = ct_steady_state(m; tol=1e-5)\nreport(ss)\n```\n\n# See also\n\n* [DSGE Models](/dsge/dsge.md) - representative-agent pipeline and discrete-time heterogeneous agents\n* [Overlapping Generations](/dsge/olg.md) - finite-horizon demographics and life-cycle saving", "dsge/dsge": "# Summary\n\nThe `dsge` module (63 files, the largest in the package) covers the full representative-agent DSGE workflow: the `@dsge` macro parses equilibrium conditions into a `ModelSpec`, `compute_steady_state` locates the deterministic steady state, `linearize` produces the Sims (2002) canonical form, and `solve` dispatches to linear (`:gensys`, `:blanchard_kahn`, `:klein`), higher-order perturbation, global (`:projection`, `:pfi`, `:vfi`), perfect-foresight, and occasionally-binding-constraint (OccBin) solvers.\nDownstream analysis \u2014 `simulate`, `irf`, `fevd`, `historical_decomposition`, GMM (`estimate_dsge`) and Bayesian (`estimate_dsge_bayes`) estimation \u2014 operates on the returned solution objects.\nThe `dsge/heterogeneous/` subdirectory adds incomplete-markets models (EGM/VFI household problems, Krusell-Smith, sequence-space Jacobian, Reiter, Winberry, DCEGM, Khan-Thomas, Bewley Banks) that dispatch through the same `solve`/`compute_steady_state` interface on the agent kind.\n\n# Functions\n\nTable capped at the 50 most important exported entry points; see the truncation note below.\n\n| Function | Signature | Role |\n|---|---|---|\n| [@dsge](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/parser.jl) | `@dsge begin ... end` | Specification DSL; parses equations into `ModelSpec` |\n| [compute_steady_state](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/steady_state.jl) | `compute_steady_state(spec; initial_guess=nothing, method=:auto, algorithm, constraints=nothing, solver=:auto)` | Numerical (NonlinearSolve) or analytical steady state |\n| [linearize](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/linearize.jl) | `linearize(spec::ModelSpec)` | First-order Taylor expansion; returns Sims canonical form `LinearDSGE` |\n| [solve](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/gensys.jl) | `solve(spec::ModelSpec; method=:gensys, kwargs...)` | Single entry point; dispatches on `method` and agent kind |\n| [gensys](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/gensys.jl) | `solve(spec; method=:gensys, div=1.0+1e-8, rank_rtol=1e-8, sparse=:auto)` | Default linear solver; undetermined-coefficients iteration with companion-QZ fallback |\n| [blanchard_kahn](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/blanchard_kahn.jl) | `solve(spec; method=:blanchard_kahn, div, rank_rtol, sparse)` | Linear solver via companion-QZ solvent |\n| [klein](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/klein.jl) | `solve(spec; method=:klein, div, rank_rtol, sparse)` | Linear solver via companion-QZ solvent |\n| [determinacy_region](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/determinacy.jl) | `determinacy_region(spec; params, grids, div, rank_rtol, method=:gensys, threaded=false)` | Sweep 1-2 parameters; returns `DeterminacyMap` of verdicts |\n| [determinacy_boundary](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/determinacy.jl) | `determinacy_boundary(m::DeterminacyMap)` | Locate determinacy frontier within half a grid step |\n| [is_determined](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/types.jl) | `is_determined(sol)` | True iff `eu == [1, 1]` (Sims rank conditions) |\n| [is_stable](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/types.jl) | `is_stable(sol)` | True iff max eigenvalue modulus of `G1` is below 1 |\n| [nshocks](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/types.jl) | `nshocks(sol)` | Number of exogenous shocks (`spec.n_exog`) |\n| [perturbation_solver](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/perturbation.jl) | `perturbation_solver(spec; order=2, sylvester_method=:auto, sylvester_tol=1e-8)` | Orders 1-3 perturbation (SGU 2004; Andreasen et al. 2018) |\n| [pruned_state_space](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/pruned_state_space.jl) | `pruned_state_space(sol::PerturbationSolution)` | Pruned system object (Kim et al. 2008) backing simulation and moments |\n| [collocation_solver](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/projection.jl) | `collocation_solver(spec; degree=5, grid=:auto, smolyak_mu=3, quadrature=:auto, tol=1e-8, max_iter=100, threaded=false)` | Global Chebyshev collocation (tensor or Smolyak grids) |\n| [pfi_solver](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/pfi.jl) | `pfi_solver(spec; kwargs...)` | Global Euler-equation time iteration (Coleman 1990); no reward needed |\n| [vfi_solver](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/vfi.jl) | `vfi_solver(spec; utility, beta, consumption, controls, transition, control_bounds, outcome, degree, n_grid, howard_steps)` | Bellman value-function iteration with Howard policy evaluation |\n| [evaluate_policy](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/projection.jl) | `evaluate_policy(sol::ProjectionSolution, x_state)` | Evaluate global policy at a state vector (or matrix of states) |\n| [max_euler_error](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/projection.jl) | `max_euler_error(sol::ProjectionSolution; n_test=1000, rng)` | Max Euler-equation error on random test points |\n| [perfect_foresight](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/perfect_foresight.jl) | `perfect_foresight(spec; kwargs...)` | Newton solver for deterministic transition paths |\n| [variable_bound](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/constraints.jl) | `variable_bound(var::Symbol; lower=nothing, upper=nothing)` | Box constraint constructor (e.g. ZLB) |\n| [nonlinear_constraint](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/constraints.jl) | `nonlinear_constraint(fn::Function; label=\"constraint\")` | Nonlinear inequality constraint `fn(...) <= 0` |\n| [parse_constraint](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/occbin.jl) | `parse_constraint(expr::Expr, spec::ModelSpec)` | Parse `var[t] >= bound` into `OccBinConstraint` |\n| [occbin_solve](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/occbin.jl) | `occbin_solve(spec, constraint; kwargs...)` | Guess-and-verify piecewise-linear solution (Guerrieri-Iacoviello 2015) |\n| [occbin_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/occbin.jl) | `occbin_irf(spec, constraint, horizon; kwargs...)` | IRFs under occasionally binding constraints |\n| [simulate](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/simulation.jl) | `simulate(sol, T_periods; shock_draws=nothing, rng)` | Stochastic forward simulation in levels (pruned for perturbation) |\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/simulation.jl) | `irf(sol, horizon; irf_type=:analytical, n_draws=500, shock_size=1.0)` | Analytical IRFs, or GIRFs via Monte Carlo for nonlinear solutions |\n| [fevd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/simulation.jl) | `fevd(sol, horizon; unconditional=false)` | h-step FEVD, or unconditional (augmented Lyapunov) at order >= 2 |\n| [solve_lyapunov](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/analytical.jl) | `solve_lyapunov(G1, impact)` | Unconditional covariance via doubling iteration + Bartels-Stewart fallback |\n| [analytical_moments](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/analytical.jl) | `analytical_moments(sol; lags=1)` | Moment vector matching `autocovariance_moments` for GMM |\n| [historical_decomposition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/hd.jl) | `historical_decomposition(sol, data, observables; measurement_error)` | Kalman-smoother shock attribution; Bayesian variant adds credible bands |\n| [dsge_smoother](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/smoother.jl) | `dsge_smoother(ss::DSGEStateSpace, data)` | Rauch-Tung-Striebel smoother for the linear state space |\n| [estimate_dsge](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/estimation.jl) | `estimate_dsge(spec, data, param_names; method=:irf_matching, ...)` | GMM estimation: `:irf_matching`, `:euler_gmm`, `:smm`, `:analytical_gmm` |\n| [estimate_dsge_bayes](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/bayes_estimation.jl) | `estimate_dsge_bayes(spec, data, theta0; priors, method=:smc, observables, n_smc)` | Bayesian estimation via `:smc`, `:smc2`, or RWMH |\n| [posterior_mode](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/bayes_estimation.jl) | `posterior_mode(spec, data, theta0; priors, observables)` | Posterior mode + Laplace-approximation marginal likelihood |\n| [posterior_summary](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/bayes_estimation.jl) | `posterior_summary(result::BayesianDSGE; min_ess=400)` | Posterior means, credible intervals, ESS per parameter |\n| [marginal_likelihood](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/bayes_estimation.jl) | `marginal_likelihood(result::BayesianDSGE)` | Log marginal likelihood from the sampler |\n| [bayes_factor](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/bayes_estimation.jl) | `bayes_factor(r1::BayesianDSGE, r2::BayesianDSGE)` | Log Bayes factor comparing two fitted models |\n| [mcmc_diagnostics](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/mcmc_diagnostics.jl) | `mcmc_diagnostics(result::BayesianDSGE)` | R-hat, ESS, and convergence diagnostics |\n| [bridge_sampling_ml](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/bayes_estimation.jl) | `bridge_sampling_ml(result::BayesianDSGE; kwargs...)` | Bridge-sampling marginal likelihood estimate |\n| [identification_diagnostics](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/identification.jl) | `identification_diagnostics(spec, param_names; kwargs...)` | Local identification checks for estimated parameters |\n| [dynare_prior](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/priors.jl) | `dynare_prior(dist::Symbol, mean_v, std_v; kwargs...)` | Dynare-compatible prior distributions incl. `InverseGamma1` |\n| [apply_prefilter](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/prefilter.jl) | `apply_prefilter(data, transform::Symbol; kwargs...)` | Detrending/prefiltering of observables (`PrefilterSpec`, `invert_prefilter`) |\n| [load_ha_example](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/heterogeneous/examples.jl) | `load_ha_example(name::Symbol; distribution=:young)` | Load HA example economies (`:krusell_smith`, one-/two-asset HANK, ...) |\n| [rouwenhorst](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/heterogeneous/types.jl) | `rouwenhorst(rho, sigma, n; sigma_is=:innovation)` | Rouwenhorst AR(1) discretization (log grid, `IncomeProcess`) |\n| [tauchen](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/heterogeneous/types.jl) | `tauchen(rho, sigma, n; m=3, sigma_is=:innovation)` | Tauchen AR(1) discretization (log grid, `IncomeProcess`) |\n| [ssj_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/heterogeneous/blocks.jl) | `ssj_irf(gej::SSJGEJacobian, dZ::AbstractDict; kwargs...)` | Sequence-space IRFs from the GE Jacobian (Auclert et al. 2021) |\n| [den_haan_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/heterogeneous/krusell_smith.jl) | `den_haan_test(sol; kwargs...)` | Den Haan accuracy test for Krusell-Smith / SSJ / Reiter dynamics |\n| [distribution_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/heterogeneous/analysis.jl) | `distribution_irf(sol::HADSGESolution, horizon; kwargs...)` | IRFs of the wealth distribution itself (Reiter method) |\n| [dcegm_solve](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/heterogeneous/dcegm.jl) | `dcegm_solve(prob::DCEGMProblem; max_iter=500, tol=1e-8)` | Discrete-continuous choice solver (Iskhakov et al. 2017) |\n\nTruncation note: omitted HA entry points available in `dsge/heterogeneous/`: `solve(spec; method=:ssj/:reiter/:krusell_smith)` aggregate solvers, `combine_blocks`/`block_jacobian` SSJ composition, `fit_winberry`/`winberry_moments` parametric distributions, `khan_thomas_steady_state`/`khan_thomas_mit` lumpy investment, `intermediary_steady_state`/`intermediary_mit` Bewley Banks, `dcegm_steady_state`/`dcegm_mit`/`dcegm_retirement_model`, `inequality_irf`/`simulate_panel`, `ha_grid_diagnostics`/`adaptive_asset_grid`, plus `dsge_particle_smoother`, `posterior_predictive`, `prior_predictive`, `learning_rate_check`, and `to_spec` family wrappers.\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nspec = @dsge begin\n    parameters: \u03b2 = 0.99, \u03b1 = 0.36, \u03b4 = 0.025, \u03c1 = 0.9, \u03c3 = 0.01\n    endogenous: Y, C, K, A\n    exogenous: \u03b5_A\n    Y[t] = A[t] * K[t-1]^\u03b1\n    C[t] + K[t] = Y[t] + (1 - \u03b4) * K[t-1]\n    1 = \u03b2 * (C[t] / C[t+1]) * (\u03b1 * A[t+1] * K[t]^(\u03b1 - 1) + 1 - \u03b4)\n    A[t] = A[t-1]^\u03c1 * exp(\u03c3 * \u03b5_A[t])\n    steady_state = begin\n        A_ss = 1.0\n        K_ss = (\u03b1 * \u03b2 / (1 - \u03b2 * (1 - \u03b4)))^(1 / (1 - \u03b1))\n        Y_ss = K_ss^\u03b1\n        C_ss = Y_ss - \u03b4 * K_ss\n        [Y_ss, C_ss, K_ss, A_ss]\n    end\nend\nspec = compute_steady_state(spec)\nsol = solve(spec)\nresult = irf(sol, 40)\n```\n\n# See also\n\n* [Continuous-Time Heterogeneous Agents](/dsge/ct.md) - HJB/KFE finite-difference Aiyagari and two-asset HANK\n* [Overlapping Generations](/dsge/olg.md) - Blanchard perpetual youth and life-cycle OLG\n* [State-Space Models (Unobserved Components, TVP)](/nonlinear-statespace/statespace.md) - Kalman filtering and RTS smoothing machinery underlying the DSGE likelihood and smoother\n* [Innovation Accounting](/multivariate/var.md) - IRF/FEVD/HD layer for VAR-family models", "dsge/olg": "# Summary\n\nThe `olg` module replaces the infinitely-lived household with finite horizons in two flavors.\n`BlanchardOLG` is the analytically tractable discrete-time Blanchard-Yaari perpetual-youth model with log utility and fair annuities: `blanchard_steady_state` bisects for the high-capital root, `blanchard_solve` linearizes the `(k, C)` saddle path, and `blanchard_transition` simulates convergence; government debt is net wealth so Ricardian equivalence fails.\n`LifeCycleOLG` is the Auerbach-Kotlikoff / Imrohoroglu life-cycle alternative with age-specific mortality, an age-earnings profile, retirement onto pay-as-you-go pensions, and backward-induction EGM solved by `lifecycle_steady_state`; `lifecycle_transition` computes Auerbach-Kotlikoff shooting transitions after TFP or capital displacements.\n`to_spec` wraps either family as a residual `ModelSpec` so `solve`/`irf` apply, and `blanchard_nk_spec` appends a small New Keynesian block to the perpetual-youth aggregates.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [BlanchardOLG](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/blanchard.jl) | `BlanchardOLG(; alpha=0.36, beta=0.96, delta=0.08, gamma=0.98, Z=1.0, b=0.0)` | Perpetual-youth calibration; `gamma = 1` is the Ramsey limit |\n| [blanchard_steady_state](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/blanchard.jl) | `blanchard_steady_state(m::BlanchardOLG; tol=1e-10, max_iter=200)` | Bisection for the high-capital root; returns `BlanchardOLGSteadyState` |\n| [blanchard_solve](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/blanchard.jl) | `blanchard_solve(m::BlanchardOLG, ss::BlanchardOLGSteadyState)` | Linearized `(k, C)` saddle path; returns `BlanchardOLGSolution` |\n| [blanchard_transition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/blanchard.jl) | `blanchard_transition(m, sol, k0::Real; H=50)` | `(k, C, r, w)` convergence paths from initial capital `k0` |\n| [to_spec](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/blanchard.jl) | `to_spec(m::BlanchardOLG; rho_z=0, sigma_z=0)` | Residual `ModelSpec` on `(k, C, r, w, Z)` for Gensys `solve`/`irf` |\n| [blanchard_nk_spec](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/blanchard.jl) | `blanchard_nk_spec(m::BlanchardOLG; rho_z=0, sigma_z=0, kwargs...)` | Appends Phillips, Taylor, and Fisher residuals to the OLG aggregates |\n| [LifeCycleOLG](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/lifecycle.jl) | `LifeCycleOLG(; J=60, J_retire=45, survival=0.99, earnings, income, replacement=0.4, annuities=true, n_pop=0.0, beta=0.97, sigma=2.0, alpha=0.36, delta=0.06, Z=1.0, a_max=60.0, n_a=200, credit_limit=0.0, grid_type=:double_exp)` | Age-structured life-cycle calibration with retirement and pensions |\n| [lifecycle_steady_state](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/lifecycle.jl) | `lifecycle_steady_state(m::LifeCycleOLG; r_bounds=(-0.02, 0.10), tol=1e-6, max_iter=60, bequest_iter=50, verbose=false)` | Capital-market-clearing stationary equilibrium via bisection |\n| [lifecycle_policies](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/lifecycle.jl) | `lifecycle_policies(m::LifeCycleOLG, r, w; tau, pension)` | Backward age-EGM sweep at given prices; returns `(c_pol, a_pol)` |\n| [lifecycle_distribution](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/lifecycle.jl) | `lifecycle_distribution(m::LifeCycleOLG, a_pol; kwargs...)` | Forward cohort push to the unit-mass `n_a x n_e x J` distribution |\n| [lifecycle_income](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/lifecycle.jl) | `lifecycle_income(rho, sigma, n; method=:rouwenhorst)` | Idiosyncratic productivity in levels, normalized to unit mean |\n| [lifecycle_survival](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/lifecycle.jl) | `lifecycle_survival(J::Int; age0=21, makeham=0.0002, kwargs...)` | Gompertz-Makeham age-specific survival profile |\n| [lifecycle_transition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/lifecycle.jl) | `lifecycle_transition(m::LifeCycleOLG, k0::Real; H=80, tol=1e-5, max_iter=80, relax=0.5)` | Shooting transition from displaced capital; returns `LifeCycleTransition` |\n| [lifecycle_transition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/lifecycle.jl) | `lifecycle_transition(m::LifeCycleOLG, Z_path::AbstractVector; ss=nothing, tol=1e-5, max_iter=80, relax=0.5)` | Shooting transition along a TFP path returning to `Z` |\n| [to_spec](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/olg/lifecycle.jl) | `to_spec(m::LifeCycleOLG; agent_name=:households)` | `LifeCycleSystem` wrapper; `solve` dispatches to `lifecycle_steady_state` |\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/family_facades.jl) | `irf(ss::LifeCycleSteadyState, horizon; kwargs...)` | TFP-shock responses from the life-cycle transition machinery |\n| [simulate](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/dsge/family_facades.jl) | `simulate(ss::LifeCycleSteadyState, T_periods; kwargs...)` | Forward simulation from the life-cycle steady state |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nm = BlanchardOLG(; alpha=0.36, beta=0.96, delta=0.08, gamma=0.98)\nss = blanchard_steady_state(m)\nreport(ss)\nsol = blanchard_solve(m, ss)\n```\n\n# See also\n\n* [DSGE Models](/dsge/dsge.md) - representative-agent pipeline; Gensys backend for `to_spec` wrappers\n* [Continuous-Time Heterogeneous Agents](/dsge/ct.md) - infinite-horizon incomplete markets in continuous time", "forecasting/fceval": "# Summary\n\nThe `fceval` module scores point forecasts without touching any forecast type: every function consumes a plain vector of realized values plus a vector or matrix of forecasts, so output from a VAR, ARIMA, MIDAS regression, or a spreadsheet is scored the same way. It provides accuracy metrics (ME, MAE, RMSE, MAPE, sMAPE, MASE, Theil U1/U2, and the Theil MSE bias/variance/covariance decomposition), the Diebold-Mariano equal-accuracy test with the Harvey-Leybourne-Newbold small-sample correction, the Clark-West test for nested models, the Mincer-Zarnowitz efficiency regression, the Harvey-Leybourne-Newbold encompassing test, and three combination schemes (equal, Bates-Granger inverse-MSE, Granger-Ramanathan constrained least squares). Forecast errors follow the convention `e = actual - forecast`; the DM and Clark-West tests take error series while the other functions take forecasts alongside actuals.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [forecast_evaluate](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/metrics.jl) | `forecast_evaluate(actual, fc; seasonal_period=1, insample=nothing, model_names=nothing) -> ForecastEvaluation` | Accuracy metrics plus Theil MSE decomposition for one forecast (vector) or several (T x M matrix) |\n| [diebold_mariano](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/tests.jl) | `diebold_mariano(e1, e2; h=1, loss=:se, hln=true, kernel=:rectangular, alternative=:two_sided) -> DMTestResult` | Equal-predictive-accuracy test on two error series; invalid for nested models |\n| [clark_west](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/tests.jl) | `clark_west(e_small, e_big, f_adj; h=1, alternative=:greater) -> ClarkWestResult` | Adjusted-MSPE test for nested models; third argument is the gap between the two point forecasts |\n| [mincer_zarnowitz](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/tests.jl) | `mincer_zarnowitz(actual, fc; lags=0, kernel=:bartlett) -> MincerZarnowitzResult` | Efficiency regression `y = a + b*fc` with joint Wald test of `(a, b) = (0, 1)` |\n| [forecast_encompassing](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/tests.jl) | `forecast_encompassing(actual, fc1, fc2; lags=0, kernel=:bartlett) -> ForecastEncompassingResult` | Tests `b2 = 0` in `y = a + b1*fc1 + b2*fc2`; non-rejection means fc1 encompasses fc2 |\n| [combine_forecasts](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/combine.jl) | `combine_forecasts(F, actual; method=:equal, model_names=nothing) -> ForecastCombination` | Blends forecast columns into one series; Granger-Ramanathan weights may be negative |\n| [ForecastEvaluation](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/types.jl) | `struct ForecastEvaluation{T<:AbstractFloat}` | Accuracy table: `models`, `metrics`, `values`, `decomp`, `n` |\n| [DMTestResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/types.jl) | `struct DMTestResult{T<:AbstractFloat} <: StatsAPI.HypothesisTest` | DM test result: `statistic`, `pvalue`, `dbar`, `lrvar`, `h`, `loss`, `hln`, `alternative`, `T_obs` |\n| [ClarkWestResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/types.jl) | `struct ClarkWestResult{T<:AbstractFloat} <: StatsAPI.HypothesisTest` | Clark-West result: `statistic`, `pvalue`, `fbar`, `lrvar`, `h`, `alternative`, `T_obs` |\n| [MincerZarnowitzResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/types.jl) | `struct MincerZarnowitzResult{T<:AbstractFloat} <: StatsAPI.HypothesisTest` | Efficiency result: `a`, `b`, `se`, `wald`, `pvalue_wald`, `fstat`, `pvalue_f`, `lags`, `kernel`, `T_obs` |\n| [ForecastEncompassingResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/types.jl) | `struct ForecastEncompassingResult{T<:AbstractFloat} <: StatsAPI.HypothesisTest` | Encompassing result: `b1`, `b2`, `se_b2`, `tstat`, `pvalue`, `lags`, `kernel`, `T_obs` |\n| [ForecastCombination](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/fceval/types.jl) | `struct ForecastCombination{T<:AbstractFloat}` | Combination result: `weights`, `combined`, `method`, `mse`, `models` |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\n# actual: realized values; F: T x M matrix of competing forecasts\nev = forecast_evaluate(actual, F; model_names=[\"AR(2)\", \"Random walk\", \"Mean\"])\nreport(ev)\ndm = diebold_mariano(actual .- F[:, 1], actual .- F[:, 2]; h=1, loss=:se)\nreport(dm)\ncomb = combine_forecasts(F, actual; method=:granger_ramanathan)\nreport(comb)\n```\n\n# See also\n\n- /forecasting/nowcast.md\n- /multivariate/var.md\n- /univariate/arima.md", "forecasting/nowcast": "# Summary\n\nThe `nowcast` module produces current-quarter estimates of quarterly aggregates from timely monthly indicators under the three defining challenges of the problem: mixed frequencies, ragged edges, and large cross-sections. All estimators share one data layout: a `T x N` matrix whose first `nM` columns are monthly and whose last `nQ` columns are quarterly (observed every 3rd row, `NaN` otherwise), with trailing `NaN`s for the ragged edge. Four estimators are provided: a dynamic factor model estimated by the EM algorithm with Mariano-Murasawa temporal aggregation for large panels, a large Bayesian VAR with data-driven GLP shrinkage hyperparameters for medium panels, bridge equations (pairwise OLS combined by median) as a fast transparent baseline, and single-indicator MIDAS (documented with the MIDAS module). A news decomposition attributes each nowcast revision between data vintages to individual releases using Kalman-gain weights from the DFM state space. The `nowcast()` function extracts the current-quarter estimate plus a one-quarter-ahead forecast from any fitted model.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [nowcast_dfm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/dfm.jl) | `nowcast_dfm(Y, nM, nQ; r=2, p=1, idio=:ar1, blocks=nothing, max_iter=100, thresh=1e-4) -> NowcastDFM` | EM-estimated dynamic factor model with Mariano-Murasawa [1 2 3 2 1] quarterly aggregation |\n| [nowcast_bvar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/bvar_nowcast.jl) | `nowcast_bvar(Y, nM, nQ; lags=5, thresh=1e-6, max_iter=nothing, lambda0=0.2, theta0=1.0, miu0=1.0, alpha0=2.0, prior=:conjugate, theta_cross0=nothing) -> NowcastBVAR` | Large BVAR with marginal-likelihood-tuned shrinkage; Kalman smoother fills the ragged edge |\n| [nowcast_bridge](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/bridge.jl) | `nowcast_bridge(Y, nM, nQ; lagM=1, lagQ=1, lagY=1) -> NowcastBridge` | Pairwise OLS bridge equations on quarterly aggregates, combined by median |\n| [nowcast_news](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/news.jl) | `nowcast_news(X_new, X_old, model::NowcastDFM, target_period; target_var=size(X_new,2), groups=nothing, group_names=nothing) -> NowcastNews` | Splits a revision between vintages into per-release news, revision, and re-estimation impacts |\n| [nowcast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/forecast.jl) | `nowcast(model::AbstractNowcastModel; target_var=nothing) -> NowcastResult` | Current-quarter estimate plus one-quarter-ahead forecast from any fitted nowcast model |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/forecast.jl) | `forecast(model::NowcastDFM, h; target_var=nothing)` / `forecast(model::NowcastBVAR, h; target_var=nothing)` | Multi-step monthly forecast path; horizon counts months, and no bridge method exists |\n| [NowcastDFM](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/types.jl) | `struct NowcastDFM{T<:AbstractFloat} <: AbstractNowcastModel` | DFM fit: smoothed panel `X_sm`, factors `F`, state-space matrices, `loglik`, `n_iter` |\n| [NowcastBVAR](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/types.jl) | `struct NowcastBVAR{T<:AbstractFloat} <: AbstractNowcastModel` | BVAR fit: `beta`, `sigma`, optimal `lambda`/`theta`/`miu`/`alpha`, `converged` flag |\n| [NowcastBridge](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/types.jl) | `struct NowcastBridge{T<:AbstractFloat} <: AbstractNowcastModel` | Bridge fit: `Y_nowcast` medians, `Y_individual` per-equation predictions, `coefficients` |\n| [NowcastResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/types.jl) | `struct NowcastResult{T<:AbstractFloat}` | Extracted `nowcast`, `forecast`, and `method` (:dfm, :bvar, or :bridge) |\n| [NowcastNews](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/types.jl) | `struct NowcastNews{T<:AbstractFloat}` | Decomposition: `old_nowcast`, `new_nowcast`, `impact_news`, `impact_revision`, `impact_reestimation`, group impacts |\n| [NowcastForecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nowcast/types.jl) | `struct NowcastForecast{T<:AbstractFloat}` | Horizon table from `forecast`; indexes like the underlying array |\n\nNote: `balance_panel` (panel imputation via the DFM, `TimeSeriesData`/`PanelData` dispatch) lives in `src/data/panel.jl` and is documented on the DFM nowcasting docs page.\n\n# Examples\n\n```julia\nusing MacroEconometricModels\n# Y: T x N mixed-frequency panel, first nM columns monthly, last nQ quarterly (NaN off quarter-ends)\ndfm = nowcast_dfm(Y, nM, nQ; r=2, p=1, idio=:ar1)\nreport(dfm)\nresult = nowcast(dfm)\nreport(result)\nX_old = copy(Y); X_old[end, 1:3] .= NaN  # vintage before three releases\nnews = nowcast_news(Y, X_old, dfm, size(Y, 1); target_var=nM + nQ)\nreport(news)\n```\n\n# See also\n\n- /forecasting/fceval.md\n- /multivariate/factor.md\n- /multivariate/bvar.md\n- /multivariate/midas.md\n- /infrastructure/data.md", "infrastructure/core": "# Summary\n\nThe `core` module is the package's shared kernel: the innovation-accounting layer (`irf`, `fevd`, `historical_decomposition`) consumed by every VAR-family fit, the unified SVAR identification dispatcher (`compute_Q`) with proxy, sign, narrative, and long-run schemes, HAC/robust covariance estimators, a consolidated Kalman kernel, reproducibility manifests with bit-for-bit `reproduce`, JLD2 model persistence (`save_model`/`load_model`), Tables.jl/CSV exports, logging, and display backends. The table below covers the primary entry points; set-identification internals (`arias.jl`, `uhlig.jl`, `maxshare.jl`, `robust_bayes.jl`, `ab.jl`) and bootstrap-scheme helpers are intentionally truncated.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/irf.jl) | `irf(model::VARModel, horizon::Int; method=:cholesky, ci_type=:none, reps=200, conf_level=0.95, ...)` | Frequentist IRFs with bootstrap, theoretical, or identified-set bands |\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/irf.jl) | `irf(post::BVARPosterior, horizon::Int; method=:cholesky, quantiles=[0.16, 0.5, 0.84], ...)` | Bayesian IRFs with posterior quantiles |\n| [lp_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/irf.jl) | `lp_irf(model::LPModel; conf_level=0.95, ci_type=:analytical, ...)` | LP IRFs with analytical or fixed-design bootstrap bands |\n| [ma_coefficients](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/irf.jl) | `ma_coefficients(B, n, p, H)` | Reduced-form MA coefficients `\u03a6_0 = I, \u2026, \u03a6_{H-1}` |\n| [cumulative_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/irf.jl) | `cumulative_irf(irf_result::ImpulseResponse)` | Cumulative IRFs, cumulating draws before quantiles |\n| [fevd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/fevd.jl) | `fevd(model::VARModel, horizon::Int; method=:cholesky, ...)` | Forecast error variance decomposition shares |\n| [generalized_fevd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/fevd.jl) | `generalized_fevd(model::VARModel, horizon::Int; normalize=false, ...)` | Ordering-invariant Pesaran-Shin generalized FEVD |\n| [historical_decomposition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/hd.jl) | `historical_decomposition(model::VARModel, horizon=effective_nobs(model); method=:cholesky, ...)` | Shock contributions plus initial conditions |\n| [contribution](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/hd.jl) | `contribution(hd::HistoricalDecomposition, var::Int, shock::Int)` | One variable-by-shock contribution time series |\n| [verify_decomposition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/hd.jl) | `verify_decomposition(hd::HistoricalDecomposition; tol=1e-10)` | Check contributions plus initial conditions equal actual |\n| [identify_proxy](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `identify_proxy(model::VARModel, Z::AbstractMatrix; shocks=..., normalize=:unit_effect, ...)` | External-instrument (proxy) SVAR identification |\n| [identify_sign](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `identify_sign(model::VARModel, horizon::Int, check_func::Function; max_draws=1000, store_all=false, ...)` | Sign-restriction rotations via Haar draws |\n| [identify_narrative](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `identify_narrative(model::VARModel, horizon::Int, sign_check::Function, narrative_check::Function; ...)` | Combined sign and narrative restrictions |\n| [identify_long_run](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `identify_long_run(model::VARModel)` | Blanchard-Quah long-run rotation |\n| [compute_Q](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `compute_Q(model::VARModel, method::Symbol; horizon=1, ...)` | Unified identification dispatcher returning `Q` |\n| [compute_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `compute_irf(model::VARModel, Q::AbstractMatrix, horizon::Int)` | `horizon \u00d7 n \u00d7 n` IRF array for a given rotation |\n| [compute_structural_shocks](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `compute_structural_shocks(model::VARModel, Q::AbstractMatrix)` | Recover structural shocks from residuals |\n| [generate_Q](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `generate_Q(n::Int; rng, seed)` | Haar-uniform random orthogonal matrix |\n| [ProxySVARResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `struct ProxySVARResult{T} <: AbstractAnalysisResult` | Proxy SVAR result with first-stage F and reliability |\n| [irf_percentiles](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `irf_percentiles(s::SignIdentifiedSet; quantiles=[0.16, 0.5, 0.84])` | Pointwise IRF quantiles over an identified set |\n| [median_target](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `median_target(s)` | Fry-Pagan median-target rotation of an identified set |\n| [joint_band](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `joint_band(s; level=0.68, loss=:absolute)` | Inoue-Kilian joint credible band |\n| [sup_t_band](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `sup_t_band(s; level=0.68)` | Montiel Olea-Plagborg-M\u00f8ller sup-t simultaneous band |\n| [label_shocks](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `label_shocks(result::AbstractNonGaussianSVAR; by=:restrictions, ...)` | Relabel statistical-ID shocks by signed permutation |\n| [newey_west](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/covariance.jl) | `newey_west(X, residuals; bandwidth=0, kernel=:bartlett, prewhiten=false, ...)` | Newey-West HAC covariance matrix |\n| [white_vcov](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/covariance.jl) | `white_vcov(X, residuals; variant=:hc0, ...)` | White heteroskedasticity-robust covariance (HC0-HC3) |\n| [driscoll_kraay](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/covariance.jl) | `driscoll_kraay(X, u; bandwidth=0, kernel=:bartlett, ...)` | Driscoll-Kraay covariance |\n| [robust_vcov](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/covariance.jl) | `robust_vcov(X, residuals, estimator::AbstractCovarianceEstimator)` | Dispatch to a covariance-estimator object |\n| [optimal_bandwidth_nw](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/covariance.jl) | `optimal_bandwidth_nw(residuals; kernel=:bartlett)` | Andrews (1991) plug-in HAC bandwidth |\n| [long_run_covariance](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/covariance.jl) | `long_run_covariance(X; bandwidth=0, kernel=:bartlett)` | Kernel long-run covariance matrix |\n| [register_cov_estimator!](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/covariance.jl) | `register_cov_estimator!(name::Symbol, ::Type{E})` | Register a custom covariance estimator type |\n| [lrvar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/lrvar.jl) | `lrvar(U; kernel=:bartlett, bandwidth=:andrews, prewhiten=false, demean=true)` | Two-sided kernel long-run variance/covariance |\n| [lrcov_oneside](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/lrvar.jl) | `lrcov_oneside(U; kernel=:bartlett, bandwidth=:andrews, ...)` | One-sided long-run covariance for FMOLS/CCR |\n| [varhac](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/lrvar.jl) | `varhac(U; ic=:aic, max_lag=:auto, demean=true)` | Parametric VARHAC long-run covariance |\n| [construct_var_matrices](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/utils.jl) | `construct_var_matrices(Y, p)` | VAR design matrices `Y_eff = X * B + U` |\n| [companion_matrix](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/utils.jl) | `companion_matrix(B, n, p)` | VAR(p) to VAR(1) companion form |\n| [robust_inv](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/utils.jl) | `robust_inv(A; silent=false, rcond_tol=...)` | Matrix inverse with pseudo-inverse fallback |\n| [safe_cholesky](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/utils.jl) | `safe_cholesky(A; jitter=1e-10, silent=false)` | Cholesky factor with scale-relative jitter |\n| [capture_manifest](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/repro.jl) | `capture_manifest(; seed=nothing, settings=...)` | Capture a reproducibility manifest |\n| [reproduce](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/repro.jl) | `reproduce(result)` | Re-run a randomized result and compare bit-for-bit |\n| [save_model](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/serial/api.jl) | `save_model(model, path; note=\"\", compress=false)` | Persist a model, container, or bundle to JLD2 |\n| [load_model](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/serial/api.jl) | `load_model(path)` | Reconstruct a saved model or bundle dict |\n| [model_info](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/serial/bundles.jl) | `model_info(path)` | Read a model file header without reconstructing |\n| [set_log_level](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/logging.jl) | `set_log_level(level)` | Set the global minimum log level |\n| [with_min_level](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/logging.jl) | `with_min_level(f, level)` | Run `f()` at a scoped minimum log level |\n| [set_display_backend](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/display.jl) | `set_display_backend(backend::Symbol)` | Set the PrettyTables backend (`:text`, `:latex`, `:html`) |\n| [long_table](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/tables.jl) | `long_table(result)` | Tidy long table of an array-valued result |\n| [write_csv](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/tables.jl) | `write_csv(result, path)` | Export a result or table to CSV |\n| [KalmanFilterStore](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/kalman_kernel.jl) | `KalmanFilterStore{T}(n_state, T_obs; innovations=false)` | Storage sink for the consolidated Kalman filter |\n| [MacroModelError](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/exceptions.jl) | `abstract type MacroModelError <: Exception` | Root of the typed error hierarchy |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfred = load_example(:fred_md)\nd = fix(apply_tcode(fred[:, [\"INDPRO\", \"CPIAUCSL\", \"FEDFUNDS\"]]))\nmodel = estimate_var(d, 2)\nirfs = irf(model, 20; method=:cholesky)\nhd = historical_decomposition(model)\nverify_decomposition(hd)\n```\n\n# See also\n\n* [Data Management](/infrastructure/data.md) - typed containers that feed every core routine\n* [Simulation (DGPs)](/infrastructure/dgp.md) - population IRF/FEVD/HD moments validating this layer\n* [Visualization](/infrastructure/plotting.md) - plots of IRF, FEVD, and HD results\n* [Vector Autoregression](/multivariate/var.md) - the canonical consumer of core innovation accounting\n* [Bayesian VAR](/multivariate/bvar.md) - posterior draws behind the Bayesian methods\n* [Hypothesis Tests](/testing/teststat.md) - tests built on the HAC/long-run-variance toolkit", "infrastructure/data": "# Summary\n\nThe `data` module provides the typed containers every estimator accepts: `TimeSeriesData`, `PanelData`, and `CrossSectionData`, each carrying variable names, descriptions, and bibliographic references alongside the numbers. Thirteen built-in datasets (FRED-MD/QD, PWT, DDCG, mpdta, Grunfeld, Mroz, stackloss, Nile, Hamilton GNP, Denmark, WIOD, monetary-policy shocks) load via `load_example`; FRED transformation codes 1-7 map levels to stationary series with `inverse_tcode` reconstructing levels; `diagnose`/`fix`/`dropna`/`keeprows` validate and clean; Stata-style `xtset` plus within-group lag/lead/difference and DFM gap-filling cover panels; and container methods on 40+ estimators mean no manual `to_matrix` calls.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [TimeSeriesData](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `TimeSeriesData(data::AbstractMatrix; varnames, frequency=Other, tcode, time_index, ...)` | Time-series container with metadata |\n| [PanelData](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `struct PanelData{T} <: AbstractMacroData` | Stacked panel container with group/time ids |\n| [CrossSectionData](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `CrossSectionData(data::AbstractMatrix; varnames, obs_id, ...)` | Cross-section container with observation ids |\n| [Frequency](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `@enum Frequency Daily Monthly Quarterly Yearly Mixed Other` | Data-frequency metadata enum |\n| [nobs](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `StatsAPI.nobs(d::AbstractMacroData)` | Number of observations |\n| [nvars](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `nvars(d::AbstractMacroData)` | Number of variables |\n| [varnames](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `varnames(d::AbstractMacroData)` | Variable names |\n| [frequency](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `frequency(d::TimeSeriesData)` | Data frequency metadata |\n| [time_index](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `time_index(d::TimeSeriesData)` | Integer time identifiers |\n| [dates](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `dates(d::TimeSeriesData)` | Date labels for indexing and plot axes |\n| [obs_id](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `obs_id(d::CrossSectionData)` | Observation identifiers |\n| [desc](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `desc(d::AbstractMacroData)` | Dataset description |\n| [vardesc](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `vardesc(d::AbstractMacroData, name::String)` | Per-variable description |\n| [rename_vars!](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `rename_vars!(d, old::String => new::String)` | Rename variables in place, descriptions follow |\n| [set_dates!](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `set_dates!(d::TimeSeriesData, dt::Vector{String})` | Attach date labels, enabling date indexing |\n| [set_desc!](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `set_desc!(d::AbstractMacroData, text::String)` | Set the dataset description |\n| [set_vardesc!](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/types.jl) | `set_vardesc!(d::AbstractMacroData, name::String, text::String)` | Set one variable description |\n| [load_example](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/examples.jl) | `load_example(name::Symbol)` | Load a built-in dataset container |\n| [apply_tcode](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/data/transform.jl) | `apply_tcode(y::AbstractVector, tcode::Int)` | FRED transform of
