el{T} <: AbstractLPModel` | Weighted LP fit for discrete treatments |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nlp = estimate_lp(Y, 3, 20; lags=4, cov_type=:newey_west, varnames=vnames)\nresult = lp_irf(lp; conf_level=0.95)\nreport(result)\nslp = structural_lp(Y, 20; method=:cholesky, lags=4, varnames=vnames)\nreport(slp)\n```\n\n# See also\n\n* [Vector Autoregression](/multivariate/var.md) - system-based impulse responses and the `compare_var_lp` baseline\n* [Bayesian VAR](/multivariate/bvar.md) - Bayesian impulse responses with credible bands\n* [Vector Error Correction Models](/multivariate/vecm.md) - impulse responses for cointegrated systems\n* [Factor Models](/multivariate/factor.md) - factor-augmented settings where LP responses apply", "multivariate/mgarch": "# Summary\n\nThe `mgarch` module fits the conditional covariance matrix `H_t` of an `n`-dimensional return panel through three specifications.\nCCC (Bollerslev 1990) reuses univariate `estimate_garch` margins and holds the standardized-residual correlation fixed (`H_t = D_t R D_t`).\nDCC (Engle 2002) keeps the two-step margins and adds scalar correlation dynamics `(a, b)` estimated by correlation-targeted quasi-likelihood, with the Aielli (2013) cDCC correction available.\nScalar and diagonal BEKK (Engle & Kroner 1995) model the covariance directly with covariance targeting and no separate margins.\nAll three return an `MGARCHModel` with the `n x n x T` covariance path, plus `covariances` / `correlations` / `variances` accessors and multi-step covariance forecasts.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_ccc](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/mgarch/ccc.jl) | `estimate_ccc(Y::AbstractMatrix; p::Int=1, q::Int=1)` | CCC-GARCH with univariate GARCH margins and constant correlation; returns `MGARCHModel` |\n| [estimate_dcc](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/mgarch/dcc.jl) | `estimate_dcc(Y::AbstractMatrix; p::Int=1, q::Int=1, correction=:none)` | DCC-GARCH with scalar `(a, b)` correlation dynamics; `correction=:aielli` gives cDCC |\n| [estimate_bekk](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/mgarch/bekk.jl) | `estimate_bekk(Y::AbstractMatrix; kind=:scalar)` | Scalar (`:scalar`) or diagonal (`:diagonal`) BEKK(1,1) with covariance targeting |\n| [covariances](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/mgarch/types.jl) | `covariances(m::MGARCHModel)` | Conditional covariance path `H_t` (`n x n x T`) |\n| [correlations](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/mgarch/types.jl) | `correlations(m::MGARCHModel)` | Conditional correlation path (`n x n x T`; constant models broadcast) |\n| [variances](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/mgarch/types.jl) | `variances(m::MGARCHModel)` | Per-series conditional variances (`T x n`, the diagonals of `H_t`) |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/mgarch/forecast.jl) | `forecast(m::MGARCHModel, h::Int)` | `h`-step-ahead covariance forecasts as an `n x n x h` array |\n| [MGARCHModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/mgarch/types.jl) | `struct MGARCHModel{T} <: AbstractMGARCHModel` | Fitted model: margins, `H`/`R`/`Rbar` paths, second-stage params, QML sandwich vcov |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nccc = estimate_ccc(Yret)\nreport(ccc)\ndcc = estimate_dcc(Yret)\na, b = coef(dcc)\nRt = correlations(dcc)\nfc = forecast(dcc, 10)\nbekk = estimate_bekk(Yret)\nreport(bekk)\n```\n\n# See also\n\n* [Vector Autoregression](/multivariate/var.md) - conditional-mean dynamics for the same return panels\n* [Bayesian VAR](/multivariate/bvar.md) - TVP-VAR with stochastic volatility as a parameter-driven alternative\n* [Statistical Identification](/multivariate/nongaussian.md) - GARCH-based SVAR identification via heteroskedasticity\n* [Factor Models](/multivariate/factor.md) - dimension reduction for large cross-asset panels", "multivariate/midas": "# Summary\n\nThe `midas` module regresses a low-frequency target on `K` high-frequency lags of one indicator aggregated through a normalized weight function `w(\u03b8)` (Ghysels, Santa-Clara & Valkanov 2006).\nRestricted MIDAS (`:expalmon`, `:beta2`, `:beta3`, `:almon`) is nonlinear least squares with the linear coefficients concentrated out and L-BFGS optimization from a multi-start grid; `p_ar > 0` adds autoregressive lags (ADL-MIDAS, Clements & Galvao 2008); `:umidas` drops the weight function for plain OLS on the stacked lags.\nAlignment is positional: the last high-frequency observation anchors to the last target period, and incomplete blocks are dropped.\n`forecast` produces a direct point forecast with a Gaussian NLS prediction interval combining residual variance and parameter uncertainty, and `h > 1` estimates the direct multi-step regression.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_midas](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/midas/estimation.jl) | `estimate_midas(y_lf, X_hf; m, K, weights=:expalmon, p_ar=0, poly_degree=2, h=1, max_iter=500)` | Restricted MIDAS NLS, ADL-MIDAS, or U-MIDAS OLS; returns `MidasModel` |\n| [midas_weights](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/midas/types.jl) | `midas_weights(m::MidasModel)` | Realized weight curve `w(\u03b8\u0302)` (length `K`, most-recent-first) |\n| [midas_weights](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/midas/types.jl) | `midas_weights(theta, K::Int; kind=:expalmon)` | Evaluate a weight function directly from parameters |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/midas/forecast.jl) | `forecast(m::MidasModel, X_new; y_lags=nothing, level=0.95)` | Direct forecast from a fresh HF block with NLS prediction interval; returns `MidasForecast` |\n| [MidasModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/midas/types.jl) | `struct MidasModel{T} <: StatsAPI.RegressionModel` | Fitted MIDAS: `beta`, `theta`, weight curve `w`, Gauss-Newton vcov, fit criteria |\n| [MidasForecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/midas/types.jl) | `struct MidasForecast{T} <: AbstractForecastResult{T}` | Direct forecast with `se`, interval bounds, horizon, coverage |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nmodel = estimate_midas(gdp_q, ip_m; m=3, K=6, weights=:expalmon, p_ar=1)\nreport(model)\nround.(midas_weights(model); digits=4)\nfc = forecast(model, ip_new)\nreport(fc)\n```\n\n# See also\n\n* [Factor Models](/multivariate/factor.md) - mixed-frequency DFM as a multi-indicator alternative\n* [Bayesian VAR](/multivariate/bvar.md) - mixed-frequency MFVAR for joint multi-series nowcasting\n* [Vector Autoregression](/multivariate/var.md) - single-frequency forecasting baseline", "multivariate/nongaussian": "# Summary\n\nThe `nongaussian` module recovers the structural impact matrix `B0 = L Q` from higher-moment information instead of economic restrictions: at most one Gaussian shock (Darmois-Skitovich) or regime-varying variances identify the rotation.\nFive nonparametric ICA estimators (FastICA, JADE, SOBI, distance covariance, HSIC), four parametric ML estimators (Student-t, mixture of normals, Pearson Type IV PML, skew-normal) plus the `identify_nongaussian_ml` dispatcher, and Keweloh/Lanne-Luoto moment GMM exploit non-Gaussianity; Markov-switching, GARCH, smooth-transition, and external-regime estimators plus Lewis (2021) model-free TVV GMM and the Bertsche-Braun SV-SVAR exploit heteroskedasticity.\nEvery result plugs into `irf`/`fevd`/`historical_decomposition` via a `method=` symbol, `label_shocks` resolves the column permutation and sign, and the `test_*` diagnostics check Gaussianity, independence, distinct variance ratios, and label stability before interpretation.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [identify_fastica](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ica.jl) | `identify_fastica(model; contrast=:logcosh, approach=:deflation, max_iter=200, tol=1e-6, seed, rng)` | Negentropy-maximizing ICA (Hyvarinen 1999); returns `ICASVARResult` |\n| [identify_jade](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ica.jl) | `identify_jade(model; max_iter=100, tol=1e-6)` | Fourth-cumulant joint diagonalization (Cardoso & Souloumiac 1993) |\n| [identify_sobi](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ica.jl) | `identify_sobi(model; lags=1:12, max_iter=100, tol=1e-6)` | Second-order blind identification from autocovariances (Belouchrani et al. 1997) |\n| [identify_dcov](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ica.jl) | `identify_dcov(model; max_iter=200, tol=1e-6)` | Independence search via pairwise distance covariance (Matteson & Tsay 2017) |\n| [identify_hsic](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ica.jl) | `identify_hsic(model; kernel=:gaussian, sigma=1.0, max_iter=200, tol=1e-6, seed, rng)` | Kernel-independence (HSIC) search with median-heuristic bandwidth |\n| [identify_student_t](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ml.jl) | `identify_student_t(model; max_iter=500, tol=1e-6)` | ML with shock-specific Student-t tails (Lanne, Meitz & Saikkonen 2017) |\n| [identify_mixture_normal](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ml.jl) | `identify_mixture_normal(model; n_components=2, max_iter=500, tol=1e-6)` | ML with two-component Gaussian-mixture shocks (Lanne & Lutkepohl 2010) |\n| [identify_pml](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ml.jl) | `identify_pml(model; max_iter=500, tol=1e-6)` | ML with normalized Pearson Type IV shocks (skewness + heavy tails) |\n| [identify_skew_normal](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ml.jl) | `identify_skew_normal(model; max_iter=500, tol=1e-6)` | ML with Azzalini skew-normal shocks |\n| [identify_nongaussian_ml](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ml.jl) | `identify_nongaussian_ml(model; distribution=:student_t, max_iter=500, tol=1e-6)` | Unified ML dispatcher over the four shock distributions |\n| [identify_gmm_moments](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/gmm.jl) | `identify_gmm_moments(model; moments=:both, weighting=:two_step, se=:sandwich, hac=true, bandwidth=0, max_iter=100, tol=1e-8, n_starts=1, rng)` | Coskewness/cokurtosis GMM (Keweloh 2021) with Hansen J and sandwich SEs |\n| [identify_lewis_tvv](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/lewis_tvv.jl) | `identify_lewis_tvv(model; K=5, lags=1:K, weighting=:two_step, hac=true, bandwidth=0, n_starts=10, max_iter=100, tol=1e-8, rng)` | Model-free time-varying-volatility GMM (Lewis 2021); check `weak_id` |\n| [identify_sv_svar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/sv_svar.jl) | `identify_sv_svar(Y, p; hetero, smoother=:ksc, maxiter=500, tol=1e-3, b_iter=5, gibbs_burn=5, gibbs_draws=100, init=:ols_chol, phi_init=0.9, s_init=0.2, theta_grid=12, c=1e-5, rng)` | EM-ML SV-SVAR with AR(1) log-volatilities (Bertsche & Braun 2022) |\n| [identify_markov_switching](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/heteroskedastic.jl) | `identify_markov_switching(model; n_regimes=2, max_iter=500, tol=1e-6, n_starts=5, rng)` | EM Markov-switching covariances with joint-ML `B0` (Lanne & Lutkepohl 2008) |\n| [identify_garch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/heteroskedastic.jl) | `identify_garch(model; max_iter=500, tol=1e-6)` | Iterative GARCH(1,1)-variance SVAR identification (Normandin & Phaneuf 2004) |\n| [identify_smooth_transition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/heteroskedastic.jl) | `identify_smooth_transition(model, transition_var; max_iter=500, tol=1e-6)` | Joint-ML logistic smooth-transition variances (Lutkepohl & Netsunajev 2017) |\n| [identify_external_volatility](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/heteroskedastic.jl) | `identify_external_volatility(model, regime_indicator; regimes=2)` | Sample-split identification on known regimes (Rigobon 2003) |\n| [label_shocks](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/identification.jl) | `label_shocks(result; by=:restrictions, restrictions, B_ref, variables, shock_names, sign_convention=:positive_diagonal)` | Signed-permutation shock labelling by restrictions, max impact, or reference |\n| [test_shock_gaussianity](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/tests.jl) | `test_shock_gaussianity(result)` | Joint Jarque-Bera Gaussianity test over recovered shocks |\n| [test_gaussian_shock_count](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/tests.jl) | `test_gaussian_shock_count(result; alpha=0.05)` | Sequential Holm-adjusted count; identification needs at most one Gaussian shock |\n| [test_gaussian_vs_nongaussian](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/tests.jl) | `test_gaussian_vs_nongaussian(model; distribution=:student_t)` | LR test of Gaussian vs non-Gaussian shocks |\n| [test_shock_independence](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/tests.jl) | `test_shock_independence(result; max_lag=10, seed, rng)` | Portmanteau plus distance-covariance independence test (Fisher combined) |\n| [test_label_stability](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/tests.jl) | `test_label_stability(model; method=:fastica, n_bootstrap=999, rng, transition_var, regime_indicator)` | Bootstrap column-match fraction for label stability (no p-value) |\n| [test_lambda_distinct](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/tests.jl) | `test_lambda_distinct(result; pairs=:all)` | Distinct variance-ratio check for heteroskedastic identification |\n| [ICASVARResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ica.jl) | `struct ICASVARResult{T} <: AbstractNonGaussianSVAR` | ICA fit: `B0`, `W`, `Q`, shocks, convergence, method-specific objective |\n| [NonGaussianMLResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/ml.jl) | `struct NonGaussianMLResult{T} <: AbstractNonGaussianSVAR` | ML fit: `B0`, `Q`, logliks, `dist_params`, `se`, AIC/BIC |\n| [NonGaussianGMMResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/gmm.jl) | `struct NonGaussianGMMResult{T} <: AbstractNonGaussianSVAR` | GMM fit: `B0`, Givens `theta`, sandwich vcov, Hansen `J` |\n| [LewisTVVResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/lewis_tvv.jl) | `struct LewisTVVResult{T} <: AbstractNonGaussianSVAR` | TVV-GMM fit with `weak_id` identification flag |\n| [SVSVARResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/sv_svar.jl) | `struct SVSVARResult{T} <: AbstractNonGaussianSVAR` | SV-SVAR EM fit: rotation, VAR slopes, SV params, smoothed variances |\n| [MarkovSwitchingSVARResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/heteroskedastic.jl) | `struct MarkovSwitchingSVARResult{T} <: AbstractNonGaussianSVAR` | Regime covariances, transition matrix, `Lambda` variance ratios |\n| [GARCHSVARResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/heteroskedastic.jl) | `struct GARCHSVARResult{T} <: AbstractNonGaussianSVAR` | GARCH-variance fit: per-shock GARCH params and conditional variances |\n| [SmoothTransitionSVARResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/heteroskedastic.jl) | `struct SmoothTransitionSVARResult{T} <: AbstractNonGaussianSVAR` | Logistic-transition fit: `gamma`, threshold, pole covariances |\n| [ExternalVolatilitySVARResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/heteroskedastic.jl) | `struct ExternalVolatilitySVARResult{T} <: AbstractNonGaussianSVAR` | Known-regime fit: per-regime covariances and `Lambda` ratios |\n| [IdentifiabilityTestResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nongaussian/tests.jl) | `struct IdentifiabilityTestResult{T}` | Diagnostic verdict: statistic, p-value, `identified` flag, details |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nmodel = estimate_var(Y, 2)\nica = identify_fastica(model; rng=MersenneTwister(11))\nreport(ica)\nlabeled = label_shocks(ica; by=:max_impact, variables=1:3,\n                       shock_names=[\"output\", \"price\", \"mp\"])\nirfs = irf(model, 20; method=:fastica, rng=MersenneTwister(11))\nreport(irfs)\n```\n\n# See also\n\n* [Vector Autoregression](/multivariate/var.md) - reduced-form estimation feeding every `identify_*` method\n* [Local Projections](/multivariate/lp.md) - LP-IV external-instrument identification as an economic-restriction alternative\n* [Multivariate GARCH](/multivariate/mgarch.md) - conditional covariance modelling behind GARCH-based identification\n* [Vector Error Correction Models](/multivariate/vecm.md) - SVEC permanent/transitory identification for cointegrated systems", "multivariate/var": "# Summary\n\nThe `var` module implements the reduced-form VAR(p) of Sims (1980): OLS estimation equation-by-equation, information-criteria lag selection, stability checking via the companion matrix, multi-step forecasting with bootstrap or analytic intervals, and Waggoner-Zha conditional forecasts.\n`estimate_var` returns a `VARModel` holding the coefficient matrix `B = [c, A_1, ..., A_p]'`, residuals, and the ML residual covariance `Sigma`.\nStructural analysis (`irf`, `fevd`, `historical_decomposition`) consumes `VARModel` through the core innovation-accounting layer, and `to_var` converts VECM fits into this same type.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_var](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/estimation.jl) | `estimate_var(Y::AbstractMatrix, p::Int; check_stability=true, varnames=nothing)` | OLS estimation of reduced-form VAR(p); returns `VARModel` |\n| [estimate_var](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/estimation.jl) | `estimate_var(df::DataFrame, p::Int; vars=Symbol[], check_stability=true)` | DataFrame method selecting columns via `vars` |\n| [select_lag_order](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/estimation.jl) | `select_lag_order(Y::AbstractMatrix, max_p::Int; criterion=:bic)` | Lag choice via `:aic`, `:bic`, or `:hqic` on a common sample |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/estimation.jl) | `forecast(model::VARModel, h::Int; ci_method=:bootstrap, reps=500, conf_level=0.95, stationary_only=false, rng)` | Multi-step point forecast with `:none`, `:bootstrap`, or `:analytic` intervals |\n| [conditional_forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/conditional_forecast.jl) | `conditional_forecast(model::VARModel, conditions, h::Int; Q=nothing, reps=1000, conf_level=0.95, seed=nothing, rng)` | Waggoner-Zha conditional forecast under hard/soft path constraints |\n| [conditional_forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/conditional_forecast.jl) | `conditional_forecast(post::BVARPosterior, conditions, h::Int; ...)` | Conditional forecast integrating over the BVAR posterior |\n| [forecast_condition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/conditional_forecast.jl) | `forecast_condition(variable, horizon, value; sd=0.0)` | Build one path constraint (`sd=0` hard, `sd>0` soft) |\n| [effective_nobs](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/types.jl) | `effective_nobs(model::VARModel)` | Effective sample size `T - p` |\n| [vcov](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/estimation.jl) | `StatsAPI.vcov(model::VARModel)` | Dof-corrected coefficient covariance |\n| [predict](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/estimation.jl) | `StatsAPI.predict(model::VARModel, steps::Int)` | Iterated multi-step point forecast path |\n| [r2](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/estimation.jl) | `StatsAPI.r2(model::VARModel)` | Per-equation R-squared |\n| [loglikelihood](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/estimation.jl) | `StatsAPI.loglikelihood(model::VARModel)` | Gaussian log-likelihood |\n| [confint](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/estimation.jl) | `StatsAPI.confint(model::VARModel; level=0.95)` | Coefficient confidence intervals |\n| [is_stationary](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/stationarity.jl) | `is_stationary(model::VARModel)` | Stability verdict from companion eigenvalues |\n| [companion_matrix](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/core/utils.jl) | `companion_matrix(B::AbstractMatrix, n::Int, p::Int)` | `np x np` companion form of the VAR |\n| [VARModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/types.jl) | `struct VARModel{T} <: AbstractVARModel` | Fitted VAR: `Y`, `p`, `B`, `U`, `Sigma`, criteria, `varnames` |\n| [VARForecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/types.jl) | `struct VARForecast{T} <: AbstractForecastResult{T}` | Forecast path with interval bounds |\n| [ForecastCondition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/conditional_forecast.jl) | `struct ForecastCondition` | Single variable/horizon/value constraint |\n| [ConditionalForecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/var/conditional_forecast.jl) | `struct ConditionalForecast{T}` | Constrained forecast path result |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nmodel = estimate_var(Y, 4; varnames=[\"INDPRO\", \"CPI\", \"FFR\"])\nreport(model)\np = select_lag_order(Y, 4; criterion=:bic)\nresult = irf(model, 20; method=:cholesky, ci_type=:bootstrap, reps=50)\nreport(result)\n```\n\n# See also\n\n* [Bayesian VAR](/multivariate/bvar.md) - shrinkage estimation of the same VAR dynamics\n* [Vector Error Correction Models](/multivariate/vecm.md) - cointegrated I(1) systems\n* [Local Projections](/multivariate/lp.md) - horizon-by-horizon alternative to VAR-based IRFs\n* [Factor Models](/multivariate/factor.md) - large-panel dimension reduction feeding VARs\n* [Factor-Augmented VAR](/multivariate/favar.md) - VARs augmented with latent factors", "multivariate/vecm": "# Summary\n\nThe `vecm` module estimates Vector Error Correction Models for cointegrated I(1) systems, separating long-run equilibrium (`alpha * beta'`) from short-run dynamics (`Gamma`).\n`estimate_vecm` defaults to Johansen (1991) reduced-rank MLE with automatic trace-test rank selection, and offers Engle-Granger two-step for bivariate rank-1 systems.\n`to_var` converts the fit to a VAR in levels so all structural identification schemes apply; `irf`, `fevd`, and `historical_decomposition` accept `VECMModel` directly via that conversion.\nRestriction tests on `alpha`/`beta` (including weak exogeneity), SVEC permanent/transitory identification, bootstrap forecasting, and short/long/strong Granger causality complete the toolkit.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_vecm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/estimation.jl) | `estimate_vecm(Y, p; rank=:auto, deterministic=:constant, method=:johansen, significance=0.05, varnames)` | Johansen MLE or Engle-Granger VECM estimation; returns `VECMModel` |\n| [select_vecm_rank](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/estimation.jl) | `select_vecm_rank(Y, p; criterion=:trace, significance=0.05, deterministic=:constant)` | Cointegrating rank via `:trace` or `:max_eigen` test |\n| [to_var](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/estimation.jl) | `to_var(vecm::VECMModel)` | Convert VECM to VAR in levels for structural analysis |\n| [cointegrating_rank](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/types.jl) | `cointegrating_rank(m::VECMModel)` | Fitted cointegrating rank `r` |\n| [effective_nobs](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/types.jl) | `effective_nobs(m::VECMModel)` | Effective sample size from residual rows |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/forecast.jl) | `forecast(vecm::VECMModel, h::Int; ci_method=:none, reps=500, conf_level=0.95, rng)` | Level iteration preserving cointegration; `:bootstrap`/`:simulation` CIs |\n| [granger_causality_vecm](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/granger.jl) | `granger_causality_vecm(vecm::VECMModel, cause::Int, effect::Int)` | Short-run, long-run, and strong Wald causality tests |\n| [irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/analysis.jl) | `irf(vecm::VECMModel, horizon::Int; method=:cholesky, kwargs...)` | Impulse responses via automatic `to_var` conversion |\n| [fevd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/analysis.jl) | `fevd(vecm::VECMModel, horizon::Int; method=:cholesky, kwargs...)` | Variance decomposition via automatic `to_var` conversion |\n| [historical_decomposition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/analysis.jl) | `historical_decomposition(vecm::VECMModel, horizon=effective_nobs(vecm); ...)` | Historical decomposition via automatic `to_var` conversion |\n| [test_beta_restriction](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/analysis.jl) | `test_beta_restriction(m::VECMModel, H::AbstractMatrix)` | LR test of `beta = H*phi` (same restriction, every vector) |\n| [test_alpha_restriction](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/analysis.jl) | `test_alpha_restriction(m::VECMModel, A::AbstractMatrix)` | LR test of `alpha = A*psi` |\n| [test_weak_exogeneity](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/analysis.jl) | `test_weak_exogeneity(m::VECMModel, vars)` | LR test of zero `alpha` rows for named variables |\n| [test_known_beta](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/analysis.jl) | `test_known_beta(m::VECMModel, b::AbstractMatrix)` | LR test of fully specified `beta = b` |\n| [test_joint_restriction](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/analysis.jl) | `test_joint_restriction(m::VECMModel, H::AbstractMatrix, A::AbstractMatrix; ...)` | Joint LR test on `alpha` and `beta` via switching algorithm |\n| [identify_svec](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/svec.jl) | `identify_svec(vecm::VECMModel; long_run_zeros=nothing, short_run_zeros=nothing, pattern=nothing, n_starts=5, max_iter=400, rng)` | King-Plosser-Stock-Watson permanent/transitory SVEC identification |\n| [permanent_transitory](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/svec.jl) | `permanent_transitory(vecm::VECMModel; method=:gonzalo_ng)` | Gonzalo-Ng or KPSW permanent/transitory decomposition |\n| [dof](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/estimation.jl) | `StatsAPI.dof(m::VECMModel)` | Model degrees of freedom |\n| [predict](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/estimation.jl) | `StatsAPI.predict(m::VECMModel)` | Fitted values in levels |\n| [VECMModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/types.jl) | `struct VECMModel{T}` | Fitted VECM: `alpha`, `beta`, `Pi`, `Gamma`, `Sigma`, criteria |\n| [VECMForecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/types.jl) | `struct VECMForecast{T}` | Level/difference forecasts with CI bounds |\n| [VECMGrangerResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/types.jl) | `struct VECMGrangerResult{T}` | Short-run, long-run, and strong Wald statistics |\n| [VECMRestrictionTest](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/vecm/types.jl) | `struct VECMRestrictionTest{T}` | LR statistic plus re-estimated `restricted_model` |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nvecm = estimate_vecm(Y, 2; rank=1)\nreport(vecm)\nirfs = irf(vecm, 20; method=:cholesky)\nfc = forecast(vecm, 10; ci_method=:bootstrap, reps=50, conf_level=0.95)\ng = granger_causality_vecm(vecm, 1, 2)\nreport(g)\n```\n\n# See also\n\n* [Vector Autoregression](/multivariate/var.md) - stationary systems and the `to_var` target type\n* [Bayesian VAR](/multivariate/bvar.md) - shrinkage estimation of VAR dynamics\n* [Local Projections](/multivariate/lp.md) - direct impulse-response estimation without cointegration structure\n* [Factor Models](/multivariate/factor.md) - large-panel dimension reduction", "nonlinear-statespace/nonlinear": "# Summary\n\nThe `nonlinear` module fits regime-switching dynamics in the conditional mean: two-regime threshold least squares and self-exciting threshold autoregression (SETAR) with Hansen (1996) linearity tests and Hansen (2000) threshold confidence intervals, smooth-transition autoregression (STAR) with LSTR1/LSTR2/ESTR transitions and Ter\u00e4svirta transition selection, and Markov-switching regression plus Hamilton (1989) mean-switching MS-AR estimated via the Hamilton filter, Kim smoother, and EM with ML polish. All fits integrate with `report`, `refs`, `forecast`, and `plot_result`.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_threshold](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/threshold.jl) | `estimate_threshold(y, X, q; trim=0.15, linearity=true, reps=1000, ci_level=0.95, het=false, rng)` | Two-regime threshold regression by grid search over order statistics of `q`; returns `ThresholdModel` |\n| [estimate_setar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/threshold.jl) | `estimate_setar(y, p, d=1; trim, linearity, reps, ci_level, het, seed, rng)` | Self-exciting threshold AR with delay `d` (Int, range, or `:auto`); returns `ThresholdModel` |\n| [hansen_linearity_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/threshold.jl) | `hansen_linearity_test(y, X, q; trim=0.15, reps=1000, seed, rng)` | Hansen (1996) sup-LM/sup-Wald test with fixed-regressor bootstrap p-values |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/threshold.jl) | `forecast(m::ThresholdModel, h; reps=1000, level=0.90, seed, rng)` | Bootstrap-simulation SETAR forecast with percentile bands (SETAR fits only) |\n| [estimate_star](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/star.jl) | `estimate_star(y, p; s=nothing, d=1, type=:auto, n_gamma=15, n_c=15)` | STAR by NLS with grid starts and L-BFGS; `:auto` runs Ter\u00e4svirta selection |\n| [star_linearity_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/star.jl) | `star_linearity_test(y, p; s=nothing, d=1)` | Luukkonen\u2013Saikkonen\u2013Ter\u00e4svirta LM3 linearity test (chi-square and F forms) |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/star.jl) | `forecast(m::STARModel, h; reps=1000, level=0.90, seed, rng)` | Bootstrap-simulation forecast of a self-exciting STAR model |\n| [estimate_ms](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/markov_switching.jl) | `estimate_ms(y, X; k_regimes=2, switching_variance=true, max_iter=500, tol=1e-8, xnames)` | Markov-switching regression via EM plus ML polish; intercept-only call available |\n| [estimate_ms_ar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/markov_switching.jl) | `estimate_ms_ar(y, p; k_regimes=2, switching_variance=false, max_iter=1000, yname=\"y\")` | Hamilton (1989) mean-switching MS-AR(p) on the K^(p+1) expanded state space |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/markov_switching.jl) | `forecast(m::MSRegModel, h; reps=1000, level=0.90, seed, rng)` | Exact analytic mean forecast for `:ms_ar` with simulated bands |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/markov_switching.jl) | `forecast(m::MSRegModel, X_new; reps=1000, level=0.90, seed, rng)` | Forecast for `:regression` models given future regressors `X_new` |\n| [predict](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/types.jl) | `predict(m::MSRegModel; probs=:smoothed)` | Regime-weighted conditional mean under smoothed or `:filtered` probabilities |\n| [ThresholdModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/types.jl) | `ThresholdModel` (struct) | Fit object: threshold, regime coefficients, CI, attached linearity test |\n| [STARModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/types.jl) | `STARModel` (struct) | Fit object: regime coefficients, transition slope/location, LM3 stats |\n| [MSRegModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/types.jl) | `MSRegModel` (struct) | Fit object: regime means, transition matrix, filtered/smoothed probabilities |\n| [HansenLinearityTest](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonlinear/types.jl) | `HansenLinearityTest` (struct) | sup-LM/sup-Wald statistics with bootstrap p-values and `gamma_sup` |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\n\n# SETAR(2; 1, 1): AR(1) in each regime, threshold on y[t-1]\nm = estimate_setar(y, 1, 1)\nreport(m)\n\n# Test linearity first: Hansen (1996) sup-LM/sup-Wald, bootstrap p-values\nX = hcat(ones(length(y) - 1), y[1:end-1])\nlt = hansen_linearity_test(y[2:end], X, y[1:end-1]; reps=500)\n\n# Bootstrap-simulation forecast with 90% bands\nf = forecast(m, 8; reps=1000)\n```\n\n# See also\n\n- /nonlinear-statespace/statespace.md\n- /univariate/arima.md\n- /multivariate/var.md\n- /testing/tests.md", "nonlinear-statespace/statespace": "# Summary\n\nThe `statespace` module provides a general single-block linear-Gaussian state-space object with prediction-error-decomposition MLE of its hyper-parameters, Kalman filtering and RTS smoothing through the shared kernel, multi-step forecasting with predictive variances, and convenience wrappers for the local-level model, the local-linear-trend model, and time-varying-parameter (TVP) regression with a random-walk coefficient path.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [StateSpaceModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/statespace/types.jl) | `StateSpaceModel(Z, H, T, Q; d, c, R, a1, P1, init_mode=:kappa, kappa=1e6)` | Unfitted spec from fixed system matrices; `a1`/`P1` must be supplied together |\n| [StateSpaceModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/statespace/types.jl) | `StateSpaceModel(build, \u03b80; init_mode=:kappa, kappa=1e6, param_names)` | Unfitted parametric spec carrying a `build(\u03b8)` closure for MLE |\n| [estimate_statespace](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/statespace/estimation.jl) | `estimate_statespace(build, \u03b80, y; init_mode, kappa, param_names, theta_transform, display_names, iterations, g_tol)` | L-BFGS MLE of a builder-defined system plus filtering and smoothing |\n| [estimate_statespace](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/statespace/estimation.jl) | `estimate_statespace(ss::StateSpaceModel, y)` | Filter and smooth a fixed-matrix spec without optimization |\n| [local_level](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/statespace/estimation.jl) | `local_level(y; init_mode=:kappa, kappa=1e6)` | Random-walk-plus-noise MLE; reports \u03c3\u00b2_\u03b5 and \u03c3\u00b2_\u03b7 |\n| [local_linear_trend](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/statespace/estimation.jl) | `local_linear_trend(y; init_mode=:kappa, kappa=1e6)` | Stochastic level-plus-slope MLE; reports \u03c3\u00b2_\u03b5, \u03c3\u00b2_\u03be, \u03c3\u00b2_\u03b6 |\n| [estimate_tvp_reg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/statespace/estimation.jl) | `estimate_tvp_reg(y, X; intercept=true, init_mode=:kappa, kappa=1e6, iterations, g_tol)` | Random-walk-coefficient regression; smoothed coefficient paths in `smoothed_state` |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/statespace/api.jl) | `forecast(ss::StateSpaceModel, h::Integer)` | h-step forecast via the state recursion with predictive covariances |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\n\n# Local-level (random walk + noise) on the Nile series\nnile = load_example(:nile)\nm = local_level(nile)\nreport(m)\n\n# Five-step forecast with predictive standard errors\nfc = forecast(m, 5)\n[fc.mean fc.se]\n```\n\n# See also\n\n- /nonlinear-statespace/nonlinear.md\n- /univariate/arima.md\n- /forecasting/forecasting.md\n- /multivariate/var.md", "nonparametric/nonparametric": "# Summary\n\nThe `nonparametric` module estimates distributions and conditional means without imposing a parametric form.\n`kernel_density` reconstructs a sample's shape with Gaussian, Epanechnikov, triangular, or uniform kernels and Silverman (`bw.nrd0`) or Sheather-Jones plug-in (`bw.SJ`) bandwidths; `kernel_reg` fits the Nadaraya-Watson local-constant, Fan-Gijbels local-linear (with automatic boundary-bias correction), or arbitrary-degree local-polynomial estimator with leave-one-out cross-validated bandwidths and sandwich pointwise standard-error bands; `lowess` is Cleveland's robust tricube-weighted scatterplot smoother with bisquare robustifying passes, ported to match R's `stats::lowess` to machine precision.\nResults return `KernelDensity`, `KernelRegression`, and `LowessFit` objects integrating with `report`, `refs`, and `plot_result`.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [kernel_density](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonparametric/density.jl) | `kernel_density(y; kernel=:gaussian, bw=:silverman, npoints=512, cut=3.0)` | Kernel density estimate with rule-of-thumb, plug-in, or user bandwidth |\n| [kernel_reg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonparametric/kernel_reg.jl) | `kernel_reg(y, x; method=:ll, degree=1, bw=:cv, kernel=:gaussian)` | Local-constant, local-linear, or local-polynomial regression with CV bandwidth and SE bands |\n| [lowess](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonparametric/lowess.jl) | `lowess(y, x; f=2//3, iter=3, delta=nothing)` | Robust LOWESS smoother with span `f` and bisquare robustifying passes |\n| [KernelDensity](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonparametric/types.jl) | `struct KernelDensity{T}` | Density grid, bandwidth, kernel, method, data, and observation count |\n| [KernelRegression](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonparametric/types.jl) | `struct KernelRegression{T}` | Sorted fit, standard errors, bandwidth, method, residual variance |\n| [LowessFit](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/nonparametric/types.jl) | `struct LowessFit{T}` | Sorted smoothed values, span, iterations, and observation count |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nkd = kernel_density(z)                        # Gaussian kernel, Silverman bandwidth\nkr = kernel_reg(y, x; method=:ll, bw=:cv)     # local-linear, CV bandwidth\nlf = lowess(y, x; f=0.3, iter=3)              # robust LOWESS smoother\nreport(kr)\n```\n\n# See also\n\n* [Linear Regression](/cross-section/index.md) - parametric conditional means\n* [Nonlinear Time Series](/nonlinear-statespace/nonlinear.md) - parametric transition-function time-series models\n* [Input-Output Analysis (IO)](/io/io.md) - structural sectoral estimation\n* [Policy Counterfactuals](/policy-counterfactuals/counterfactual.md) - model-based policy projections", "overview": "# Summary\n\nMacroEconometricModels.jl is a comprehensive Julia package for\nmacroeconometric research and analysis. It covers univariate time-series\nmodels, nonlinear and state-space models, multivariate time series, panel\nmethods, DSGE (including heterogeneous-agent, continuous-time, and OLG\nvariants), input-output analysis, policy counterfactuals,\ncross-sectional and nonparametric methods, forecasting, and a broad\nsuite of specification and hypothesis tests.\n\n# Feature map\n\n| Domain | Contents |\n|---|---|\n| [Univariate](/univariate/) | ARIMA, ARCH/GARCH, stochastic volatility, filters, X-13, spectral analysis |\n| [Nonlinear & state-space](/nonlinear-statespace/) | Threshold/STAR/Markov-switching, state-space, TVP regression |\n| [Multivariate](/multivariate/) | VAR, VECM, BVAR, local projections, factor models, MGARCH |\n| [Panel](/panel/) | Panel VAR, panel regression/IV, panel ARDL, DiD, event studies |\n| [DSGE](/dsge/) | Model specification, solvers, estimation, HA/CT models, OLG |\n| [Input-output](/io/) | IO tables, multipliers, linkages, decomposition, production networks |\n| [Policy counterfactuals](/policy-counterfactuals/) | Rule counterfactuals, OPP, model banks, menus |\n| [Cross-section](/cross-section/) | OLS/IV, penalized/robust regression, LDV, discrete choice |\n| [Nonparametric](/nonparametric/) | KDE, kernel/local-polynomial regression, LOWESS |\n| [Forecasting](/forecasting/) | Forecasting, forecast evaluation/combination, nowcasting |\n| [Testing](/testing/) | Unit-root, cointegration, break, and diagnostic tests |\n| [Infrastructure](/infrastructure/) | Core utilities, data, DGP simulation, GMM, plotting |\n\n# Usage\n\nInstall from the Julia package registry (per the upstream README):\n\n```julia\nusing Pkg\nPkg.add(\"MacroEconometricModels\")\n```\n\nThen pick a domain from the feature map above and open its concept for\nthe estimators, function tables, and worked examples.", "panel/ardl": "# Summary\n\nThe `ardl` module estimates autoregressive distributed-lag models by OLS for mixed `I(0)`/`I(1)` cointegration analysis.\n`estimate_ardl` fits ARDL(p, q) with fixed or AIC/BIC grid-searched lag orders and PSS deterministic cases I-V; `long_run` recovers the long-run multipliers `theta` with analytic delta-method SEs, and `ecm_form` gives the conditional error-correction re-parameterization with speed of adjustment `alpha`.\n`bounds_test` implements the Pesaran-Shin-Smith bounds test, reporting the non-standard `F`-statistic on the level block and the `t`-statistic on the lagged dependent level against tabulated `I(0)`/`I(1)` bounds (no p-values).\n`estimate_nardl` splits regressors into positive/negative partial sums for asymmetric cointegration (Shin-Yu-Greenwood-Nimmo), with `symmetry_test` (long- and short-run Wald tests) and `dynamic_multipliers` with bootstrap bands.\n`estimate_pmg` fits dynamic heterogeneous panels via Pooled Mean Group, Mean Group, and Dynamic Fixed Effects, with a `hausman_test` for long-run homogeneity.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_ardl](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/estimation.jl) | `estimate_ardl(y::AbstractVector, X::AbstractMatrix; p=:auto, q=:auto, max_p=4, max_q=4, ic=:aic, case=3, trend=:none, xnames=nothing, yname=\"y\")` | OLS ARDL(p,q) with optional IC lag selection |\n| [long_run](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/estimation.jl) | `long_run(m::ARDLModel)` | Long-run multipliers with delta-method SEs |\n| [long_run](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/nardl.jl) | `long_run(m::NARDLModel)` | Long-run multipliers for the partial-sum design |\n| [ecm_form](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/estimation.jl) | `ecm_form(m::ARDLModel)` | Conditional EC form: speed of adjustment and levels term |\n| [bounds_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/bounds.jl) | `bounds_test(m::ARDLModel; case=m.case, level=0.05, cv_source=:pss)` | PSS bounds F/t test for a level relationship |\n| [estimate_nardl](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/nardl.jl) | `estimate_nardl(y::AbstractVector, X::AbstractMatrix; asymmetric=:all, p=:auto, q=:auto, max_p=4, max_q=4, ic=:aic, case=3, ...)` | Asymmetric ARDL on positive/negative partial sums |\n| [symmetry_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/nardl.jl) | `symmetry_test(m::NARDLModel)` | Per-regressor long-run and short-run symmetry Wald tests |\n| [dynamic_multipliers](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/nardl.jl) | `dynamic_multipliers(m::NARDLModel, H::Int; bootstrap=true, nreps=500, level=0.95, seed=nothing, rng)` | Cumulative dynamic multipliers with bootstrap bands |\n| [estimate_pmg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/pmg.jl) | `estimate_pmg(pd::PanelData, y::Symbol, xs::Symbol...; p=1, q=1, method=:pmg, trend=:constant, maxiter=100, tol=1e-8)` | Panel ARDL: `:pmg`, `:mg`, or `:dfe` |\n| [estimate_pmg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/pmg.jl) | `estimate_pmg(y::AbstractVector, X::AbstractMatrix, id, time; xnames=nothing, yname=\"y\", kwargs...)` | Panel ARDL from raw vectors (builds `PanelData` internally) |\n| [hausman_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/pmg.jl) | `hausman_test(efficient::PMGModel, consistent::PMGModel)` | PMG vs MG test of long-run homogeneity |\n| [ARDLModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/types.jl) | `struct ARDLModel{T}` | Fitted ARDL: OLS block, lag bookkeeping, cached long-run |\n| [ARDLLongRun](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/types.jl) | `struct ARDLLongRun{T}` | Long-run multipliers, SEs, denominator |\n| [ARDLBoundsTest](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/types.jl) | `struct ARDLBoundsTest{T}` | Bounds F/t statistics, CV tables, decisions |\n| [NARDLModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/types.jl) | `struct NARDLModel{T}` | Fitted NARDL wrapping the enlarged ARDL design |\n| [NARDLSymmetryTest](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/types.jl) | `struct NARDLSymmetryTest{T}` | Long- and short-run symmetry Wald statistics |\n| [NARDLMultipliers](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/types.jl) | `struct NARDLMultipliers{T}` | Cumulative multipliers with bootstrap bands |\n| [PMGModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/ardl/types.jl) | `struct PMGModel{T}` | Panel ARDL fit: common/unit long-run, speeds of adjustment |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nm = estimate_ardl(y, x; p=1, q=1, case=3)\nreport(m)\nlr = long_run(m)          # theta with delta-method SEs\nbt = bounds_test(m; level=0.05)\nreport(bt)\nnm = estimate_nardl(y, x; asymmetric=:all, p=1, q=1, case=3)\nst = symmetry_test(nm)\n```\n\n# See also\n\n* [Panel Regression](/panel/preg.md) - static and dynamic linear panel estimators\n* [Panel VAR](/panel/pvar.md) - multivariate dynamic panels\n* [Difference-in-Differences](/panel/did.md) - treatment-effect designs on panels\n* [Cointegrating Regression](/multivariate/cointreg.md) - FMOLS/CCR/DOLS single-equation cointegration\n* [Vector Error Correction Models](/multivariate/vecm.md) - system cointegration with multiple vectors", "panel/did": "# Summary\n\nThe `did` module covers static and event-time treatment effects under staggered adoption, plus the local-projection formulation of the same designs.\n`estimate_did` dispatches on `method`: traditional TWFE event-study regression plus four heterogeneity-robust estimators \u2014 Callaway-Sant'Anna group-time ATTs (with `:never_treated`/`:not_yet_treated` controls and `:varying`/`:universal` base periods), the Sun-Abraham interaction-weighted estimator, the Borusyak-Jaravel-Spiess imputation estimator, and the de Chaisemartin-D'Haultfoeuille first-difference estimator with block-bootstrap SEs.\nDiagnostics include the Goodman-Bacon 2x2 decomposition, a joint pre-trend Wald test, the dCDH negative-weight check, and Rambachan-Roth HonestDiD sensitivity analysis under relative-magnitude or smoothness restrictions.\n`estimate_event_study_lp` and `estimate_lp_did` run horizon-by-horizon local projections on long-differenced outcomes with a switching-indicator treatment; LP-DiD adds clean-control-sample rules (absorbing/non-absorbing/one-off), pre-mean differencing, IPW reweighting, and pooled estimates, matching Stata `lpdid`.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_did](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/estimation.jl) | `estimate_did(pd::PanelData, outcome, treatment; method=:twfe, leads=0, horizon=5, control_group=:never_treated, cluster=:unit, base_period=:varying, n_boot=200, ...)` | TWFE / Callaway-Sant'Anna / Sun-Abraham / BJS / dCDH event-study ATTs |\n| [estimate_event_study_lp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/event_study.jl) | `estimate_event_study_lp(pd::PanelData, outcome, treatment, H::Int; leads=3, lags=4, covariates=String[], cluster=:unit, conf_level=0.95)` | Horizon-by-horizon LP event study with switching indicator |\n| [estimate_lp_did](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/lpdid.jl) | `estimate_lp_did(pd::PanelData, outcome, treatment, H::Int; pre_window=3, ylags=0, dylags=0, nonabsorbing=nothing, oneoff=false, pmd=nothing, reweight=false, ...)` | LP-DiD with clean control samples, PMD, IPW, pooled estimates |\n| [bacon_decomposition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/diagnostics.jl) | `bacon_decomposition(pd::PanelData, outcome, treatment)` | Goodman-Bacon 2x2 decomposition of static TWFE |\n| [pretrend_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/diagnostics.jl) | `pretrend_test(result::DIDResult)` | Joint Wald test of pre-treatment coefficients |\n| [pretrend_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/diagnostics.jl) | `pretrend_test(result::EventStudyLP)` | Pre-trend Wald test for LP event-study results |\n| [negative_weight_check](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/diagnostics.jl) | `negative_weight_check(pd::PanelData, treatment)` | dCDH check for negative TWFE weights on ATT cells |\n| [honest_did](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/honest_did.jl) | `honest_did(result::Union{DIDResult, EventStudyLP}; restriction=:rm, Mbar=1.0, M=0.0, conf_level=0.95)` | Rambachan-Roth robust CIs and breakdown values |\n| [honest_did](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/honest_did.jl) | `honest_did(betahat::AbstractVector, sigma::AbstractMatrix; num_pre, num_post, restriction=:rm, Mbar=1.0, M=0.0, l_vec=nothing, ...)` | Core HonestDiD on raw event-study coefficients + covariance |\n| [DIDResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/types.jl) | `struct DIDResult{T} <: AbstractFrequentistResult` | Event-time ATTs, group-time matrix, overall ATT, `att_vcov` |\n| [EventStudyLP](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/types.jl) | `struct EventStudyLP{T}` | Per-horizon LP coefficients, SEs, `T_eff` |\n| [LPDiDResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/types.jl) | `struct LPDiDResult{T}` | LP-DiD coefficients with pooled estimates and CCS spec |\n| [BaconDecomposition](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/types.jl) | `struct BaconDecomposition{T}` | 2x2 estimates, weights, comparison types |\n| [PretrendTestResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/types.jl) | `struct PretrendTestResult{T}` | Pre-trend Wald statistic, p-value, df |\n| [NegativeWeightResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/types.jl) | `struct NegativeWeightResult{T}` | TWFE weights with negative-weight flags |\n| [HonestDiDResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/did/types.jl) | `struct HonestDiDResult{T}` | Robust vs conventional CIs, breakdown value |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\npd = load_example(:mpdta)   # county minimum-wage panel; first_treat = adoption year\ndid_cs = estimate_did(pd, \"lemp\", \"first_treat\"; method=:callaway_santanna,\n                      leads=3, horizon=3, control_group=:never_treated)\nreport(did_cs)\npt = pretrend_test(did_cs)\nh = honest_did(did_cs; Mbar=1.0, conf_level=0.95)\nreport(h)\n```\n\n# See also\n\n* [Panel Regression](/panel/preg.md) - panel models identified from covariates\n* [Panel VAR](/panel/pvar.md) - multivariate dynamic panels\n* [ARDL & Panel ARDL](/panel/ardl.md) - single-equation dynamics and PMG/MG/DFE\n* [Local Projections](/multivariate/lp.md) - time-series LP impulse responses\n* [Panel Tests](/testing/teststat.md) - panel unit-root pretests", "panel/preg": "# Summary\n\nThe `preg` module follows Stata `xtreg`/`xtivreg`/`xtlogit`/`xtprobit` conventions.\n`estimate_xtreg` fits fixed effects, Swamy-Arora random effects, first-difference, between, Mundlak CRE, and the Arellano-Bond (`:ab`) / Blundell-Bond (`:bb`) dynamic-panel GMM estimators (with Windmeijer-corrected covariances and AR/Hansen diagnostics), plus two-way FE and arbitrary-dimension HDFE absorption by alternating projections (Guimaraes-Portugal/Correia), Prais-Winsten AR(1) FGLS, and five covariance estimators (`:ols`, `:cluster`, `:twoway`, `:driscoll_kraay`, `:pcse`).\n`estimate_xtiv` covers FE-IV, Baltagi EC2SLS RE-IV, FD-IV, and Hausman-Taylor with first-stage F, Cragg-Donald/Kleibergen-Paap weak-instrument statistics, and Sargan-Hansen J.\n`estimate_xtlogit` (pooled/FE-conditional/RE/CRE) and `estimate_xtprobit` (pooled/RE/CRE, no FE) cover panel discrete choice, with `marginal_effects` for average marginal effects.\nSix specification tests (Hausman, Breusch-Pagan LM, F-test for FE, Pesaran CD, Wooldridge AR, modified Wald) guide estimator choice.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_xtreg](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/estimation.jl) | `estimate_xtreg(pd::PanelData, depvar::Symbol, indepvars::Vector{Symbol}; model=:fe, twoway=false, absorb=Symbol[], cov_type=:cluster, ar1=:none, ...)` | Linear panel: `:fe`, `:re`, `:fd`, `:between`, `:cre`, `:ab`, `:bb` |\n| [estimate_xtiv](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/iv.jl) | `estimate_xtiv(pd::PanelData, depvar::Symbol, exog::Vector{Symbol}, endog::Vector{Symbol}; instruments=Symbol[], model=:fe, cov_type=:cluster, ...)` | Panel IV: `:fe`, `:re` (EC2SLS), `:fd`, `:hausman_taylor` |\n| [estimate_xtlogit](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/logit.jl) | `estimate_xtlogit(pd::PanelData, depvar::Symbol, indepvars::Vector{Symbol}; model=:pooled, cov_type=:cluster, maxiter=2000, tol=1e-8, n_quadrature=12)` | Panel logit: `:pooled`, `:fe` (conditional), `:re`, `:cre` |\n| [estimate_xtprobit](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/probit.jl) | `estimate_xtprobit(pd::PanelData, depvar::Symbol, indepvars::Vector{Symbol}; model=:pooled, cov_type=:cluster, maxiter=200, tol=1e-8, n_quadrature=12)` | Panel probit: `:pooled`, `:re`, `:cre` (no FE) |\n| [absorb_fe](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/hdfe.jl) | `absorb_fe(y::AbstractVector, X::AbstractMatrix, fe_groups; tol=1e-8, maxiter=1000, accel=true)` | Standalone HDFE residualization by alternating projections |\n| [marginal_effects](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/margins.jl) | `marginal_effects(m::Union{PanelLogitModel, PanelProbitModel}; conf_level=0.95, n_quadrature=12)` | Average marginal effects with delta-method SEs |\n| [hausman_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/tests.jl) | `hausman_test(fe::PanelRegModel, re::PanelRegModel)` | FE vs RE specification test (generalized inverse) |\n| [breusch_pagan_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/tests.jl) | `breusch_pagan_test(re::PanelRegModel)` | LM test for presence of random effects |\n| [f_test_fe](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/tests.jl) | `f_test_fe(fe::PanelRegModel)` | Joint significance of entity fixed effects |\n| [pesaran_cd_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/tests.jl) | `pesaran_cd_test(m::PanelRegModel)` | Cross-sectional dependence in residuals |\n| [wooldridge_ar_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/tests.jl) | `wooldridge_ar_test(fe::PanelRegModel)` | AR(1) serial correlation in differenced residuals |\n| [modified_wald_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/tests.jl) | `modified_wald_test(fe::PanelRegModel)` | Groupwise heteroskedasticity test |\n| [arellano_bond_ar_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/pvar_ar_test.jl) | `arellano_bond_ar_test(m::PanelRegModel; order=2)` | AR(m) test read off `:ab`/`:bb` dynamic diagnostics |\n| [PanelRegModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/types.jl) | `struct PanelRegModel{T} <: StatsAPI.RegressionModel` | Fitted linear panel model with R2s, variance components |\n| [PanelIVModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/types.jl) | `struct PanelIVModel{T} <: StatsAPI.RegressionModel` | Fitted panel IV model with first-stage/Sargan diagnostics |\n| [PanelLogitModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/types.jl) | `struct PanelLogitModel{T} <: StatsAPI.RegressionModel` | Fitted panel logit model |\n| [PanelProbitModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/types.jl) | `struct PanelProbitModel{T} <: StatsAPI.RegressionModel` | Fitted panel probit model |\n| [PanelTestResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/preg/types.jl) | `struct PanelTestResult{T} <: StatsAPI.HypothesisTest` | Specification-test result container |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\npd = xtset(df_pwt, :country, :year)\nm_fe = estimate_xtreg(pd, :lngdppc, [:hc, :lnk])\nm_re = estimate_xtreg(pd, :lngdppc, [:hc, :lnk]; model=:re)\nht = hausman_test(m_fe, m_re)\nreport(ht)\nm_final = estimate_xtreg(pd, :lngdppc, [:hc, :lnk];\n                         absorb=[:entity, :time], cov_type=:driscoll_kraay)\n```\n\n# See also\n\n* [Panel VAR](/panel/pvar.md) - multivariate dynamic panels with GMM\n* [Difference-in-Differences](/panel/did.md) - treatment-effect designs on panels\n* [ARDL & Panel ARDL](/panel/ardl.md) - dynamic heterogeneous panels (PMG/MG/DFE)\n* [Cross-Section Regression](/cross-section/reg.md) - non-panel OLS/IV/discrete choice\n* [Panel Tests](/testing/teststat.md) - panel unit-root and cointegration pretests", "panel/pvar": "# Summary\n\nThe `pvar` module estimates Panel VAR(p) models `y_it = mu_i + A_1 y_{i,t-1} + ... + A_p y_{i,t-p} + e_it` on `PanelData`.\n`estimate_pvar` removes the entity fixed effect by first-differencing (`:fd`) or forward orthogonal deviations (`:fod`, Arellano-Bover 1995) and estimates by GMM with lagged levels as instruments (Arellano-Bond 1991), optionally adding level equations instrumented by lagged differences (Blundell-Bond system GMM), with Windmeijer-corrected two-step standard errors.\n`estimate_pvar_feols` is the within (demeaning) OLS alternative with group-clustered standard errors, consistent for large `T` but subject to Nickell bias when `T` is small.\nStructural analysis covers Cholesky orthogonalized IRFs, order-free generalized IRFs (Pesaran-Shin 1998), FEVD, companion-matrix stability checks, and a group-level block bootstrap for IRF confidence bands.\nSpecification testing covers the Hansen J-test, Andrews-Lu MMSC, and MMSC-based lag selection (implemented in `src/teststat`).\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_pvar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/estimation.jl) | `estimate_pvar(d::PanelData, p::Int; dependent_vars, predet_vars, exog_vars, transformation=:fd, steps=:twostep, system_instruments=false, collapse=false, min_lag_endo=2, max_lag_endo=99, ...)` | FD or system GMM estimation of Panel VAR(p); returns `PVARModel` |\n| [estimate_pvar_feols](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/estimation.jl) | `estimate_pvar_feols(d::PanelData, p::Int; dependent_vars, predet_vars, exog_vars)` | Within (FE-OLS) estimator with cluster-robust SEs |\n| [pvar_oirf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/analysis.jl) | `pvar_oirf(model::PVARModel, H::Int)` | Cholesky orthogonalized IRFs, `(H+1) x m x m` |\n| [pvar_girf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/analysis.jl) | `pvar_girf(model::PVARModel, H::Int)` | Generalized (ordering-free) IRFs |\n| [pvar_fevd](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/analysis.jl) | `pvar_fevd(model::PVARModel, H::Int)` | Forecast error variance decomposition |\n| [pvar_stability](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/analysis.jl) | `pvar_stability(model::PVARModel)` | Companion eigenvalues/moduli and stability verdict |\n| [pvar_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/analysis.jl) | `pvar_irf(model::PVARModel, H::Int; irf_type=:oirf, ci=nothing)` | Name-carrying IRF wrapper for plotting |\n| [pvar_fevd_result](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/analysis.jl) | `pvar_fevd_result(model::PVARModel, H::Int)` | Name-carrying FEVD wrapper for plotting |\n| [pvar_bootstrap_irf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/bootstrap.jl) | `pvar_bootstrap_irf(model::PVARModel, H::Int; irf_type=:oirf, n_draws=500, ci=0.95, rng)` | Group-level block bootstrap IRFs with quantile CIs |\n| [pvar_hansen_j](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/pvar_hansen_j.jl) | `pvar_hansen_j(model::PVARModel)` | Hansen J-test of overidentifying restrictions |\n| [pvar_mmsc](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/pvar_mmsc.jl) | `pvar_mmsc(model::PVARModel; hq_criterion=2.1)` | Andrews-Lu MMSC (BIC/AIC/HQIC) for a fitted model |\n| [pvar_lag_selection](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/pvar_lag_selection.jl) | `pvar_lag_selection(d::PanelData, max_p::Int; dependent_vars, kwargs...)` | MMSC comparison across lag orders with best-lag picks |\n| [PVARModel](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/types.jl) | `struct PVARModel{T} <: StatsAPI.RegressionModel` | Fitted PVAR: `Phi`, `Sigma`, `se`, instruments, diagnostics |\n| [PVARStability](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/types.jl) | `struct PVARStability` | Eigenvalues, moduli, `is_stable` |\n| [PVARTestResult](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/pvar/types.jl) | `struct PVARTestResult` | J/MMSC test result container |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\npd = apply_tcode(load_example(:pwt), 5)   # growth rates for stationarity\ndep_vars = [\"rgdpna\", \"emp\", \"hc\"]\nmodel = estimate_pvar(pd, 1; dependent_vars=dep_vars, steps=:twostep,\n                      collapse=true, max_lag_endo=6)\nreport(model)\nj = pvar_hansen_j(model)                  # instrument validity\nirfs = pvar_oirf(model, 10)               # (H+1) x m x m, [horizon, response, shock]\ndecomp = pvar_fevd(model, 10)\n```\n\n# See also\n\n* [Panel Regression](/panel/preg.md) - single-equation FE/RE/IV and Arellano-Bond estimators\n* [Difference-in-Differences](/panel/did.md) - treatment-effect designs on panels\n* [ARDL & Panel ARDL](/panel/ardl.md) - single-equation dynamics and PMG/MG/DFE\n* [Vector Autoregression](/multivariate/var.md) - time-series VAR without the panel dimension\n* [Panel Tests](/testing/teststat.md) - panel unit-root pretests before PVAR estimation", "policy-counterfactuals/counterfactual": "# Summary\n\nThe `counterfactual` module answers \"what would the economy have looked like under a different policy?\" with the sufficient-statistics approach of McKay-Wolf (2023), Barnichon-Mesters (2023), and Caravello-McKay-Wolf (2025).\nAll three strands reduce to one weighted projection over a policy-shock vector, with the load-bearing input a `PolicyCausalEffects` container whose columns are impulse responses to identified policy shocks.\nMcKay-Wolf builds Lucas-robust rule counterfactuals and loss-minimizing optimal policy from a baseline plus a news menu; Barnichon-Mesters tests announced-policy optimality with the OPP statistic and constrained recommendations; Caravello-McKay-Wolf disciplines model-implied menus with limited-information IRF matching, model averaging, and historical counterfactuals.\nHonesty diagnostics (`rel_residual`, `spanning_diagnostic`, `forecast_sufficiency`) quantify enforceability wherever identified shocks fall short of the desired policy change.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [rate_peg_rule](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/rules.jl) | `rate_peg_rule(H::Int; outcomes=[:infl, :ygap], instruments=[:rate])` | Counterfactual instrument-peg rule template (`z = 0`) |\n| [rate_target_rule](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/rules.jl) | `rate_target_rule(H::Int, path; outcomes, instruments)` | Arbitrary instrument-path rule template |\n| [inflation_target_rule](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/rules.jl) | `inflation_target_rule(H::Int; pi_var=:infl, outcomes, instruments)` | Strict inflation-targeting rule template |\n| [output_gap_rule](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/rules.jl) | `output_gap_rule(H::Int; y_var=:ygap, outcomes, instruments)` | Strict output-gap-targeting rule template |\n| [ngdp_rule](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/rules.jl) | `ngdp_rule(H::Int; pi_var=:infl, y_var=:ygap, outcomes, instruments)` | NGDP-level-targeting rule template |\n| [taylor_rule](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/rules.jl) | `taylor_rule(H::Int; rho=0.5, phi_pi=1.5, phi_y=1.0, z_lag=0.0, ...)` | Inertial Taylor-rule template |\n| [custom_rule](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/rules.jl) | `custom_rule(A_x, A_z; outcomes, instruments, wedge=nothing, name=\"custom\")` | Raw-matrix validated escape hatch for user rules |\n| [weight_matrix](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/loss.jl) | `weight_matrix(H::Int; lambda=1.0, beta=1.0)` | Discounted diagonal loss weight matrix |\n| [policy_loss](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/loss.jl) | `policy_loss(outcomes, H::Int; lambda, beta=1.0, instruments, W_z=nothing, ...)` | Quadratic `PolicyLoss` builder with discounted diagonal blocks |\n| [ait_loss](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/loss.jl) | `ait_loss(H::Int; beta, lambda_avg=0.6, lambda_t=0.4, lambda_y=1.0, ...)` | Average-inflation-targeting loss (PSD-singular by construction) |\n| [smoothing_penalty](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/loss.jl) | `smoothing_penalty(H::Int; lambda=1.0, beta=1.0, z_lag=0.0)` | Instrument-smoothing penalty with initial-condition linear term |\n| [policy_causal_effects](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/empirical.jl) | `policy_causal_effects(bir::BayesianImpulseResponse, shocks, outcomes, instruments; H, normalize, source)` | Causal-effects container from BVAR posterior IRFs |\n| [policy_causal_effects](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/empirical.jl) | `policy_causal_effects(slp::StructuralLP, shocks, outcomes, instruments; H, n_draws, ...)` | Causal-effects container from structural local projections |\n| [policy_causal_effects](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/empirical.jl) | `policy_causal_effects(lpr::LPImpulseResponse, outcomes, instruments; H, n_draws, ...)` | Causal-effects container from LP impulse responses |\n| [policy_causal_effects](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/model_ha.jl) | `policy_causal_effects(spec::ModelSpec, ss; outcomes, instruments, H, T_horizon, rule_closure, ...)` | Rate-wedge news menus from heterogeneous-agent sequence-space Jacobians |\n| [baseline_path](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/empirical.jl) | `baseline_path(ir, nonpolicy_shock, outcomes, instruments; H, negate=false)` | Baseline response path to a non-policy disturbance |\n| [wold_representation](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/empirical.jl) | `wold_representation(m; H, orthogonalize=:cholesky, ...)` | Wold MA representation from VAR/BVAR fits for second-moment counterfactuals |\n| [policy_forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/forecast.jl) | `policy_forecast(fc, outcomes; targets, H, origin)` | Gap-typed `PolicyForecast` from package VAR/BVAR forecasts |\n| [policy_forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/forecast.jl) | `policy_forecast(outcomes, values; sd=nothing, rho=0.9, n_draws=1000, ...)` | Gap-typed `PolicyForecast` from external point plus dispersion inputs |\n| [interp_to_quarterly](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/forecast.jl) | `interp_to_quarterly(annual, H::Int)` | Interpolate annual SEP-style points to a quarterly path |\n| [stacked_irf_target](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/irf_target.jl) | `stacked_irf_target(ce; order=:shock_major, scale, drop, inflate)` | Stacked empirical IRF target for limited-information matching |\n| [ctw_covariance](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/irf_target.jl) | `ctw_covariance(V_bar, block_len::Int; bandwidth=8, eta=1.0)` | CTW-damped covariance for the IRF-matching quasi-likelihood |\n| [policy_news_matrix](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/model_dsge.jl) | `policy_news_matrix(spec, policy_shock, outcomes, instruments; H=100, solver=:gensys, chunk=0)` | Square news menu from a linear DSGE via an augmented news pipeline |\n| [sequence_jacobian](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/model_ha.jl) | `sequence_jacobian(spec, ss, input, output; T_horizon=300, dx=1e-4)` | Fake-news sequence-space Jacobians with anticipation |\n| [cognitive_discounting](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/behavioral.jl) | `cognitive_discounting(J::AbstractMatrix, m::Real)` | Gabaix cognitive discounting of a sequence-space Jacobian |\n| [sticky_expectations](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/behavioral.jl) | `sticky_expectations(J::AbstractMatrix, theta::Real)` | Sticky-expectations operator on a sequence-space Jacobian |\n| [behavioral](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/behavioral.jl) | `behavioral(ce::PolicyCausalEffects; m=1.0, theta=0.0)` | Behavioral variant of a whole square container |\n| [policy_counterfactual](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/counterfactual.jl) | `policy_counterfactual(base, ce, rule; method=:auto, draws=:auto, ...)` | Lucas-robust paths under an alternative rule |\n| [optimal_policy](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/optimal_policy.jl) | `optimal_policy(base, ce, loss; z_wedge=nothing, draws=:auto, ...)` | Loss-minimizing projection over the reachable set |\n| [optimal_rule](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/optimal_policy.jl) | `optimal_rule(ce, loss; z_wedge=nothing)` | Implied optimal targeting rule closing the optimal-policy circle |\n| [counterfactual_moments](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/moments.jl) | `counterfactual_moments(wold, ce, policy; outcomes, instruments, draws=:auto, ...)` | Second-moment counterfactuals under invertibility |\n| [opp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/opp.jl) | `opp(fc, ce, loss; instrument_path=nothing, z_wedge=nothing)` | Optimal policy perturbation point statistic and optimality test |\n| [estimate_opp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/opp.jl) | `estimate_opp(fc, ce, loss; independent=true, levels=(0.60, 0.75, 0.90), n_sim=2000, ...)` | Two-source OPP inference with 60/75/90% bands |\n| [constrained_opp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/constrained.jl) | `constrained_opp(fc, ce, loss, constraints; instrument_path, method=:auto, ...)` | SLSQP constrained OPP for ZLB and pre-commitment pledges |\n| [zlb_constraint](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/constrained.jl) | `zlb_constraint(; floor=0.0, instrument=:rate, horizons=1:typemax(Int))` | Zero-lower-bound linear path-floor constraint |\n| [opp_sequence](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/opp_sequence.jl) | `opp_sequence(forecasts, ce, loss; dates=nothing, ce_by_date=nothing, ...)` | Decision-date OPP history |\n| [opp_sensitivity](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/opp_sequence.jl) | `opp_sensitivity(forecasts, ce, H::Int; lambda_grid, build_loss, ...)` | OPP sequences over a loss-weight grid |\n| [robust_weights](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/opp_sequence.jl) | `robust_weights(seq_builder, theta_grid)` | Time-consistent robust loss weights across sequences |\n| [irf_match](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/model_bank.jl) | `irf_match(menu_builder, target, priors, param_names; name, H_news=25, ...)` | Limited-information CMW quasi-likelihood estimation of one bank member |\n| [posterior_model_probs](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/model_bank.jl) | `posterior_model_probs(members; prior)` | Posterior model probabilities over bank members |\n| [model_average](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/model_bank.jl) | `model_average(members, probs; n_pool=1000, subset=nothing, ...)` | Pooled news menu stacking sampled menus with model uncertainty |\n| [counterfactual_forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/historical.jl) | `counterfactual_forecast(m, data_through_tstar, ce, policy; outcomes, instruments, H, ...)` | Conditional counterfactual forecast from a break date |\n| [counterfactual_history](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/historical.jl) | `counterfactual_history(m, data, t_range, ce, policy; outcomes, instruments, ...)` | Historical counterfactual via forecast revisions |\n| [spanning_diagnostic](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/diagnostics.jl) | `spanning_diagnostic(base, ce_emp, ce_full, policy; draws=:auto, tol=0.1, ...)` | Share of the desired policy change outside the identified span |\n| [forecast_sufficiency](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/diagnostics.jl) | `forecast_sufficiency(sol::DSGESolution, observables; H=40)` | Model-laboratory measure of forecast-sufficiency for historical counterfactuals |\n| [is_square](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/counterfactual/types.jl) | `is_square(ce::PolicyCausalEffects)` | Whether a container is a square model menu or a thin empirical one |\n\n#
