Examples\n\n```julia\nusing MacroEconometricModels\nH = 20\nce = policy_news_matrix(spec, :eps_i, [:infl => :\u03c0, :ygap => :y], [:rate => :i]; H=H)\nbase = baseline_path(irf(solve(spec), H), \"eps_d\",\n                     [:infl => \"\u03c0\", :ygap => \"y\"], [:rate => \"i\"]; H=H)\npc = policy_counterfactual(base, ce, rate_peg_rule(H))\nreport(pc)\n```\n\n# See also\n\n* [Vector Autoregression (VAR)](/multivariate/var.md) - reduced-form IRFs feeding empirical causal-effect containers\n* [Bayesian VAR (BVAR)](/multivariate/bvar.md) - posterior IRF draws for uncertainty bands\n* [Local Projections (LP)](/multivariate/lp.md) - direct IRF estimates as policy menus\n* [DSGE](/dsge/dsge.md) - linear model news menus and laboratory validation\n* [Input-Output Analysis (IO)](/io/io.md) - sectoral structure for applied policy analysis", "testing/teststat": "# Summary\n\nThe `teststat` module (53 source files, the second-largest in the package) is the\nshared battery of hypothesis tests used before estimation (integration order,\ncointegrating rank, structural stability, panel stationarity) and after\nestimation (Granger causality, residual normality, ARCH effects, independence,\ndistributional fit, nested model comparison). Every result type implements the\nStatsAPI.jl interface (`statistic` via field access, `pvalue`, `nobs`, `dof`),\ndescends from `StatsAPI.HypothesisTest`, and renders with `report(result)`; most\nunit root, cointegration, break, and panel results share the\n`AbstractUnitRootTest` branch. Two results are not hypothesis tests:\n`is_stationary` returns an eigenvalue diagnostic with no p-value, and\n`normality_test_suite` returns a container of individual results.\n\n# Functions\n\nThe table is capped at the 50 most important entry points, grouped by test\nfamily. Omitted: the portmanteau trio (`ljung_box_test`, `box_pierce_test`,\n`durbin_watson_test`, documented on the Spectral Analysis page), the group and\nrank comparisons (`equality_test`, `cor_test`), `fisher_johansen_test`,\n`panel_unit_root_summary`, `pvar_lag_selection`, and internal helpers. The\nregression diagnostics (`chow_test`, `cusum_test`, `reset_test`, `white_test`,\nand others) live in the `reg` module, not here.\n\n## Unit root\n\n| Function | Signature | Role |\n|----------|-----------|------|\n| [adf_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/adf.jl) | `adf_test(y; lags=:aic, max_lags=nothing, regression=:constant)` | Baseline Augmented Dickey-Fuller unit root test with MacKinnon p-values |\n| [kpss_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/kpss.jl) | `kpss_test(y; regression=:constant, bandwidth=:auto)` | Stationarity-null test complementing ADF |\n| [pp_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/pp.jl) | `pp_test(y; regression=:constant, bandwidth=:auto)` | Non-parametric Phillips-Perron correction, no lag order needed |\n| [za_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/za.jl) | `za_test(y; regression=:both, trim=0.15, lags=:aic, max_lags=nothing, outlier=:io)` | Zivot-Andrews unit root test with one endogenous break |\n| [ngperron_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/ngperron.jl) | `ngperron_test(y; regression=:constant)` | GLS-detrended MZa/MZt/MSB/MPT suite, best size in small samples |\n| [fourier_adf_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/fourier.jl) | `fourier_adf_test(y; regression=:constant, fmax=3, lags=:aic, max_lags=nothing, trim=0.15)` | ADF with trigonometric terms absorbing smooth breaks of unknown form |\n| [fourier_kpss_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/fourier.jl) | `fourier_kpss_test(y; regression=:constant, fmax=3, bandwidth=nothing)` | Stationarity-null counterpart of the Fourier ADF test |\n| [dfgls_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/dfgls.jl) | `dfgls_test(y; regression=:constant, lags=:aic, max_lags=nothing)` | GLS-detrended ADF with near-optimal power against local alternatives |\n| [ers_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/dfgls.jl) | `ers_test(y; trend=false)` | Elliott-Rothenberg-Stock point-optimal P_T test |\n| [hegy_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/hegy.jl) | `hegy_test(y; frequency=4, deterministic=:const_trend_seas, lags=:auto)` | Seasonal unit roots frequency by frequency (quarterly/monthly) |\n| [lm_unitroot_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/lm_unitroot.jl) | `lm_unitroot_test(y; breaks=0, regression=:level, lags=:aic, max_lags=nothing, trim=0.15)` | LM unit root test with 0/1/2 breaks allowed under the null |\n| [adf_2break_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/adf_2break.jl) | `adf_2break_test(y; model=:level, lags=:aic, max_lags=nothing, trim=0.10)` | ADF with two endogenous breaks in level and slope |\n| [sadf_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/bubble.jl) | `sadf_test(y; r0=:auto, adflag=0, mc_reps=999, cv=:asymptotic, seed=20240716)` | Right-tailed sup-ADF test for a single explosive bubble with date-stamping |\n| [gsadf_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/bubble.jl) | `gsadf_test(y; r0=:auto, adflag=0, mc_reps=999, cv=:asymptotic, seed=20240716)` | Generalized sup-ADF test detecting multiple explosive episodes |\n| [unit_root_summary](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/convenience.jl) | `unit_root_summary(y; tests=[:adf, :kpss, :pp], regression=:constant)` | Runs several tests on one series and synthesizes an ADF/KPSS verdict |\n| [test_all_variables](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/convenience.jl) | `test_all_variables(Y; test=:adf, kwargs...)` | Applies one unit root test to every column of a matrix |\n\n## Cointegration\n\n| Function | Signature | Role |\n|----------|-----------|------|\n| [johansen_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/johansen.jl) | `johansen_test(Y, p; deterministic=:constant, significance=0.05)` | System cointegrating rank via trace and maximum-eigenvalue statistics |\n| [engle_granger_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/engle_granger.jl) | `engle_granger_test(y, X; trend=:constant, lags=:aic, max_lags=nothing)` | Two-step ADF on cointegrating residuals; null is no cointegration |\n| [phillips_ouliaris_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/phillips_ouliaris.jl) | `phillips_ouliaris_test(y, X; trend=:constant, kernel=:bartlett, bandwidth=:nw)` | Semiparametric Z_t/Z_alpha residual tests; no lag order needed |\n| [hansen_instability_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/hansen_instability.jl) | `hansen_instability_test(m::CointRegModel)` | L_c stability test on a fitted cointegrating regression |\n| [park_added_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/park_added.jl) | `park_added_test(m::CointRegModel; q_add=2, kernel=:bartlett, bandwidth=:nw)` | H(p,q) superfluous-trend test of genuine vs spurious cointegration |\n\n## Structural breaks\n\n| Function | Signature | Role |\n|----------|-----------|------|\n| [andrews_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/andrews.jl) | `andrews_test(y, X; test=:supwald, trimming=0.15)` | Single unknown break; nine sup/exp/mean Wald, LR, and LM variants |\n| [bai_perron_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/bai_perron.jl) | `bai_perron_test(y, X; max_breaks=5, trimming=0.15, criterion=:bic)` | Multiple breaks via dynamic programming with BIC/LWZ selection |\n| [factor_break_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/factor_break.jl) | `factor_break_test(X, r; method=:breitung_eickmeier, kwargs...)` | Factor loading instability (pooled LM, sup-LM, sup-Wald) |\n| [gregory_hansen_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/gregory_hansen.jl) | `gregory_hansen_test(Y; model=:C, lags=:aic, max_lags=nothing, trim=0.15)` | Cointegration allowing one regime shift in the long-run relationship |\n\n## Diagnostics\n\n| Function | Signature | Role |\n|----------|-----------|------|\n| [is_stationary](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/stationarity.jl) | `is_stationary(model::VARModel)` | VAR companion eigenvalue stability check (no p-value) |\n| [granger_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/granger.jl) | `granger_test(model::VARModel, cause, effect)` | Pairwise or block Wald test of predictive causality |\n| [granger_test_all](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/granger.jl) | `granger_test_all(model::VARModel)` | Granger causality for every ordered variable pair |\n| [normality_test_suite](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/normality.jl) | `normality_test_suite(U)` / `normality_test_suite(model::VARModel)` | Seven multivariate normality tests in one call |\n| [arch_lm_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/arch_diagnostics.jl) | `arch_lm_test(y, q=5)` | Engle ARCH-LM test for remaining conditional heteroskedasticity |\n| [ljung_box_squared](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/arch_diagnostics.jl) | `ljung_box_squared(z, K=10)` | Ljung-Box test on squared residuals as an ARCH check |\n| [bds_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/bds.jl) | `bds_test(y; m=2:6, eps_frac=0.7, bootstrap=0, seed=1234)` | Independence test against any departure from i.i.d. |\n| [edf_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/edf.jl) | `edf_test(y; dist=:normal, test=:ad, params=:estimate, theta=nothing)` | EDF goodness-of-fit (KS, AD, CvM, Watson) against parametric families |\n| [variance_ratio_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/variance_ratio.jl) | `variance_ratio_test(y; q=[2,4,8,16], method=:lomackinlay, bootstrap=0, robust=true, boot_weights=:rademacher, seed=1234)` | Lo-MacKinlay/Wright random-walk tests, optionally wild-bootstrapped |\n| [lr_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/model_comparison.jl) | `lr_test(m1, m2)` | Likelihood ratio test for nested models |\n| [lm_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/model_comparison.jl) | `lm_test(m1, m2)` | Lagrange multiplier (score) test for nested models |\n\n## Panel\n\n| Function | Signature | Role |\n|----------|-----------|------|\n| [llc_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/llc.jl) | `llc_test(X; deterministic=:constant, lags=:auto, max_lags=nothing, criterion=:aic, cs_demean=false)` | Levin-Lin-Chu pooled panel unit root test under a common root |\n| [ips_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/ips.jl) | `ips_test(X; deterministic=:constant, lags=:auto, max_lags=nothing, criterion=:aic, cs_demean=false)` | Im-Pesaran-Shin averaged per-unit ADF test under heterogeneous roots |\n| [breitung_panel_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/breitung_panel.jl) | `breitung_panel_test(X; deterministic=:constant, lags=0, cs_demean=false)` | Bias-free pooled panel unit root test via forward orthogonal deviations |\n| [fisher_panel_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/fisher_panel.jl) | `fisher_panel_test(X; base=:adf, combine=:mw, lags=:auto, deterministic=:constant, cs_demean=false)` | Maddala-Wu/Choi combination of per-unit ADF or PP p-values |\n| [hadri_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/hadri.jl) | `hadri_test(X; deterministic=:constant, hetero=true, cs_demean=false)` | Panel KPSS: LM test with a stationarity null |\n| [panic_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/panic.jl) | `panic_test(X; r=:auto, method=:pooled)` | Bai-Ng factor decomposition into common and idiosyncratic components |\n| [pesaran_cips_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/pesaran_cips.jl) | `pesaran_cips_test(X; lags=:auto, deterministic=:constant)` | Cross-sectionally augmented IPS test robust to a common factor |\n| [moon_perron_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/moon_perron.jl) | `moon_perron_test(X; r=:auto)` | Factor-adjusted pooled panel unit root test with bias correction |\n| [pedroni_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/pedroni.jl) | `pedroni_test(pd, y, xs...; trend=:constant, lags=:auto, adf_lags=2)` | Residual-based panel cointegration tests on PanelData |\n| [kao_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/kao.jl) | `kao_test(pd, y, xs...; lags=:auto, kernel_lags=:auto)` | Homogeneous panel cointegration test on PanelData |\n| [westerlund_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/westerlund.jl) | `westerlund_test(pd, y, xs...; trend=:constant, lags=1, leads=0, lrwindow=2, bootstrap=0, seed=20240716)` | Error-correction-based panel cointegration tests |\n| [dh_causality_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/dumitrescu_hurlin.jl) | `dh_causality_test(pd, x, y; p=1, bootstrap=0, seed=1234)` | Dumitrescu-Hurlin heterogeneous-panel Granger non-causality |\n| [pvar_hansen_j](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/pvar_hansen_j.jl) | `pvar_hansen_j(model::PVARModel)` | Hansen J-test of PVAR overidentifying restrictions |\n| [pvar_mmsc](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/pvar_mmsc.jl) | `pvar_mmsc(model::PVARModel; hq_criterion=2.1)` | Andrews-Lu MMSC lag/order selection criteria for PVARs |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfred = load_example(:fred_md)\ncpi = filter(isfinite, fred[:, \"CPIAUCSL\"])\nresult = adf_test(cpi; lags=:aic, regression=:constant)\nreport(result)\n```\n\nThe statistic (\u2248 2.15) lies far above the 5% critical value (\u2248 \u22122.85), so the\ntest fails to reject the unit root null \u2014 the expected verdict for a price\nlevel. Confirm with `kpss_test`, whose null is stationarity, before differencing.\n\n# See also\n\n- [/multivariate/var.md](/multivariate/var.md) \u2014 VAR estimation whose lagged dynamics these tests validate\n- [/multivariate/vecm.md](/multivariate/vecm.md) \u2014 VECM estimation consuming Johansen cointegrating vectors\n- [/univariate/arima.md](/univariate/arima.md) \u2014 univariate models specified after unit root screening\n- [/panel/index.md](/panel/index.md) \u2014 panel estimation validated by the panel tests", "univariate/arch": "# Summary\n\nThe `arch` module implements the ARCH(q) model of Engle (1982), the foundation\nof the GARCH family: conditional variance is a function of past squared\ninnovations, `sigma2_t = omega + sum alpha_i * eps2_{t-i}`. Estimation is\ntwo-stage maximum likelihood (Nelder-Mead start, L-BFGS refinement) with\nlog-transformed parameters enforcing positivity and delta-method standard\nerrors. Stationarity requires `sum alpha < 1`. The module also defines the\nshared `AbstractVolatilityModel` show machinery and `VolatilityForecast`\nplotting used by the whole volatility family.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_arch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arch/estimation.jl) | `estimate_arch(y, q; method=:mle)` | Two-stage MLE of ARCH(q); returns ARCHModel |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arch/forecast.jl) | `forecast(m, h; conf_level=0.95, n_sim=10000, ...)` | Simulation-based multi-step variance forecasts; returns VolatilityForecast |\n| [persistence](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arch/types.jl) | `persistence(m)` | Volatility persistence `sum alpha` |\n| [halflife](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arch/types.jl) | `halflife(m)` | Shock half-life `log(0.5)/log(persistence)`; `Inf` if non-stationary |\n| [unconditional_variance](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arch/types.jl) | `unconditional_variance(m)` | Long-run variance `omega / (1 - sum alpha)` |\n| [arch_order](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arch/types.jl) | `arch_order(m)` | ARCH order q |\n| [arch_lm_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/arch_diagnostics.jl) | `arch_lm_test(y, q=5)` or `arch_lm_test(m, q=5)` | Engle ARCH-LM test on raw data or fitted-model residuals |\n| [ljung_box_squared](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/arch_diagnostics.jl) | `ljung_box_squared(z, K=10)` or `ljung_box_squared(m, K=10)` | Ljung-Box test on squared standardized residuals |\n| [StatsAPI interface](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arch/types.jl) | `coef`, `nobs`, `residuals`, `predict`, `loglikelihood`, `aic`, `bic`, `stderror`, `vcov`, `confint` | Standard accessors (`predict` returns the conditional variance series) |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfred = load_example(:fred_md)\nspx = filter(isfinite, to_vector(apply_tcode(fred[:, [\"S&P 500\"]])))\narch = estimate_arch(spx, 3)\nreport(arch)\nfc = forecast(arch, 20; conf_level=0.95)\nreport(fc)\n```\n\n# See also\n\n* [GARCH Models](/univariate/garch.md) - Parsimonious persistence via lagged variances, leverage, and long-memory extensions.\n* [Stochastic Volatility](/univariate/sv.md) - Parameter-driven latent-volatility alternative to ARCH.\n* [Spectral Analysis](/univariate/spectral.md) - Portmanteau serial-correlation tests.\n* [MacroEconometricModels.jl overview](/overview.md) - Package feature map.", "univariate/arima": "# Summary\n\nThe `arima` module implements the full Box-Jenkins workflow for univariate\nARIMA-class models: AR(p) via OLS or exact MLE, MA(q) and ARMA(p,q) via CSS,\nexact MLE, or CSS-MLE, ARIMA(p,d,q) via d-fold differencing, multiplicative\nseasonal SARIMA(p,d,q)(P,D,Q)s, and fractional ARFIMA(p,d,q) for long memory.\nExact MLE runs through a Kalman-filter state-space likelihood; order selection\nis by AIC/BIC grid search (`select_arima_order`), stepwise or exhaustive\n`auto_arima`, and `auto_sarima` with HEGY/KPSS differencing selection.\nAll models implement the StatsAPI regression interface and `report()`.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_ar](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/estimation.jl) | `estimate_ar(y, p; method=:ols, include_intercept=true)` | Estimate AR(p) by OLS or exact MLE; returns ARModel |\n| [estimate_ma](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/estimation.jl) | `estimate_ma(y, q; method=:css_mle, include_intercept=true, max_iter=500)` | Estimate MA(q); returns MAModel |\n| [estimate_arma](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/estimation.jl) | `estimate_arma(y, p, q; method=:css_mle, include_intercept=true, max_iter=500)` | Estimate ARMA(p,q); returns ARMAModel |\n| [estimate_arima](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/estimation.jl) | `estimate_arima(y, p, d, q; method=:css_mle, include_intercept=true, max_iter=500)` | Difference d times then fit ARMA(p,q); returns ARIMAModel |\n| [estimate_sarima](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/sarima.jl) | `estimate_sarima(y, p, d, q, P, D, Q, s; method=:css_mle, include_intercept=true, max_iter=500)` | Multiplicative seasonal ARIMA via expanded ARMA; returns SARIMAModel |\n| [estimate_arfima](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/arfima.jl) | `estimate_arfima(y, p, q; method=:css, d0=nothing, trunc=200, max_iter=500)` | Fractional ARFIMA with d in (-0.5, 0.5); returns ARFIMAModel |\n| [select_arima_order](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/selection.jl) | `select_arima_order(y, max_p, max_q; criterion=:bic, d=0, method=:css_mle, include_intercept=true)` | AIC/BIC grid search over (p,q); returns ARIMAOrderSelection |\n| [auto_arima](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/selection.jl) | `auto_arima(y; max_p=5, max_q=5, max_d=2, criterion=:bic, method=:css_mle, include_intercept=true, stepwise=true)` | ADF-based d selection plus stepwise (p,q) search |\n| [auto_sarima](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/sarima.jl) | `auto_sarima(y, s; d=nothing, D=nothing, max_p=2, max_q=2, max_P=1, max_Q=1, criterion=:aic, method=:css_mle, include_intercept=true)` | Seasonal order search with HEGY/KPSS differencing selection |\n| [ic_table](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/selection.jl) | `ic_table(result; criterion=:bic)` | Render the AIC/BIC grid from a selection result |\n| [gph_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/arfima.jl) | `gph_test(y; m=:default, trim=0)` | Geweke-Porter-Hudak log-periodogram estimate of d; returns GPHResult |\n| [local_whittle](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/arfima.jl) | `local_whittle(y; m=:default)` | Robinson Gaussian semiparametric estimate of d; returns LocalWhittleResult |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/forecast.jl) | `forecast(model, h; conf_level=0.95)` | Multi-step forecasts with psi-weight intervals; returns ARIMAForecast |\n| [StatsAPI interface](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/arima/types.jl) | `fit`, `predict`, `coef`, `nobs`, `dof`, `residuals`, `fitted`, `loglikelihood`, `aic`, `bic`, `r2`, `stderror`, `vcov`, `confint` | Standard regression-model accessors for every ARIMA-class model |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfred = load_example(:fred_md)\ny = filter(isfinite, diff(log.(fred[:, \"CPIAUCSL\"])))[end-99:end]\nar = estimate_ar(y, 2)\nfc = forecast(ar, 12; conf_level=0.95)\nreport(fc)\n```\n\n# See also\n\n* [Spectral Analysis](/univariate/spectral.md) - ACF/PACF correlograms for order identification and Ljung-Box diagnostics.\n* [Time Series Filters](/univariate/filters.md) - Beveridge-Nelson decomposition selects its ARMA order via `auto_arima`.\n* [X-13ARIMA-SEATS](/univariate/x13.md) - Seasonal adjustment built on seasonal ARIMA models.\n* [MacroEconometricModels.jl overview](/overview.md) - Package feature map.", "univariate/filters": "# Summary\n\nThe `filters` module provides five trend-cycle decompositions: the\nHodrick-Prescott penalized smoother with frequency-matched lambda, the\nHamilton (2018) predictive-regression filter, the Beveridge-Nelson\npermanent-transitory decomposition (ARIMA or correlated unobserved-components\nstate-space route), the Baxter-King band-pass filter, and the iterated boosted\nHP filter with BIC, ADF, or fixed stopping. Every result supports the unified\n`trend()` and `cycle()` accessors plus `report()` and `plot_result()`, so\nconsuming code never needs to know which filter produced a decomposition.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [hp_filter](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/hp.jl) | `hp_filter(y; lambda=1600)` | Penalized-least-squares smoother; returns HPFilterResult |\n| [hamilton_filter](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/hamilton.jl) | `hamilton_filter(y; h=8, p=4)` | OLS projection filter; loses h+p-1 obs; returns HamiltonFilterResult |\n| [beveridge_nelson](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/beveridge_nelson.jl) | `beveridge_nelson(y; method=:arima, p=:auto, q=:auto, max_terms=500, cycle_order=2)` | Permanent-transitory split; returns BeveridgeNelsonResult |\n| [baxter_king](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/baxter_king.jl) | `baxter_king(y; pl=6, pu=32, K=12)` | Symmetric band-pass filter; loses K obs per end; returns BaxterKingResult |\n| [boosted_hp](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/boosted_hp.jl) | `boosted_hp(y; lambda=1600, stopping=:BIC, max_iter=100, sig_p=0.05)` | Iterated HP with data-driven stopping; returns BoostedHPResult |\n| [trend](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/types.jl) | `trend(r)` | Unified trend accessor (permanent component for Beveridge-Nelson) |\n| [cycle](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/types.jl) | `cycle(r)` | Unified cycle accessor (transitory component for Beveridge-Nelson) |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfred = load_example(:fred_md)\ny = filter(isfinite, log.(fred[:, \"INDPRO\"]))\nhp = hp_filter(y; lambda=129600.0)\nreport(hp)\nstd(cycle(hp))\n```\n\n# See also\n\n* [X-13ARIMA-SEATS](/univariate/x13.md) - Removes the seasonal component rather than the trend.\n* [Spectral Analysis](/univariate/spectral.md) - `transfer_function` plots each filter's frequency response.\n* [ARIMA Models](/univariate/arima.md) - Beveridge-Nelson selects its ARMA order via `auto_arima`.\n* [MacroEconometricModels.jl overview](/overview.md) - Package feature map.", "univariate/garch": "# Summary\n\nThe `garch` module covers the observation-driven volatility family: standard\nGARCH(p,q), EGARCH and GJR-GARCH for leverage effects, GARCH-MIDAS for\nmixed-frequency long-run variance, FIGARCH/FIEGARCH for long-memory\npersistence, plus IGARCH, component GARCH, and APARCH. GARCH, EGARCH, and\nGJR-GARCH support Gaussian, standardized Student-t, and GED conditional\ndistributions via `dist`, and report Bollerslev-Wooldridge QMLE-robust\nstandard errors by default. Shared tools include news impact curves,\nsimulation-based multi-step forecasts, and the Engle-Ng sign-bias and\nNyblom-Hansen stability tests.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_garch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/estimation.jl) | `estimate_garch(y, p=1, q=1; method=:mle, dist=:normal)` | GARCH(p,q); `dist` selects `:normal`, `:student`, or `:ged` |\n| [estimate_egarch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/estimation.jl) | `estimate_egarch(y, p=1, q=1; method=:mle, dist=:normal)` | Log-variance EGARCH with leverage; no positivity constraints |\n| [estimate_gjr_garch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/estimation.jl) | `estimate_gjr_garch(y, p=1, q=1; method=:mle, dist=:normal)` | Threshold GARCH with indicator leverage term |\n| [estimate_garch_midas](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/midas.jl) | `estimate_garch_midas(r, x_lf; K=12, m_freq, rv=:macro, span=:fixed)` | MIDAS with exogenous low-frequency driver; returns GarchMidasModel |\n| [estimate_garch_midas](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/midas.jl) | `estimate_garch_midas(r; K=12, m_freq, rv=:realized, span=:fixed)` | MIDAS with block realized variance as the long-run driver |\n| [estimate_figarch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/figarch.jl) | `estimate_figarch(r; p=1, q=1, d0=0.4, truncation=1000, dist=:normal)` | Fractionally integrated GARCH; truncated ARCH(inf) recursion |\n| [estimate_fiegarch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/figarch.jl) | `estimate_fiegarch(r; p=1, q=1, d0=0.4, truncation=1000, dist=:normal)` | Log-variance FIEGARCH with asymmetric news function |\n| [estimate_igarch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/estimation.jl) | `estimate_igarch(y, p=1, q=1; method=:mle)` | Unit-persistence IGARCH; RiskMetrics EWMA is the `omega=0` case |\n| [estimate_cgarch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/estimation.jl) | `estimate_cgarch(y; method=:mle)` | Engle-Lee permanent/transitory component GARCH(1,1) |\n| [estimate_aparch](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/estimation.jl) | `estimate_aparch(y, p=1, q=1; fix_delta=nothing, fix_gamma=nothing, method=:mle)` | Asymmetric power ARCH; nests GARCH, GJR, and TARCH |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/forecast.jl) | `forecast(m, h; conf_level=0.95, n_sim=10000, ...)` | Simulation-based variance forecasts for every GARCH-family model |\n| [news_impact_curve](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/diagnostics.jl) | `news_impact_curve(m; range=(-3.0, 3.0), n_points=200)` | Shock-to-variance map; returns `(shocks, variance)` |\n| [component_variances](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/types.jl) | `component_variances(m)` | CGARCH permanent, transitory, and total variance series |\n| [sign_bias_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/diagnostics.jl) | `sign_bias_test(z_or_model)` | Engle-Ng joint sign/size-bias test for missed asymmetry |\n| [nyblom_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/diagnostics.jl) | `nyblom_test(m)` | Nyblom-Hansen parameter-stability test with Hansen critical values |\n| [persistence](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/types.jl) | `persistence(m)` | Model-specific persistence (sums of alpha/beta/gamma, or d) |\n| [halflife](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/types.jl) | `halflife(m)` | Shock half-life; `Inf` when persistence is 1 |\n| [unconditional_variance](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/types.jl) | `unconditional_variance(m)` | Model-specific long-run variance |\n| [arch_order](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/types.jl) | `arch_order(m)` | ARCH order q |\n| [garch_order](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/garch/types.jl) | `garch_order(m)` | GARCH order p |\n| [arch_lm_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/arch_diagnostics.jl) | `arch_lm_test(y, q=5)` or `arch_lm_test(m, q=5)` | Engle ARCH-LM test on raw data or fitted-model residuals |\n| [ljung_box_squared](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/arch_diagnostics.jl) | `ljung_box_squared(z, K=10)` or `ljung_box_squared(m, K=10)` | Ljung-Box test on squared standardized residuals |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfred = load_example(:fred_md)\nspx = filter(isfinite, to_vector(apply_tcode(fred[:, [\"S&P 500\"]])))\ngarch = estimate_garch(spx, 1, 1)\nreport(garch)\n(persistence = persistence(garch), halflife = halflife(garch))\n```\n\n# See also\n\n* [ARCH Models](/univariate/arch.md) - The single-lag foundation of the GARCH family.\n* [Stochastic Volatility](/univariate/sv.md) - Latent-volatility alternative with leverage and Student-t errors.\n* [Multivariate GARCH](/multivariate/) - CCC, DCC, and BEKK covariance models reusing these margins.\n* [MacroEconometricModels.jl overview](/overview.md) - Package feature map.", "univariate/spectral": "# Summary\n\nThe `spectral` module is a time- and frequency-domain toolkit: sample ACF,\nPACF (Levinson-Durbin or OLS), and CCF with cumulative Ljung-Box Q-statistics;\nthe raw periodogram plus three consistent spectral density estimators (Welch,\nDaniell-smoothed, Burg AR parametric); Welch-based cross-spectra with\ncoherence, phase, and gain; the ideal bandpass filter and analytical transfer\nfunctions for the HP, Baxter-King, and Hamilton filters; and white-noise\ndiagnostics (Fisher hidden-periodicity, Bartlett cumulative periodogram, and\nthe Ljung-Box, Box-Pierce, and Durbin-Watson portmanteau tests, which live in\n`src/teststat/`). All frequencies are radians per observation on `[0, pi]`.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [acf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/acf.jl) | `acf(y; lags=0, conf_level=0.95)` | Sample ACF with Ljung-Box Q-stats; returns ACFResult |\n| [pacf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/acf.jl) | `pacf(y; lags=0, method=:levinson, conf_level=0.95)` | Partial ACF via Levinson-Durbin or OLS |\n| [acf_pacf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/acf.jl) | `acf_pacf(y; lags=0, method=:levinson, conf_level=0.95)` | Joint correlogram in a single pass |\n| [ccf](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/acf.jl) | `ccf(x, y; lags=0, conf_level=0.95)` | Cross-correlation on lags `-k:k` |\n| [periodogram](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/estimation.jl) | `periodogram(y; window=:rectangular, conf_level=0.95)` | Raw FFT periodogram (inconsistent by design) |\n| [spectral_density](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/estimation.jl) | `spectral_density(y; method=:welch, kwargs...)` | Consistent estimators: `:welch`, `:smoothed`, `:ar` |\n| [cross_spectrum](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/cross.jl) | `cross_spectrum(x, y; window=:hann, segment_length=0, overlap=0.5)` | Welch cross-spectrum; returns CrossSpectrumResult |\n| [coherence](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/cross.jl) | `coherence(x, y; kwargs...)` | Convenience accessor returning `(freq, squared-coherence)` |\n| [phase](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/cross.jl) | `phase(x, y; kwargs...)` | Convenience accessor returning `(freq, lead-lag-phase)` |\n| [gain](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/cross.jl) | `gain(x, y; kwargs...)` | Convenience accessor returning `(freq, amplitude-ratio)` |\n| [band_power](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/diagnostics.jl) | `band_power(result, f_low, f_high)` | Trapezoidal variance share of a spectral density over a band |\n| [ideal_bandpass](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/filtering.jl) | `ideal_bandpass(y, f_low, f_high)` | Sharp-cutoff frequency filter (Gibbs ringing warning applies) |\n| [transfer_function](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/filtering.jl) | `transfer_function(filter; lambda=1600, K=12, h=8, n_freq=256)` | Gain/phase of `:hp`, `:bk`, or `:hamilton`; returns TransferFunctionResult |\n| [fisher_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/diagnostics.jl) | `fisher_test(y)` | Fisher exact test for a hidden periodicity |\n| [bartlett_white_noise_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/spectral/diagnostics.jl) | `bartlett_white_noise_test(y)` | KS test of the cumulative normalized periodogram |\n| [ljung_box_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/portmanteau.jl) | `ljung_box_test(y; lags=0, fitdf=0)` | Portmanteau autocorrelation test (defined in teststat) |\n| [box_pierce_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/portmanteau.jl) | `box_pierce_test(y; lags=0, fitdf=0)` | Original Box-Pierce Q test (defined in teststat) |\n| [durbin_watson_test](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/teststat/portmanteau.jl) | `durbin_watson_test(resid)` | First-order autocorrelation test (defined in teststat) |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfred = load_example(:fred_md)\ny = filter(isfinite, to_vector(apply_tcode(fred[:, [\"INDPRO\"]])))[end-99:end]\nresult = acf_pacf(y; lags=24)\nshow(stdout, result)\nsd = spectral_density(y; method=:welch)\nshow(stdout, sd)\n```\n\n# See also\n\n* [ARIMA Models](/univariate/arima.md) - The correlogram feeds ARMA order selection.\n* [Time Series Filters](/univariate/filters.md) - Filters whose frequency responses `transfer_function` evaluates.\n* [ARCH Models](/univariate/arch.md) - ARCH-LM and squared-residual diagnostics for fitted volatility models.\n* [MacroEconometricModels.jl overview](/overview.md) - Package feature map.", "univariate/sv": "# Summary\n\nThe `sv` module implements the parameter-driven stochastic volatility model of\nTaylor (1986): returns load on a latent AR(1) log-variance with its own\ninnovation, unlike the observation-driven GARCH family. Estimation is the\nKim-Shephard-Chib (1998) Gibbs sampler with the Omori et al. (2007)\n10-component mixture approximation, a simulation smoother for the latent\nstates, and weakly informative default priors. Variants add a leverage\ncorrelation between return and volatility shocks (`leverage=true`) or\nStudent-t observation errors (`dist=:studentt`). Forecasts are posterior\npredictive simulations from the MCMC draws.\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [estimate_sv](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/sv/estimation.jl) | `estimate_sv(y; n_samples=2000, burnin=1000, dist=:normal, leverage=false, quantile_levels=[0.025, 0.5, 0.975], seed=nothing, rng=...)` | KSC Gibbs sampler fit; returns SVModel with posterior draws |\n| [forecast](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/sv/forecast.jl) | `forecast(m, h; conf_level=0.95, rng=...)` | Posterior predictive volatility forecast; returns VolatilityForecast |\n| [persistence](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/sv/types.jl) | `persistence(m)` | Posterior mean of the log-volatility persistence `phi` |\n| [unconditional_variance](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/sv/types.jl) | `unconditional_variance(m)` | Long-run variance `exp(E[mu])` |\n\n# Examples\n\n```julia\nusing MacroEconometricModels\nfred = load_example(:fred_md)\nspx = filter(isfinite, to_vector(apply_tcode(fred[:, [\"S&P 500\"]])))\nsv = estimate_sv(spx; n_samples=2000, burnin=1000)\nreport(sv)\nfc = forecast(sv, 20; conf_level=0.95)\nreport(fc)\n```\n\n# See also\n\n* [ARCH Models](/univariate/arch.md) - Observation-driven conditional variance foundation.\n* [GARCH Models](/univariate/garch.md) - EGARCH and GJR-GARCH leverage counterparts to SV leverage.\n* [MacroEconometricModels.jl overview](/overview.md) - Package feature map.", "univariate/x13": "# Summary\n\nThe `x13` module is a pure-Julia port of the Census X-13ARIMA-SEATS seasonal\nadjustment program with zero external dependencies. The single entry point\n`x13_filter` always computes both decompositions and reports the one selected\nby `method`: X-11 iterative moving-average decomposition with Henderson trend\nfilters, or model-based SEATS Wiener-Kolmogorov signal extraction from an\nautomatically identified seasonal ARIMA (TRAMO-style search with AICC\nselection and automatic log-versus-level choice). Only monthly and quarterly\nfrequencies are accepted. Note the documented release limits: the\ntrading-day, Easter, outlier, and `model` keywords are accepted but inert,\nand a failed SEATS step silently falls back to X-11 (check `r.method`).\n\n# Functions\n\n| Function | Signature | Role |\n|---|---|---|\n| [x13_filter](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/x13.jl) | `x13_filter(y; frequency=12, method=:seats, start=(1,1), transform=:auto, model=:auto, trading_day=false, easter=false, easter_window=8, outliers=true, critical_value=0.0)` | Seasonal adjustment; returns X13FilterResult |\n| [trend](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/types.jl) | `trend(r)` | Trend-cycle component |\n| [cycle](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/types.jl) | `cycle(r)` | Irregular component (filter-interface compatibility) |\n| [seasonal](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/x13.jl) | `seasonal(r)` | Seasonal component |\n| [adjusted](https://github.com/FriedmanJP/MacroEconometricModels.jl/blob/3d12bb6c/src/filters/x13.jl) | `adjusted(r)` | Seasonally adjusted series |\n\n# Examples\n\n```julia\nusing MacroEconometricModels, Random, Statistics\nRandom.seed!(1)\nt = 1:120\ny = 100.0 .+ 0.5 .* t .+ 10.0 .* sin.(2\u03c0 .* t ./ 12) .+ randn(120)\nr = x13_filter(y; frequency=12, method=:x11)\nreport(r)\nstd(seasonal(r))\n```\n\n# See also\n\n* [Time Series Filters](/univariate/filters.md) - Trend-cycle decomposition; shares the `trend`/`cycle` accessor interface.\n* [ARIMA Models](/univariate/arima.md) - Seasonal ARIMA machinery behind the automatic model search.\n* [Spectral Analysis](/univariate/spectral.md) - Frequency-domain tools complementing SEATS signal extraction.\n* [MacroEconometricModels.jl overview](/overview.md) - Package feature map."}, "types": ["Feature", "Package", "Reference"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981", "Feature": "#3b82f6", "Package": "#8b5cf6"}};
</script>
<script>

(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
